rect cause and effect.", "answer": "While/ Although/ Though", "explain": "考查连词。句意：尽管在考虑了吸烟和饮酒等因素后，这种关联仍然存在，但这仍然不足以证明直接的因果关系。根据“the association still persisted..., not enough to prove... (关联仍然存在，不足以证明)”可知，此处表示 让步关系“虽然，尽管”，应用连词while/ although/ though，句首字母大写。故填While/ Although/ Though。", "source": "上海市杨浦区复旦大学附属中学2025-2026学年高三上学期9月开学英语试题", "batch": "名校名卷汇编", "id": 27}, {"q": "Safety organisations are beginning to notice. From January new rules from Euro NCAP, an organisation that provides safety ratings, will mean no car can get a full five-star score ________ certain crucial functions are controlled by real switches.", "answer": "unless", "explain": "考查连词。句意：从1月起，提供安全评级的组织欧洲新车安全评鉴（Euro NCAP）的新规定意味着，除非某些关键功能由实体开关控制，否则没有汽车能获得满分五星评级。此处引导状语从句，结合句意，此处表示“除非、如果不”，用连词unless。故填unless。", "source": "上海市杨浦区复旦大学附属中学2025-2026学年高三上学期9月开学英语试题", "batch": "名校名卷汇编", "id": 28}, {"q": "New research suggests that not only was Mars once a perfect holiday destination ________ you’re willing to overlook the radiation exposure and absence of food sources, but was also in possession of the right conditions to host alien life.", "answer": "if", "explain": "考查连词。句意：新的研究表明，只要你愿意忽略辐射暴露和食物来源的缺失，火星不仅曾经是一个完美的度假胜地，而且还具备孕育外星生命的适宜条件。根据句意可知，此处引导条件状语从句，表示“如果；只要”，用连词if。故填if。", "source": "2025-2026学年上海市华二高三上学期第二次周测英语试题", "batch": "名校名卷汇编", "id": 29}, {"q": "________ ________ a Tweenbot got caught under a park bench, ground futilely (徒劳地) against a curb, or became trapped in a pothole (坑洼), some passer - by would always rescue it and send it toward its goal.", "answer": "Each time/Every time", "explain": "考查状语从句。句意：每次Tween bot被卡在公园长椅下，徒劳地撞在路缘上，或者掉进坑洞里时，总会有过路人把它救出来，送它朝目标前进。‌“_____ a Tweenbot got caught under a park bench”是时间状语从句，结合句意，表示“每次……的时候”，用each time或者every time引导该从句，且句首单词首字母大写。故填Each time/Every time。", "source": "2025-2026学年上海市黄浦区大同中学高三上学期9月月考英语试题", "batch": "名校名卷汇编", "id": 30}, {"q": "The collision of the oxygen molecules is key ________ they block infrared (红外线的) light from the telescope, creating patterns in the spectrum (光谱) that help determine the composition of the atmosphere.", "answer": "because/as/since", "explain": "考查状语从句。句意：氧分子的碰撞是关键，因为它们阻挡了射向望远镜的红外光，在光谱中形成了有助于确定大气成分的模式。前后句是因果关系，后句解释原因，用because/as/since引导原因状语从句。故填because/as/since。", "source": "2025-2026学年上海市格致中学高三上学期10月月考英语试卷", "batch": "名校名卷汇编", "id": 31}, {"q": "What made the findings interesting is that many Chinese words are used in pinyin, which is the Romanized form of Chinese. ________pinyin uses letters, it is easier for English speakers to read and remember.", "answer": "Because/Since", "explain": "考查原因状语从句。句意：因为拼音使用字母，所以对于说英语的人来说，它更容易阅读和记忆。此处前后两句为因果关系，应用连词because/since，引导原因状语从句，位于句首，首字母需大写。故填Because/Since。", "source": "2025-2026学年上海市格致中学高三上学期期中英语试卷", "batch": "名校名卷汇编", "id": 32}, {"q": "Even ________ the price of fuel, one of airlines’ main expenses, collapsed alongside the oil price, little of that benefit was passed on to consumers through lower prices, with revenues remaining fairly flat.", "answer": "though/if", "explain": "考查连词。句意：尽管航空公司的主要支出之一——燃油价格随着油价下跌而大幅下降，但这些好处几乎没有通过降价传递给消费者，收入基本持平。前后句为让步关系，“even though/if”为固定搭配，意为“尽管、即使”，符合“成本下降却不降价”的逻辑。故填though或if。", "source": "2025-2026学年上海市华东师范大学第二附属中学高三上学期期中考试英语试题", "batch": "名校名卷汇编", "id": 33}, {"q": "Under the new “3+3” system, Chinese, English and math remain the compulsory core subjects, ________ the three electives are to be chosen from a pool of six subjects.", "answer": "while", "explain": "考查连词。句意：在新的“3+3”制度下，语文、英语和数学仍然是必修的核心科目，而三门选修课将从六门科目中选择。前后句之间为对比关系，应用连词while连接。故填while。", "source": "2025-2026学年上海市建平中学高三上学期10月阶段测试英语试题", "batch": "名校名卷汇编", "id": 34}, {"q": "Relationships often allow us to overlook flaws, __________ if the trigger is a true dealbreaker — something morally unacceptable — it’s time to trust your instincts and move on.", "answer": "but", "explain": "考查连词。句意：感情常常让我们忽略缺点，但如果导火索是真正的分手者——道德上不可接受的事情——是时候相信你的直觉，继续前进了。结合前后文语境可知为转折关系，应用连词but。故填but。", "source": "2025-2026学年上海市建平中学高三上学期11月练习英语试卷", "batch": "名校名卷汇编", "id": 35}, {"q": "Rule breaches lead to a yellow or red card-then elimination. At the end, teams have 20 minutes to sort items into bags ________ points are counted.", "answer": "before", "explain": "考查时间状语从句。句意：最后，各队有20分钟将物品分类装入袋中，之后统计分数。根据句意，是在分类之后统计分数，即在统计分数之前，用before引导时间状语从句。故填before。", "source": "2025-2026学年上海市实验学校高三上学期10月考月考英语试卷", "batch": "名校名卷汇编", "id": 36}, {"q": "Nowadays ________ climate disruption accelerates and social fragility deepens, care is the connective tissue that keeps communities alive. If we fail to recognise and support it, we weaken the very systems we will need to face what is coming.", "answer": "as", "explain": "考查状语从句。句意：如今，随着气候混乱加剧和社会脆弱性加深，照护是维持社区活力的结缔组织。本空引导时间状语从句，表示“随着”，应用as。故填as。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习英语试题", "batch": "名校名卷汇编", "id": 37}, {"q": "“Vegetarianism as a movement undergoes a pretty significant transformation in the U. S. kind of neatly at the turn of the 20th century.” ______ the idea that a meatless diet could improve personal health gained popularity, more meat alternatives became available.", "answer": "As", "explain": "考查连词。句意：随着无肉饮食能改善个人健康的理念流行起来，更多肉类替代品开始出现。根据“gained popularity”及“more meat alternatives became available”可知，此处应用连词As引导时间状语从句，表示“随着”。故填As。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习英语试题", "batch": "名校名卷汇编", "id": 38}, {"q": "And yet if I made a fuss — ________ ________I turned out to be right about this man — it could well be the end of all my hopes.", "answer": "even if/even though", "explain": "考查连词。句意：可要是我大吵大闹 —— 就算我猜得没错，这个男人确实拿了戒指 —— 我所有的希望也可能就此破灭。分析句子结构可知，此处表“即使、就算”的让步含义，应用连词even if或even though，符合语境。故填even if/even though。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习英语试题", "batch": "名校名卷汇编", "id": 39}, {"q": "By international standards, the boom is still insignificant, ________ not nothing. The Acelas carries 43% of Amtrak’s passengers, runs frequently and is by far the most comfortable inter-city option.", "answer": "but", "explain": "考查连词。句意：按照国际标准，这种繁荣仍然微不足道，但并非毫无意义。根据空前后句意可知，此处前后句之间表示转折关系，所以空处需用连词but。故填but。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习英语试题", "batch": "名校名卷汇编", "id": 40}]};
const names={'1':'非谓语动词','2':'定语从句','4':'名词性从句','5':'状语从句'};
let active=null,positions={},filters={},answers={},drafts={},clue={},guide={},shown={};
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\"':'&quot;',"'":'&#39;'}[c]));
const norm=x=>String(x||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!。]+$/,'');
function options(s){
 const val=String(s||'').trim();
 const nums=val.match(/(?:①|②|③|④|⑤)\s*[^①②③④⑤]+/g);
 if(nums?.length>1)return [nums.map(v=>v.slice(1).trim()).join(';')];
 if(/[；;]/.test(val))return [val];
 return val.split(/\s*\/\s*/).map(v=>v.trim()).filter(Boolean);
}
function isRight(q,v){const o=options(q.answer);return o.some(x=>norm(x)===norm(v)) || (/[；;]/.test(v) && norm(v.replace(/；/g,';'))===norm(q.answer.replace(/；/g,';')));}
const generalPatterns=[/\b(?:yesterday|tomorrow|nowadays|already|recently|so far|ever|never|usually|often|before|after|since|while|when|once|unless|although|because|until|if|where|why|whether|which|whose|whom|who|that)\b/gi,/\b(?:by the time|at the moment|over the past\s+\w+|in recent years|last (?:year|week|month)|as soon as|even though|so that|in order to)\b/gi];
const domainPatterns={
 '1':[/\b(?:taken away from home|was meant to|were taught|is intended to|to obey orders|to produce warriors|was designed to|were designed to|with\s+\w+\s+\w+ing|having been\s+\w+|having\s+\w+|being\s+\w+|rather than|instead of|in order to|so as to)\b/gi,/\b(?:to\s+[a-z]+|\w+ing|\w+ed)\b/gi],
 '2':[/\b(?:who|whom|whose|which|that|where|when|why|in which|of which|for which|to whom|from whom|the one|the place|the reason|the time)\b/gi],
 '4':[/\b(?:what|whatever|whoever|whether|if|how|why|where|when|that|which|who|whose|whom|the fact that|it is (?:clear|certain|obvious))\b/gi],
 '5':[/\b(?:while|when|as|after|before|since|until|unless|if|although|though|even if|even though|because|once|as soon as|so that|such that|so long as|provided that|in case|wherever|whenever|than|as if|as though)\b/gi]
};
function highlighted(text,on,k){
 if(!on)return h(text);
 const matches=[];const pats=[...(domainPatterns[k]||[]),...generalPatterns];
 for(const re of pats){re.lastIndex=0;for(const m of text.matchAll(re)){if(!m[0].trim())continue;matches.push({start:m.index,end:m.index+m[0].length});}}
 matches.sort((a,b)=>(a.start-b.start)||(b.end-a.end));let pos=0,html='';
 for(const m of matches){if(m.start<pos)continue;html+=h(text.slice(pos,m.start))+'<mark class="g53-clue">'+h(text.slice(m.start,m.end))+'</mark>';pos=m.end;}
 return html+h(text.slice(pos));
}
function state(k){if(!filters[k])filters[k]={batch:'all',source:'all',query:''};return filters[k];}
function list(k){const f=state(k);return db[k].filter(q=>(f.batch==='all'||q.batch===f.batch)&&(f.source==='all'||q.source===f.source)&&(!f.query||[q.q,q.source,q.batch].join(' ').toLowerCase().includes(f.query.toLowerCase())));}
function renderBank(k){
 const target=document.querySelector(k==='1'?'.pred43-content':'.syntax-v39-content');if(!target)return;
 const fs=state(k),ds=db[k];const batches=[...new Set(ds.map(x=>x.batch))],sources=[...new Set(ds.filter(x=>fs.batch==='all'||x.batch===fs.batch).map(x=>x.source))];const items=list(k);
 positions[k]=Math.min(positions[k]||0,Math.max(0,items.length-1));const i=positions[k],q=items[i];
 target.innerHTML=`<section class="g53-main"><button class="g53-back" data-g53="close">← 返回知识讲解</button><h2>${names[k]} · 高中真题专项</h2><div class="g53-desc">原汇编学生版题目 · 来源与解析核对后导入 · 共${ds.length}个题目段落</div><div class="g53-controls"><select data-g53="batch"><option value="all">全部考试批次</option>${batches.map(x=>`<option value="${h(x)}" ${x===fs.batch?'selected':''}>${h(x)}</option>`).join('')}</select><select data-g53="source"><option value="all">全部地区／学校</option>${sources.map(x=>`<option value="${h(x)}" ${x===fs.source?'selected':''}>${h(x)}</option>`).join('')}</select><input type="search" data-g53="search" placeholder="搜索题目或学校" value="${h(fs.query)}"></div>${q?`<div class="g53-meta">第 ${i+1}/${items.length} 题 · ${h(q.batch)} · ${h(q.source)}</div><div class="g53-question">${highlighted(q.q,clue[k+':'+q.id],k)}</div><div class="g53-actions"><button data-g53="clue" class="${clue[k+':'+q.id]?'on':''}">① 标出语境线索</button><button data-g53="guide" class="${guide[k+':'+q.id]?'on':''}">② 答题思路</button></div>${guide[k+':'+q.id]?`<div class="g53-help">先判断这个空在句中充当什么成分；再看从句连接词／谓语与非谓语身份／主动和被动关系；最后结合上下文填写。<br><b>提醒：</b>线索词不能代替句意和句法分析。</div>`:''}<div class="g53-answer"><input data-g53="answer" type="text" autocomplete="off" spellcheck="false" placeholder="${q.answer.includes('①')?'按①②顺序输入，用分号分隔':'输入答案'}" value="${h(drafts[k+':'+q.id]||'')}"><button data-g53="submit">提交答案</button><button data-g53="explain" style="background:white;color:#293c56;border:1px solid #293c56">查看参考解析</button></div>${shown[k+':'+q.id]?`<div class="g53-result ${answers[k+':'+q.id]?.ok===false?'bad':'good'}"><strong>${answers[k+':'+q.id]?(answers[k+':'+q.id].ok?'✓ 回答正确':'✗ 回答错误'):'参考解析'}</strong><p><b>参考答案：</b>${h(q.answer)}</p><p><b>原汇编解析：</b>${h(q.explain||'该条暂无完整原解析，建议以参考答案核对。')}</p></div>`:''}<div class="g53-nav"><button data-g53="prev" ${i===0?'disabled':''}>← 上一题</button><small>${i+1} / ${items.length}</small><button data-g53="next" ${i===items.length-1?'disabled':''}>下一题 →</button></div>`:'没有符合筛选条件的题目'}</section>`;
}
function mount(){
 const syntax=document.querySelector('.syntax-v39-nav'),predicate=document.querySelector('.pred43-aside');
 if(syntax && !syntax.querySelector('[data-g53-open]'))syntax.insertAdjacentHTML('beforeend',`<div class="g53-entry"><div class="g53-desc">高中真题专项</div>${['2','4','5'].map(k=>`<button data-g53-open="${k}">${names[k]}真题库<small>原题 · 解析 · 出处</small></button>`).join('')}</div>`);
 if(predicate && !predicate.querySelector('[data-g53-open]'))predicate.insertAdjacentHTML('beforeend',`<div class="g53-entry"><button data-g53-open="1">高中非谓语真题库<small>原题 · 解析 · 出处</small></button></div>`);
 if(active && document.querySelector(active==='1'?'.pred43-content':'.syntax-v39-content'))renderBank(active);
}
const originalRender=window.render;
if(typeof originalRender==='function')window.render=function(){originalRender();mount();};
document.addEventListener('click',e=>{
 const open=e.target.closest('[data-g53-open]');if(open){e.preventDefault();active=open.dataset.g53Open;positions[active]||=0;mount();return;}
 const button=e.target.closest('[data-g53]');if(!button||!active)return;
 const k=active,cmd=button.dataset.g53,q=list(k)[positions[k]||0];const id=q?k+':'+q.id:'';
 if(cmd==='close'){active=null;window.render();return;}
 if(cmd==='prev'||cmd==='next'){positions[k]+=cmd==='next'?1:-1;renderBank(k);return;}
 if(cmd==='clue'){clue[id]=!clue[id];renderBank(k);return;}
 if(cmd==='guide'){guide[id]=!guide[id];renderBank(k);return;}
 if(cmd==='submit'){const val=document.querySelector('[data-g53="answer"]')?.value?.trim();if(!val)return;drafts[id]=val;answers[id]={ok:isRight(q,val)};shown[id]=true;renderBank(k);return;}
 if(cmd==='explain'){shown[id]=true;renderBank(k);return;}
},true);
document.addEventListener('input',e=>{if(e.target.matches('[data-g53="answer"]')&&active){const q=list(active)[positions[active]||0];if(q)drafts[active+':'+q.id]=e.target.value;}},true);
document.addEventListener('change',e=>{
 const el=e.target;if(!active)return;
 if(el.matches('[data-g53="batch"]')){state(active).batch=el.value;state(active).source='all';positions[active]=0;renderBank(active);}
 if(el.matches('[data-g53="source"]')){state(active).source=el.value;positions[active]=0;renderBank(active);}
 if(el.matches('[data-g53="search"]')){state(active).query=el.value;positions[active]=0;renderBank(active);}
},true);
document.addEventListener('click',e=>{if(e.target.closest('[data-syntax],[data-p43-category],[data-p43-topic],nav a')){active=null;}},true);
mount();
})();
</script></body></html>
