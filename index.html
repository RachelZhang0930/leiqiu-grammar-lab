function tenseFocusMarkup(sc){
 const [verb,clueStr]=TENSE_VISUAL_FOCUS[sc.name]||[];
 const raw=sc.sentence;
 if(!verb || !raw.includes(verb))return esc(raw);
 const cues=(clueStr||'').split('|').filter(x=>raw.toLowerCase().includes(x.toLowerCase()));
 const pieces=[{text:verb,kind:'verb'},...cues.map(text=>({text,kind:'clue'}))].sort((a,b)=>b.text.length-a.text.length);
 let ranges=[];
 for(const item of pieces){
  const at=raw.toLowerCase().indexOf(item.text.toLowerCase());
  if(at<0 || ranges.some(r=>at<r.end && at+item.text.length>r.start))continue;
  ranges.push({start:at,end:at+item.text.length,kind:item.kind});
 }
 ranges.sort((a,b)=>a.start-b.start);
 let output='',last=0;
 for(const r of ranges){output+=esc(raw.slice(last,r.start));output+=`<mark class="tense-focus-${r.kind}">${esc(raw.slice(r.start,r.end))}</mark>`;last=r.end;}
 return output+esc(raw.slice(last));
}

function groupLevelControl(current,group){return `<div class="actions level-bar">${[1,2,3].map(l=>`<button data-lab-level="${group}:${l}" class="${current===l?'primary':''}">L${l} ${['','基础','进阶','挑战'][l]}</button>`).join('')}</div>`}
function clauseConceptGuide(){return `<aside class="clause-guide" aria-label="从句概念速查"><h3>从句是什么？先看这张概念卡</h3><div class="clause-guide-grid"><div class="clause-guide-card"><strong>定语从句</strong><span>像形容词一样修饰名词或代词，回答“哪一个？什么样的？”</span><em>The boy who won the race...</em></div><div class="clause-guide-card"><strong>名词性从句</strong><span>整个从句相当于名词，可作主语、宾语、表语或同位语。</span><em>What she said surprised me.</em></div><div class="clause-guide-card"><strong>状语从句</strong><span>说明时间、原因、条件、让步等，回答“何时？为什么？在什么条件下？”</span><em>Although it rained, we went out.</em></div></div><p class="clause-guide-note">名词性从句细分：主语从句（作主语）· 宾语从句（作宾语）· 表语从句（作表语）· 同位语从句（解释名词内容）。概念提示不会直接标出本题答案。</p></aside>`}
function clauseLab(){const q=GRAMMAR_STRUCTURES[clauseI],unlocked=!!clauseSubmitted[clauseI]||teacher&&reveal;return title('从句结构实验室','Clause Lab','先找分句边界，再辨认从句功能')+`<section class="panel lab-practice">${groupLevelControl(q.lv,'clause')}${clauseConceptGuide()}<div class="quiz-top"><b>句子 ${clauseI+1} / ${GRAMMAR_STRUCTURES.length}</b><span>目标：${q.topic}</span></div><div class="english">${esc(q.sentence)}</div><p class="muted">请判断重点片段（以题目所指从句为准）：</p><blockquote class="focus-phrase">${esc(q.target)}</blockquote><fieldset><legend>它属于哪种从句？</legend>${[['relative','定语从句'],['noun','名词性从句'],['adverbial','状语从句']].map(([v,n])=>`<label class="option"><input type="radio" name="clauseKind" value="${v}" ${clausePick===v?'checked':''}>${n}</label>`).join('')}</fieldset><div class="actions"><button class="primary" data-lab-action="clauseSubmit" ${unlocked&&!teacher?'disabled':''}>提交判断</button><button data-lab-action="clausePrev" ${clauseI===0?'disabled':''}>上一句</button><button data-lab-action="clauseNext" ${clauseI===GRAMMAR_STRUCTURES.length-1?'disabled':''}>下一句</button></div>${unlocked?`<div class="feedback ${clauseSubmitted[clauseI]===q.kind?'good':''}"><b>${clauseSubmitted[clauseI]===q.kind?'判断正确':teacher&&!clauseSubmitted[clauseI]?'教师参考答案':'建议再次分析'}</b><p>主干：${esc(q.main)}</p><p>${esc(q.explain)}</p><p>${esc(q.zh)}</p></div>`:''}</section>`}
function sentenceLab(){const q=COMPLEX_SENTENCES[sentenceI],unlocked=!!sentenceSubmitted[sentenceI]||teacher&&reveal;const chosen=sentenceSelected[sentenceI]||[];return title('长难句解剖室','Sentence Lab','点击句子片段找到主句主干；点击分析板可先观察结构，提交后还可核对选择')+`<section class="panel lab-practice">${groupLevelControl(q.lv,'sentence')}<div class="quiz-top"><b>句子 ${sentenceI+1} / ${COMPLEX_SENTENCES.length}</b><span>L${q.lv} · ${q.chunks.map(x=>x[0]).join('').trim().split(/\\s+/).length}词左右</span></div><div class="english segmented-sentence">${q.chunks.map(([t,type],i)=>`<button class="sentence-chunk ${chosen.includes(i)?'chosen':''}" data-lab-chunk="${i}" aria-pressed="${chosen.includes(i)}">${esc(t)}</button>`).join('')}</div><p class="muted">点击组成主句主干的片段（不要把从句、后置定语、状语都选进去）。</p><div class="actions"><button class="primary" data-lab-action="sentenceSubmit" ${unlocked&&!teacher?'disabled':''}>提交结构选择</button><button data-lab-action="sentenceClear">清除选择</button><button data-lab-action="sentencePrev" ${sentenceI===0?'disabled':''}>上一句</button><button data-lab-action="sentenceNext" ${sentenceI===COMPLEX_SENTENCES.length-1?'disabled':''}>下一句</button></div>${unlocked?`<div class="feedback ${sentenceSubmitted[sentenceI]?.correct?'good':''}"><b>${sentenceSubmitted[sentenceI]?.correct?'主干判断正确':'查看主干并比较修饰结构'}</b><p>主干：${esc(q.main)}</p><p>${esc(q.grammar)}</p><p>${esc(q.zh)}</p></div>`:''}</section>`}
function chooseLevel(group,l){const ar=group==='clause'?GRAMMAR_STRUCTURES:COMPLEX_SENTENCES;const ix=ar.findIndex(q=>q.lv===l);if(ix<0)return;if(group==='clause'){clauseI=ix;clausePick=''}else sentenceI=ix;render()}
document.addEventListener('change',e=>{if(e.target.name==='clauseKind')clausePick=e.target.value});
document.addEventListener('click',e=>{const lev=e.target.closest('[data-lab-level]');if(lev){const [g,l]=lev.dataset.labLevel.split(':');chooseLevel(g,Number(l));return}const seg=e.target.closest('[data-lab-chunk]');if(seg){if(sentenceSubmitted[sentenceI]&&!teacher)return;const k=Number(seg.dataset.labChunk);const v=sentenceSelected[sentenceI]||[];sentenceSelected[sentenceI]=v.includes(k)?v.filter(i=>i!==k):[...v,k];render();return}const btn=e.target.closest('[data-lab-action]');if(!btn)return;const v=btn.dataset.labAction;if(v==='clauseSubmit'){if(!clausePick){alert('请先选择从句类型');return}if(!clauseSubmitted[clauseI]){clauseSubmitted[clauseI]=clausePick;try{localStorage.setItem('lq15-clause',JSON.stringify(clauseSubmitted))}catch(e){}}render()}if(v==='clausePrev'||v==='clauseNext'){clauseI+=v==='clausePrev'?-1:1;clausePick='';render()}if(v==='sentenceClear'){sentenceSelected[sentenceI]=[];render()}if(v==='sentencePrev'||v==='sentenceNext'){sentenceI+=v==='sentencePrev'?-1:1;render()}if(v==='sentenceSubmit'){const chosen=sentenceSelected[sentenceI]||[];if(!chosen.length){alert('请先点击句子主干片段');return}const good=COMPLEX_SENTENCES[sentenceI].chunks.flatMap((c,i)=>c[1]==='main'?[i]:[]);const correct=chosen.length===good.length&&good.every(x=>chosen.includes(x));if(!sentenceSubmitted[sentenceI]){sentenceSubmitted[sentenceI]={correct,chosen};try{localStorage.setItem('lq15-sentence',JSON.stringify(sentenceSubmitted))}catch(e){}}render()}});

/* V4.0 curated three-level examples: category > subtopic > three example sentences. */
const SYNTAX_SUBLESSONS=[[{"title":"关系代词 who / whom / whose / which / that","tip":"关系代词必须回到从句中找所充当的成分。","examples":[["The student [[who built the robot]] is in our class.","who 在从句作主语，修饰 the student。","制作机器人的学生和我们同班。"],["The scientist [[whom we invited]] gave a talk at the science fair.","whom 作 invited 的宾语；正式文体中可用 whom。","我们邀请的科学家在科技节做了演讲。"],["The team [[whose model was selected by the judges]] will represent our school.","whose 表所属关系，修饰 model；从句中有完整谓语 was selected。","模型被评委选中的团队将代表学校。"]]},{"title":"关系副词 when / where / why","tip":"先行词表示地点或时间，不意味着一定用 where / when，还要看从句缺什么。","examples":[["This is the classroom [[where we built our robot]].","where 作地点状语，built 的宾语是 our robot。","这就是我们制造机器人的教室。"],["I still remember the day [[when we presented our project]].","when 在从句中作时间状语。","我仍记得我们展示项目的那一天。"],["The reason [[why the experiment failed]] remains unclear.","why 作原因状语，修饰 reason。","实验失败的原因仍不清楚。"]]},{"title":"限制性与非限制性定语从句","tip":"非限制性从句是补充说明；这类从句通常用逗号隔开。","examples":[["Students [[who finish their models early]] can help others.","限制性从句限定是哪一类学生，不加逗号。","提前完成模型的学生可以帮助别人。"],["Our science teacher, [[who helped us test the robot]], joined the exhibition.","非限制性从句补充说明老师，使用逗号。","帮助我们测试机器人的科学老师也参加了展览。"],["Our robot, [[which had taken us three months to build]], won first prize.","which 引导非限制性从句；不能改用 that。","我们花了三个月制造的机器人获得了一等奖。"]]},{"title":"介词 + which / whom","tip":"介词的选择来自原动词或名词搭配，不是随意添加。","examples":[["This is the tool [[with which we fixed the robot]].","with which 对应 fix the robot with the tool。","这就是我们修理机器人的工具。"],["The researcher [[to whom I sent the design]] replied yesterday.","to whom 对应 send the design to the researcher。","我寄送设计图的研究人员昨天回复了。"],["The platform [[on which the robot stood]] was carefully tested.","on which 作地点介词结构，不能直接以 that 代替。","机器人站立的平台经过了仔细测试。"]]},{"title":"that 与 which 的选择","tip":"注意这些是常见书面语选择原则，须先判定从句性质。","examples":[["The first robot [[that we designed]] could only move forward.","先行词由序数词 first 修饰，通常选 that。","我们设计的第一台机器人只能向前走。"],["The robot, [[which was displayed near the entrance]], attracted a crowd.","逗号引导非限制性从句时不能用 that。","入口附近展出的机器人吸引了很多人。"],["Everything [[that our team had prepared]] was ready before the judges arrived.","先行词 everything 为不定代词，通常选 that。","评委到达前，我们团队准备的一切都就绪了。"]]}],[{"title":"主语从句","tip":"整个从句放在谓语前，占据主语位置。","examples":[["[[What the judges said]] encouraged us.","what 在从句中作 said 的宾语；整个从句作主语。","评委说的话鼓舞了我们。"],["[[Whether the robot will work]] remains uncertain.","whether 引导主语从句；整个从句作主语。","机器人能否工作仍不确定。"],["[[That our team completed the model on time]] surprised everyone.","that 不在从句中作成分，仅连接陈述内容。","我们团队按时完成模型令大家惊讶。"]]},{"title":"宾语从句","tip":"判断动词后面是否需要一个完整的内容充当宾语。","examples":[["Our teacher said [[that the robot was ready]].","that 引导宾语从句，作 said 的宾语。","老师说机器人已经准备好了。"],["I wonder [[whether we should change the design]].","whether 引导间接疑问，使用陈述语序。","我想知道我们是否应该修改设计。"],["The judges asked [[why the robot had stopped during the demonstration]].","why 作从句原因状语；had stopped 表示更早的过去。","评委问机器人为什么在演示中停了下来。"]]},{"title":"表语从句","tip":"位于 be 等系动词之后，说明主语是什么或怎么样。","examples":[["The problem is [[that our robot cannot turn left]].","that 从句放在系动词 is 后面作表语。","问题是机器人不能左转。"],["Our concern is [[whether the batteries will last through the show]].","whether 表“是否”，在此连接表语从句。","我们担心的是电池能否撑完整场展示。"],["The question was [[how we could explain the unexpected result to the judges]].","how 表方式；表语从句仍用陈述语序。","问题在于我们怎样向评委解释意外结果。"]]},{"title":"同位语从句","tip":"同位语从句说清名词的具体内容，不等同于定语从句。","examples":[["The news [[that we had won]] spread quickly.","that 从句解释 news 的具体内容，而非修饰 news 的某个属性。","我们获胜的消息迅速传开。"],["We discussed the question [[whether the robot could recognize faces]].","whether 从句解释 question 的具体内容。","我们讨论了机器人能否识别人脸的问题。"],["The idea [[that students should test the model themselves]] was welcomed.","that 同位语从句内部成分完整，说明 idea 的内容。","学生应该自己测试模型这一想法受到欢迎。"]]},{"title":"that / what / whether / if 辨析","tip":"先看连接词在从句中是否作成分，再看表达“是否”还是陈述事实。","examples":[["I know [[that our team has finished the project]].","that 只连接内容，不在从句中担当成分。","我知道团队已完成项目。"],["I cannot explain [[what caused the robot to stop]].","what 在从句中作主语，不能换成 that。","我无法解释是什么导致机器人停止。"],["We have not decided [[whether we should enter the regional competition]].","whether 引导“是否”，适用于此宾语从句。","我们还没决定是否参加地区比赛。"]]},{"title":"陈述语序与形式主语 it","tip":"从句一般采用陈述语序；形式主语 it 可使句子更自然。","examples":[["I know [[where the robot is]].","间接疑问句用 where the robot is，而不是 where is the robot。","我知道机器人在哪里。"],["It is exciting [[that our team has reached the final]].","It 是形式主语，that 从句为真正主语。","我们团队进入决赛令人兴奋。"],["It remains to be seen [[whether the robot can finish the task without assistance]].","it 为形式主语；whether 从句是真正的主语。","机器人能否独立完成任务仍有待观察。"]]}],[{"title":"时间：when / while / as / before / after","tip":"不要只凭 when / before 判断时态，要看参照时间和事件关系。","examples":[["[[When the teacher arrived]], we were testing the robot.","when 引导时间状语从句，说明老师到达时的背景。","老师到达时，我们正在测试机器人。"],["[[While we were putting up the poster]], the lights went out.","while 突出持续中的背景动作。","我们贴海报时，灯突然灭了。"],["[[By the time the judges entered the room]], we had completed the display.","by the time 引出过去参照点；主句完成更早。","评委进教室时，我们已经布置完展台。"]]},{"title":"条件：if / unless / provided that","tip":"条件从句表达真实将来情况时，注意主将从现。","examples":[["[[If the robot works]], we will demonstrate it tomorrow.","真实条件句谈将来时，if 从句通常用一般现在时。","如果机器人正常工作，我们明天会展示。"],["[[Unless we charge the battery]], the robot may stop during the show.","unless = if ... not；表达除非充电。","除非给电池充电，否则机器人可能中途停下。"],["[[Provided that all safety checks are completed]], the team will be allowed to present the model.","provided that 引导正式的条件状语从句。","只要完成全部安全检查，团队就获准展示模型。"]]},{"title":"原因：because / since / as","tip":"since / as 可以表示原因，也可能表示时间，需看整句意思。","examples":[["We stayed late [[because our robot needed repairs]].","because 说明直接原因。","我们留下来很晚，因为机器人需要修理。"],["[[Since the model was too heavy]], we redesigned its base.","since 在此表示原因，而非“自从”。","既然模型太重，我们重新设计了底座。"],["[[As the experiment had produced inconsistent results]], the team repeated it before the exhibition.","as 作原因连接词；过去完成时表示较早的结果。","由于实验结果不一致，团队在展览前重复了实验。"]]},{"title":"让步：although / though / even if","tip":"注意 although/though 一般不与 but 同时连接同一主从结构。","examples":[["[[Although the robot was small]], it won first prize.","although 引导让步，表示“尽管”。","虽然机器人很小，但获得了一等奖。"],["[[Though we had little time]], we completed the final test.","though 与 although 意义接近。","虽然时间很少，我们仍完成最终测试。"],["[[Even if the judges do not choose our model]], we will continue improving it.","even if 表“即使”，含假设让步。","即使评委没有选择我们的模型，我们也会继续改进。"]]},{"title":"目的与结果：so that / so…that / such…that","tip":"辨别 so that 目的与 so…that / such…that 结果。","examples":[["We spoke slowly [[so that the visitors could understand the demonstration]].","so that 引导目的状语从句，could 表示目的。","我们讲得很慢，以便参观者听懂演示。"],["The robot moved [[so quickly that the camera could not follow it]].","so + 副词 + that 表结果。","机器人移动得太快，以至于摄像机跟不上。"],["It was [[such an impressive demonstration that the judges asked for another one]].","such + 名词短语 + that 引导结果。","演示非常精彩，以至于评委要求再演一次。"]]},{"title":"方式、比较、地点状语从句","tip":"与定语从句对比：看从句是否修饰具体先行词。","examples":[["Please arrange the models [[as the teacher showed us]].","as 引导方式状语从句。","请按照老师示范的方式摆放模型。"],["Our latest robot works better [[than the previous one did]].","than 引导比较结构，此处从句带 did。","最新机器人比上一台工作得更好。"],["You may display the poster [[where the visitors can see it clearly]].","where 引导地点状语从句；前面没有地点先行词。","可以把海报放在参观者能清楚看到的地方。"]]}]];
for(let t=0;t<3;t++){
 SYNTAX_TOPICS[t].subs=SYNTAX_SUBLESSONS[t].map(x=>x.title);
}

SYNTAX_SUBLESSONS[3]=[{"title":"完全倒装：地点与方位置首","tip":"地点/方位短语置首，动词在主语前；代词作主语时通常不采用此类完全倒装。","examples":[["[[On the stage stood]] our science teacher.","地点短语 On the stage 置于句首，完全倒装为 stood + 主语。","舞台上站着我们的科学老师。"],["[[Beside the display board stood]] two students who had designed the robot.","介词短语置首，主语 two students 在动词 stood 后；who 从句修饰 students。","展示板旁站着两名设计机器人的学生。"],["[[At the entrance to the exhibition stood]] a model whose sensors could detect obstacles.","地点状语提前，谓语 stood 前于主语 a model；whose 引导定语从句。","展览入口处摆放着一个传感器能够探测障碍的模型。"]],"practices":[{"answer":"stood","question":"On the stage _____ our science teacher. (stand)"},{"answer":"stood","question":"Beside the display board _____ two students who had designed the robot. (stand)"},{"answer":"stood","question":"At the entrance to the exhibition _____ a model whose sensors could detect obstacles. (stand)"}]},{"title":"否定词置首：never / seldom / little","tip":"否定副词置于句首，主句通常采用部分倒装：助动词 / 情态动词 / be + 主语。","examples":[["[[Never have we seen]] such an exciting science fair.","Never 置首引起部分倒装，have 在主语 we 前。","我们从未见过这么精彩的科技节。"],["[[Seldom did the team encounter]] problems during the first stage.","Seldom 置首，加入助动词 did，实义动词用原形 encounter。","团队在第一阶段很少遇到问题。"],["[[Little did the judges know]] that our robot had been rebuilt overnight.","Little（几乎不知道）置首，主句 did the judges know 倒装，that 引导宾语从句。","评委们几乎不知道我们的机器人前一晚被重新组装过。"]],"practices":[{"answer":"have","question":"Never _____ we seen such an exciting science fair."},{"answer":"did","question":"Seldom _____ the team encounter problems during the first stage."},{"answer":"did","question":"Little _____ the judges know that our robot had been rebuilt overnight."}]},{"title":"Only + 状语置首","tip":"Only 修饰状语且移到句首时，主句部分倒装；Only 修饰主语通常不倒装。","examples":[["[[Only then did we notice]] the error in the poster.","Only then 置首，助动词 did 提到主语 we 之前。","直到那时我们才注意到海报上的错误。"],["[[Only after the final test could the students explain]] the unexpected result.","Only after 引导状语置首，主句 could the students explain 部分倒装。","只有在最后一次测试之后，学生们才能解释意外结果。"],["[[Only when the results were checked did the team realize]] how much progress it had made.","Only when 从句置首，从句使用正常语序；主句 did the team realize 倒装。","只有在结果核对后，团队才意识到自己取得了多大进步。"]],"practices":[{"answer":"did","question":"Only then _____ we notice the error in the poster."},{"answer":"could","question":"Only after the final test _____ the students explain the unexpected result."},{"answer":"did","question":"Only when the results were checked _____ the team realize how much progress it had made."}]},{"title":"Not until / Not only … but also","tip":"Not until 置首时主句部分倒装；Not only 置首连接两个分句时，通常前一分句倒装。","examples":[["[[Not until Friday did we finish]] the model.","Not until Friday 置首，主句 did we finish 部分倒装。","直到星期五我们才完成模型。"],["[[Not only did the students finish]] the poster, but they also tested the robot.","Not only 置首引起前一分句倒装；but also 后的第二分句保持陈述语序。","学生们不仅完成了海报，还测试了机器人。"],["[[Not until the judges arrived did the team discover]] that one of the sensors had failed.","Not until 引导的时间从句本身不倒装，主句 did the team discover 倒装。","直到评委到达团队才发现一个传感器发生故障。"]],"practices":[{"answer":"did","question":"Not until Friday _____ we finish the model."},{"answer":"did","question":"Not only _____ the students finish the poster, but they also tested the robot."},{"answer":"did","question":"Not until the judges arrived _____ the team discover that one of the sensors had failed."}]},{"title":"Hardly … when / No sooner … than","tip":"hardly / scarcely … when 与 no sooner … than 经常用过去完成时 + 一般过去时，否定结构置首引起倒装。","examples":[["[[Hardly had we entered]] the hall when the presentation began.","Hardly 置首，had we entered 为部分倒装；when 从句用一般过去时。","我们刚进入大厅，演示就开始了。"],["[[No sooner had our team set up]] the robot than the power went out.","No sooner 置首，had our team set up 倒装；搭配 than。","我们团队刚搭好机器人，电源就断了。"],["[[Hardly had the judges asked]] their first question when the students identified the flaw in their design.","Hardly … when 表示紧接发生；前句过去完成时倒装，后句一般过去时。","评委刚问出第一个问题，学生们就找到了设计中的缺陷。"]],"practices":[{"answer":"had","question":"Hardly _____ we entered the hall when the presentation began."},{"answer":"had","question":"No sooner _____ our team set up the robot than the power went out."},{"answer":"had","question":"Hardly _____ the judges asked their first question when the students identified the flaw."}]},{"title":"省略 if 的虚拟条件倒装","tip":"虚拟条件句省略 if 时，将 had / were / should 提到主语前。与真实条件状语从句不同。","examples":[["[[Had we had]] more time, we would have improved the robot.","Had we had = If we had had，表示与过去事实相反的假设。","如果我们当时有更多时间，就会改进机器人。"],["[[Were the experiment to fail]], we would revise the design immediately.","Were … to do = If … were to do，表示将来假设。","如果实验失败，我们会立即修改设计。"],["[[Should the judges request]] another demonstration, our team would be ready.","Should … = If … should …，表示较正式的将来假设。","如果评委要求再演示一次，我们团队也已经做好准备。"]],"practices":[{"answer":"Had","question":"_____ we had more time, we would have improved the robot."},{"answer":"Were","question":"_____ the experiment to fail, we would revise the design immediately."},{"answer":"Should","question":"_____ the judges request another demonstration, our team would be ready."}]}];
SYNTAX_SUBLESSONS[4]=[{"title":"It is / was … that / who …","tip":"强调句的基础形式；去掉 It is/was 与 that/who 后，通常能还原出完整陈述句。","examples":[["[[It was our teacher who]] suggested the new design.","强调 our teacher；还原句：Our teacher suggested the new design。","正是我们的老师提出了新的设计方案。"],["[[It was in the laboratory that]] we tested the robot.","强调地点状语 in the laboratory；强调句中使用 that 而不是 where。","我们正是在实验室测试机器人的。"],["[[It was because the sensor failed that]] our team had to repeat the experiment.","强调原因状语从句，that 后为剩余主句；可还原：Our team had to repeat the experiment because the sensor failed。","正是因为传感器故障，团队才不得不重复实验。"]],"practices":[{"answer":"who","question":"It was our teacher _____ suggested the new design."},{"answer":"that","question":"It was in the laboratory _____ we tested the robot."},{"answer":"that","question":"It was because the sensor failed _____ our team had to repeat the experiment."}]},{"title":"强调句的一般疑问句","tip":"将 It is/was 变为 Is/Was it … that …? ，其余部分保持陈述语序。","examples":[["[[Was it your team that]] built the model?","Was it … that 构成强调句的一般疑问形式。","是你们团队制作的这个模型吗？"],["[[Was it at the science fair that]] you first met the judge?","强调地点 at the science fair，疑问形式 Was it … that …?","你第一次见那位评委是在科技节吗？"],["[[Was it because the battery failed that]] the demonstration stopped?","强调原因状语，that 引出其余部分。","演示停止正是因为电池故障吗？"]],"practices":[{"answer":"Was","question":"_____ it your team that built the model?"},{"answer":"that","question":"Was it at the science fair _____ you first met the judge?"},{"answer":"that","question":"Was it because the battery failed _____ the demonstration stopped?"}]},{"title":"强调句的特殊疑问句","tip":"特殊疑问词 + is/was it + that …?；注意疑问语序及与宾语从句语序的区别。","examples":[["[[Who was it that]] designed the robot?","Who was it that …? 强调询问设计机器人的人。","究竟是谁设计了机器人？"],["[[When was it that]] your group completed the display?","When was it that …? 强调询问完成时间。","你们组到底是什么时候完成展板的？"],["Could you tell me [[why it was that]] the experiment failed?","特殊疑问强调结构置于宾语从句时用陈述语序：why it was that。","你能告诉我实验到底为什么失败吗？"]],"practices":[{"answer":"that","question":"Who was it _____ designed the robot?"},{"answer":"that","question":"When was it _____ your group completed the display?"},{"answer":"that","question":"Could you tell me why it was _____ the experiment failed?"}]},{"title":"It was not until … that …","tip":"not until 强调结构中，that 后正常陈述语序；与 Not until 置首倒装做对比。","examples":[["[[It was not until Friday that]] we finished the model.","强调时间：It was not until … that …，that 后不用部分倒装。","直到星期五我们才完成模型。"],["[[It was not until the final test that]] the team discovered the error.","强调时间短语；还原为 The team did not discover the error until the final test。","直到最后一次测试团队才发现错误。"],["[[It was not until the judges arrived that]] we realized how important the demonstration was.","强调 until 时间从句；主句 we realized 不倒装。","直到评委到场我们才意识到演示有多重要。"]],"practices":[{"answer":"that","question":"It was not until Friday _____ we finished the model."},{"answer":"that","question":"It was not until the final test _____ the team discovered the error."},{"answer":"that","question":"It was not until the judges arrived _____ we realized how important the demonstration was."}]},{"title":"do / does / did + 动词原形","tip":"肯定句中使用 do/does/did + 动词原形表达“确实”；它不是 It is/was … that 句型。","examples":[["We [[did finish]] the experiment on time.","did finish 强调过去确实完成；did 后用动词原形。","我们确实按时完成了实验。"],["Our robot [[does respond]] to voice commands, even in a noisy hall.","does respond 强调现在确实有此功能，第三人称单数用 does。","我们的机器人确实能响应语音指令，即使大厅里很吵。"],["The team [[did identify]] the cause, although it took several hours.","did identify 强调过去事实；although 引导让步从句。","尽管花了几个小时，团队确实找出了原因。"]],"practices":[{"answer":"did","question":"We _____ finish the experiment on time."},{"answer":"does","question":"Our robot _____ respond to voice commands, even in a noisy hall."},{"answer":"did","question":"The team _____ identify the cause, although it took several hours."}]},{"title":"强调句与定语从句的区别","tip":"不要只看 it is/was … that；判断是否可以去掉强调结构并还原完整句。","examples":[["[[It was the robot that]] won first prize.","这是强调句：去掉 It was … that 得 The robot won first prize。","获得一等奖的正是那个机器人。"],["This was the robot [[that won first prize]].","这是定语从句，that 修饰 the robot，并在从句中作主语。","这就是获得一等奖的那个机器人。"],["[[It was the result of the final test that]] convinced the judges, not the colorful display.","这是强调句，强调 the result of the final test；还原后是完整主谓结构。","说服评委的正是最后一次测试的结果，而不是花哨的展板。"]],"practices":[{"answer":"that","question":"It was the robot _____ won first prize."},{"answer":"that","question":"This was the robot _____ won first prize."},{"answer":"that","question":"It was the result of the final test _____ convinced the judges."}]}];

SYNTAX_SUBLESSONS[3]=[{"title": "全倒装①：地点与存在句", "tip": "地点或方位信息前置时，常见“地点 + 不及物动词 + 名词主语”；代词作主语时通常不倒装。", "examples": [["[[On the stage stood]] our teacher.", "地点状语 On the stage 置首，stood 在名词主语 our teacher 之前。", "舞台上站着我们的老师。"], ["[[Beside the display board stood]] two students.", "地点短语提前；stood + 名词主语，属于完全倒装。", "展板旁站着两位学生。"], ["[[There appeared]] a sudden problem with the robot.", "there 引出存在意义，appeared 在真正的名词主语 a sudden problem 之前。", "机器人突然出现了一个问题。"]]}, {"title": "全倒装②：方向、分词与引语", "tip": "方向副词 here / there / in / out / away 等前置时常出现完全倒装；遇到代词主语时仍用正常主谓语序。", "examples": [["[[In came]] the judges.", "In + came + 名词主语；但应说 Here they come，不倒装代词 they。", "评委走进来了。"], ["[[Out rushed]] the students when the bell rang.", "方向副词 Out 前置，rushed + 名词主语。", "铃响时学生们冲了出来。"], ["[[Gone are]] the days when our model could not move.", "过去分词 Gone 前置，后面接 be 动词和名词主语。", "模型无法移动的日子已经过去了。"]]}, {"title": "否定词置首：never / seldom / little", "tip": "否定词或否定意义短语在句首时，主句通常使用部分倒装：助动词 / 情态动词 + 主语 + 动词。", "examples": [["[[Never had we seen]] such a clever robot.", "Never 置首，使用 had + 主语 we + 过去分词 seen。", "我们从未见过如此聪明的机器人。"], ["[[Seldom do the students make]] this mistake now.", "Seldom 置首，引出助动词 do；make 保持原形。", "学生们如今很少犯这种错误。"], ["[[Under no circumstances should anyone touch]] the wires.", "否定介词短语置首，情态动词 should 放在主语 anyone 之前。", "任何情况下都不应有人碰电线。"]]}, {"title": "Only + 状语置首", "tip": "Only 修饰时间、条件、方式等状语并置于句首时，主句部分倒装；Only + 主语置首则不倒装。", "examples": [["[[Only then did we find]] the error.", "Only then 是状语；did + we + find 构成部分倒装。", "直到那时我们才发现错误。"], ["[[Only after the final test did the robot work]] perfectly.", "Only after... 状语置首，主句 did the robot work 倒装；after 后面不倒装。", "直到最后测试后机器人才能正常运作。"], ["[[Only our teacher knew]] the answer.", "Only 修饰主语 our teacher，句子不倒装，knew 直接作谓语。", "只有我们的老师知道答案。"]]}, {"title": "Not until / Not only：倒装范围", "tip": "Not until + 时间状语置首，主句倒装；Not only 连接并列分句时前一分句倒装，连接并列主语时不倒装。", "examples": [["[[Not until Friday did we finish]] the poster.", "Not until Friday 是状语，did we finish 为主句部分倒装。", "直到周五我们才完成海报。"], ["[[Not only did we build]] the robot, but we also tested it.", "Not only 在首个并列分句前，引出 did we build；but also 后保持正常语序。", "我们不仅制作了机器人，还测试了它。"], ["[[Not only our teacher but also the students were]] excited.", "Not only...but also 连接并列主语，不倒装；谓语与较近主语 the students 一致。", "不仅老师，学生们也很兴奋。"]]}, {"title": "Hardly / No sooner：一……就……", "tip": "Hardly / Scarcely + had + 主语 + done + when；No sooner + had + 主语 + done + than；注意连词配对。", "examples": [["[[Hardly had we arrived]] when the lights went out.", "Hardly 与 when 配对；主句为 had we arrived，过去完成时。", "我们刚到，灯就熄灭了。"], ["[[No sooner had the judge entered]] than the robot began to move.", "No sooner 与 than 配对；had the judge entered 部分倒装。", "评委刚一进来，机器人就开始动了。"], ["[[Scarcely had the students sat down]] when the meeting began.", "Scarcely...when；先发生的坐下用过去完成时。", "学生刚坐下，会议就开始了。"]]}, {"title": "虚拟条件倒装：had / were / should", "tip": "省略 if 的虚拟条件从句可以用 Had / Were / Should 提前；倒装发生在条件从句中。", "examples": [["[[Had we known]] the problem, we would have fixed it earlier.", "Had we known = If we had known，表示与过去事实相反。", "如果早知道问题，我们本可以更早修好。"], ["[[Were I the team leader]], I would change the plan.", "Were I... = If I were...，表示与现在事实相反的假设。", "如果我是队长，我会改变计划。"], ["[[Should the device fail]], please contact the teacher.", "Should the device fail = If the device should fail，表示较小可能的将来条件。", "如果设备万一发生故障，请联系老师。"]]}, {"title": "让步倒装：as / though", "tip": "形容词、副词、名词或动词可置于 as / though 前；名词前置时留意冠词。", "examples": [["[[Difficult as it was]], we completed the project.", "Difficult 提到 as 前，表示“尽管很困难”；后面主句不倒装。", "尽管很困难，我们仍完成了项目。"], ["[[Student as he is]], he designed an impressive robot.", "单数名词 Student 提到 as 前通常不带 a/an。", "尽管他只是学生，他设计了令人赞叹的机器人。"], ["[[Try as we might]], we could not repair it in time.", "动词 Try 前置，as 后保留情态动词 might。", "无论我们怎样努力，也没能及时修好它。"]]}, {"title": "So / Such / Neither / Nor：特殊结构", "tip": "区分“so + 助动词 + 主语”（另一人也如此）与“So + 主语 + 助动词”（同一人确实如此）。So/Such...that 可引起部分倒装。", "examples": [["Our class won first prize, and [[so did theirs]].", "so did theirs 表示“他们班也获奖”；需与前句的时态一致。", "我们班获了一等奖，他们班也是。"], ["[[So difficult was the task]] that nobody finished it alone.", "So + 形容词提前，be 动词在主语前；that 引出结果。", "任务太困难，没人能独自完成。"], ["I cannot solve it, and [[neither can my friend]].", "neither can my friend 表示另一个人也不能；情态动词在主语前。", "我解决不了，我朋友也不能。"]]}];

for(let t=3;t<5;t++){SYNTAX_TOPICS[t].subs=SYNTAX_SUBLESSONS[t].map(x=>x.title);}
let syntaxSub=0,syntaxLevel=0,syntaxAnswer=false,syntaxInput="",syntaxChecked=false;
function syntaxSample(){
 const lesson=SYNTAX_SUBLESSONS[syntaxTopic]?.[syntaxSub];
 if(!lesson)return SYNTAX_TOPICS[syntaxTopic].samples[syntaxExample];
 const [raw,grammar,zh]=lesson.examples[syntaxLevel];
 const a=raw.indexOf('[['),b=raw.indexOf(']]');
 if(a<0||b<a)throw Error('Structure marking missing');
 const pre=raw.slice(0,a),part=raw.slice(a+2,b),post=raw.slice(b+2);
 return {segments:[[pre,'main'],[part,syntaxTopic===0||syntaxTopic===1||syntaxTopic===2?'clause':'logic'],[post,'main']].filter(x=>x[0]),main:(pre+' […] '+post).replace(/\s+/g,' ').trim(),grammar,zh};
}


function syntaxPracticeData(){
 const lesson=SYNTAX_SUBLESSONS[syntaxTopic]?.[syntaxSub];
 const explicit=lesson?.practices?.[syntaxLevel];
 if(explicit)return explicit;
 const v=lesson?.examples?.[syntaxLevel];
 if(!v)return null;
 const [raw,explanation]=v;const a=raw.indexOf('[['),b=raw.indexOf(']]');
 const target=raw.slice(a+2,b);const match=target.match(/^[A-Za-z]+/);
 if(!match)return null;
 const answer=match[0];
 return {answer,question:raw.replace('[[','').replace(']]','').replace(target,'_____ '+target.slice(answer.length))};
}

['③ 现在分词：主动、伴随与自然结果','作后置定语、宾补、状语；逻辑主语与动作常为主动关系。','The students stood nearby, discussing the results.','discussing 的逻辑主语是 students，作伴随状语。'],

function p62EmphasizeExample(example){
 const escHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const text=String(example);
 const patterns=/(\b(?:to (?:have been |have |be )?[a-z]+|Having [a-z]+|being [a-z]+|Being [a-z]+|having been [a-z]+|Having been [a-z]+|designed|completed|published|tested|encouraged|Encouraged|finished|built|locked|shining|working|discussing|presenting|Testing|Building|checking|suggested|stopped|stayed|arrived|won|were made|is believed|were testing|entered|takes|wrote|prepared)\b)/gi;
 let result='',pos=0,m; patterns.lastIndex=0;
 while((m=patterns.exec(text))!==null){
   result+=escHtml(text.slice(pos,m.index));
   const v=m[0],finite=/^(?:stayed|arrived|won|takes|wrote|prepared|stopped|suggested|entered|were made|is believed|were testing)$/i.test(v);
   result+=`<mark class="p62-${finite?'finite':'nonfinite'}">${escHtml(v)}</mark>`;pos=m.index+v.length;
 }
 return result+escHtml(text.slice(pos));
}

一等奖。", "poster 承受 design；won 才是整个句子的谓语。"], ["原因状语 · 被动", "done", "<n>Encouraged</n> by the teacher, we <m>tried</m> again.", "受到老师鼓励后，我们又尝试了一次。", "we 是 encourage 的承受者。"], ["宾语补足语 · 被动", "have/get sth done", "We <m>had</m> the poster <n>printed</n> yesterday.", "我们昨天请人把海报打印好了。", "poster 承受 print；had 是谓语，此处是 have sth done 结构。"], ["表示状态或已完成", "done", "The <n>fallen</n> leaves <m>covered</m> the path.", "落叶覆盖了小路。", "fallen 表已落下的状态；fall 为不及物动词，不能机械理解成被动。"]]};

}

   return title('时态与语态实验室','Tense & Voice Lab','主被动关系 × 时间参照点')+`<div class="layout">${v37Sidebar()}<div class="v45-voice-right">${intro}${section}</div></div>`;
 }
 if(scene===SCENES.length+2){

 }
 return oldExplorer().replaceAll('时态探索','时态与语态探索');
};

<script id="v47-sidebar-sync-script">
(function () {
  'use strict';
  // The app redraws its content on most sidebar selections. Capture the click
  // before existing document-level handlers and scroll only after the redraw.
  const routeMap = [
    {side: '.v37-sidebar [data-scene]', target: '.layout > .panel'},
    {side: '.scene-tabs [data-scene]', target: '.layout > .panel'},
    {side: '.syntax-v39-nav [data-syntax^="topic:"]', target: '.syntax-v39-content'},
    {side: '.pred43-aside [data-p43-category]', target: '.pred43-content'},
    {side: '.pred43-aside [data-p43-topic]', target: '.pred43-content'}
  ];
  let scrollGeneration = 0;
  window.addEventListener('click', function (event) {
    if (!event.target || !event.target.closest) return;
    const match = routeMap.find(item => event.target.closest(item.side));
    if (!match) return;
    const generation = ++scrollGeneration;
    // Wait for the synchronous app re-render and one paint cycle.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (generation !== scrollGeneration) return;
      const target = document.querySelector(match.target);
      if (!target) return;
      const header = document.querySelector('header');
      const headerHeight = header ? header.getBoundingClientRect().height : 0;
      const margin = 14;
      const targetY = window.scrollY + target.getBoundingClientRect().top - headerHeight - margin;
      if (Math.abs(window.scrollY - targetY) > 20) {
        window.scrollTo({
          top: Math.max(0, targetY),
          behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'
        });
      }
    }));
  }, true);
})();
</script>

根据时间状语“in recent years”（近年来）可知，此处应用现在完成时态，其结构为“have/has + 过去分词”，主语“the protective effects of biocrusts”是复数，助动词用have，故填have gained。", "blanks": 1, "multi": false}, {"q": "It is acknowledged that dryland ecosystems _________ (stabilize) and soil erosion is prevented by these biological layers.", "section": "2025年高考一模", "source": "2025年普陀区一模", "year": "2025", "order": 32, "answer": "are stabilized", "explain": "考查动词时态和语态。句意：人们认识到，旱地生态系统得到了稳定，土壤侵蚀也被这些生物层所阻止。此处“dryland ecosystems”与“stabilize”之间是被动关系，且描述的是客观事实，应用一般现在时的被动语态，其结构为“be + 过去分词”，主语是复数，be动词用are，故填are stabilized。", "blanks": 1, "multi": false}, {"q": "Farmers relied on various methods to preserve their harvests. Different cultures _________ (develop) unique preservation techniques: Koreans made kimchi, Germans made sauerkraut.", "section": "2025年高考一模", "source": "2025年嘉定区一模", "year": "2025", "order": 33, "answer": "developed", "explain": "考查时态。句意：不同的文化发展出了独特的保存技术：韩国人做泡菜，德国人做酸菜。空处是句子的谓语动词，句子描述的是过去的情况，用一般过去时，谓语动词用过去式形式。故填developed。", "blanks": 1, "multi": false}, {"q": "Over the centuries, the ways of preserving food advanced. In the 19th century, the canning process _________ (introduce).", "section": "2025年高考一模", "source": "2025年嘉定区一模", "year": "2025", "order": 34, "answer": "was introduced", "explain": "考查时态语态。句意：在19世纪，罐头工艺被引入。主语process与谓语introduce构成被动关系，根据上文时间状语In the 19th century可知，句子陈述过去发生的事情，故应用一般过去时的被动语态，主语为单数名词，be动词用was。故填was introduced。", "blanks": 1, "multi": false}, {"q": "One of the greatest benefits of container gardening is that little or no weeding _________ (require). For plants in the ground, weeding is sometimes a daily or weekly requirement.", "section": "2025年高考一模", "source": "2025年长宁区一模", "year": "2025", "order": 35, "answer": "is required", "explain": "考查时态和语态。句意：一个最大的好处是，几乎不需要除草。空格处在句子中作谓语，陈述客观事实，为一般现在时，且little or no weeding与require为被动关系。故填is required。", "blanks": 1, "multi": false}, {"q": "Machine learning differs from traditional software. The software receives data, which is processed according to a clear description, and_________ (produce) the results.", "section": "2025年高考一模", "source": "2025年徐汇区一模", "year": "2025", "order": 36, "answer": "produces", "explain": "考查时态和主谓一致。句意：软件接收数据，根据明确描述进行处理，并产生结果。根据空前and可知，空处为谓语动词，和receive并列，表示一般事实，需用一般现在时，主语为The software，谓语需用第三人称单数形式。故填produces。", "blanks": 1, "multi": false}, {"q": "They are known for their fundamental discoveries in machine learning. Hinton and Hopfield_________ (credit) with using tools from physics to advance basic research in the field.", "section": "2025年高考一模", "source": "2025年徐汇区一模", "year": "2025", "order": 37, "answer": "are credited/were credited", "explain": "考查时态语态和主谓一致。句意：Hinton和Hopfield因使用物理学工具推动该领域的基础研究而受到赞誉。根据空前主语Hinton and Hopfield可知，空处需用谓语动词作谓语，既可指陈述现在事实，需用一般现在时，也可指陈述过去事实，需用一般过去时，主语为Hinton and Hopfield，为复数形式，谓语需用复数形式，和主语之间为被动关系，需用被动语态。故填are credited/were credited。", "blanks": 1, "multi": false}, {"q": "Two dozen people gathered in a cozy café-bookstore in Minnesota, chatting and laughing with those seated beside them. After ten minutes, the room _________ (fall) quiet. Then people opened their books and began to read.", "section": "2025年高考一模", "source": "2025年杨浦区一模", "year": "2025", "order": 38, "answer": "fell", "explain": "考查动词时态。句意：十分钟后，房间安静了下来。根据前后句可知，描述已发生的事，用一般过去时。故填fell。", "blanks": 1, "multi": false}, {"q": "But people who love essential oils often say that there’s an oil for everything. Since long ago, Atlanta Institute for Aromatherapy _________ (collect) examples of people harmed by essential oils.", "section": "2025年高考一模", "source": "2025年静安区一模", "year": "2025", "order": 39, "answer": "has been collecting/has collected", "explain": "考查时态和主谓一致。句意：从很久以前，亚特兰大芳香疗法研究所一直在收集人们被精油伤害的例子。空格处是谓语动词，根据时间状语since long ago可知，句子应该用现在完成时，表示从过去开始一直持续到现在；也可以强调动作的延续性，用现在完成进行时。主语是Atlanta Institute for Aromatherapy，助动词用has。故填has been collecting/has collected。", "blanks": 1, "multi": false}, {"q": "Since its creation in the 1800s, the subject of Secola’s song, frybread,_________ (become) a culturally significant comfort food within local communities across Canada and America.", "section": "2025年高考一模", "source": "2025年金山区一模", "year": "2025", "order": 40, "answer": "has become", "explain": "考查动词时态和主谓一致。句意：自19世纪诞生以来，Secola这首歌的主题“油炸面包”已经成为加拿大和美国当地社区具有重要文化意义的安慰食物。空处作句子的谓语，结合时间状语“Since its creation in the 1800s”可知，时态应用现在完成时，表示过去的动作持续到现在，且主语是单数，助动词应用has。故填has become。", "blanks": 1, "multi": false}, {"q": "The basic ingredients are flour, baking powder or soda, and salt. After letting it rise, the ball _________ (divide) into pieces, rolled into discs and then fried until bubbly, golden and crispy.", "section": "2025年高考一模", "source": "2025年金山区一模", "year": "2025", "order": 41, "answer": "is divided", "explain": "考查动词时态、语态和主谓一致。句意：发面后，球被分成几块，卷成圆片，然后炸至起泡、金黄、酥脆。空处作句子的谓语，此处在描述通常的做法，时态应用一般现在时，divide“（使）分开”和主语the ball之间是被动关系，应用被动语态，且主语是单数，be动词应用is。故填is divided。", "blanks": 1, "multi": false}, {"q": "Interestingly, though, one 2023 study, which surveyed 244 people who listened to music at work, revealed no benefit when music _________ (use) for cognitive thinking or just played in the background.", "section": "2025年高考一模", "source": "2025年奉贤区一模", "year": "2025", "order": 42, "answer": "was used", "explain": "考查时态和语态。句意：然而，有趣的是，2023年的一项研究调查了244名在工作中听音乐的人，结果显示，当音乐用于认知思维或只是在背景中播放时，没有任何好处。when引导时间状语从句，空处在从句中作谓语，根据“one 2023 study”和句中时态可知，这里表示过去发生的事情，应用一般过去时。music和use之间是动宾关系，所以用被动语态，且主语为不可数名词，be动词用was。故填was used。", "blanks": 1, "multi": false}, {"q": "The much-loved Australian cartoon about Bluey, a seven-year-old blue dog has been a worldwide phenomenon since it _________ (launch) back in 2018.", "section": "2025年高考一模", "source": "2025年黄浦区一模", "year": "2025", "order": 43, "answer": "was launched", "explain": "考查谓语动词。句意：自2018年首播以来，这部备受欢迎的澳大利亚动画片《Bluey》已成为全球现象。空处为从句谓语动词；从句为“since”引导的时间状语从句，用一般过去时；主语为“it”，单数，和动词“launch”之间为被动关系。故填was launched。", "blanks": 1, "multi": false}, {"q": "As a child, Konde was fascinated by the skills of martial arts heroes like Jackie Chan. He _________ (accept) by Strathmore University in 2022 and his interest in kung fu received a boost upon joining the martial arts club.", "section": "2025年高考一模", "source": "2025年松江区一模", "year": "2025", "order": 44, "answer": "was accepted", "explain": "考查时态和语态。句意：2022年，他被斯特拉斯莫尔大学录取，加入武术俱乐部后，他对功夫的兴趣得到了提升。根据时间状语“in 2022”可知，这里表示过去发生的事情，应用一般过去时。主语He和accept之间是动宾关系，应用被动语态，且主语为第三人称单数，谓语用单数形式。故填was accepted。", "blanks": 1, "multi": false}, {"q": "Kung fu _________ (originate) in China and is a key part of its traditional culture. It has now grown in popularity in Kenya, particularly among school-age children.", "section": "2025年高考一模", "source": "2025年松江区一模", "year": "2025", "order": 45, "answer": "originated/originates", "explain": "考查时态。句意：功夫起源于中国，是中国传统文化的重要组成部分。这里既可表示客观事实，也可表示已发生的事情，所以可用一般现在时或一般过去时。用一般现在时的时候，主语为kung fu，谓语用单数形式。故填originated/originates。", "blanks": 1, "multi": false}, {"q": "This contrasts with the practice of washing, which _________ (recommend) frequently. As the report says, “traditional fruit-cleaning operations cannot wholly remove pesticides”.", "section": "2025年高考一模", "source": "2025年青浦区一模", "year": "2025", "order": 46, "answer": "is recommended", "explain": "考查动词时态和语态。句意：这与经常被推荐的清洗做法形成了对比。此处“which”指代“the practice of washing”，与“recommend”之间是被动关系，且描述客观事实，应用一般现在时的被动语态，其结构为“be + 过去分词”，主语是单数，be动词用“is”，故填“is recommended”。", "blanks": 1, "multi": false}, {"q": "The report, called Beyond an Age of Waste: Turning Rubbish into a Resource, _________ (release) during the U.N. Environment Assembly in Kenya early this week.", "section": "2025年高考一模", "source": "2025年崇明区一模", "year": "2025", "order": 47, "answer": "was released", "explain": "考查动词时态和语态。句意：这份名为《超越废弃物时代：将垃圾转化为资源》的报告于本周早些时候在肯尼亚举行的联合国环境大会期间发布。此处描述过去发生的动作，且“report”与“release”之间是被动关系，应用一般过去时的被动语态，其结构为“was/were + 过去分词”，主语是单数，be动词用“was”，故填“was released”。", "blanks": 1, "multi": false}, {"q": "The writers argue that humanity_________ (move) backwards over the past ten years. They say humans are creating more waste, more pollution, and more climate changing gases.", "section": "2025年高考一模", "source": "2025年崇明区一模", "year": "2025", "order": 48, "answer": "has moved/has been moving", "explain": "考查动词时态。句意：作者们认为，在过去十年里，人类一直在倒退。根据时间状语“over the past ten years”可知，此处应用现在完成时或现在完成进行时，强调动作从过去持续到现在，现在完成时结构为“have/has + 过去分词”，现在完成进行时结构为“have/has + been + 现在分词”，主语“humanity”是不可数名词，助动词用“has”，故填“has moved/has been moving”。", "blanks": 1, "multi": false}, {"q": "Within 60 seconds of hearing a bell ring, they _____ (dress) and rushing toward the chaos of a high-rise on fire. They have to head inside, knowing that floors could collapse under them and ceilings could fall on their heads.", "section": "2025年高考一模", "source": "2025年宝山区一模", "year": "2025", "order": 49, "answer": "are dressed", "explain": "考查动词时态和语态。句意：在听到铃声响起的60秒内，他们就穿好衣服，冲向着火的高层建筑的混乱现场。此处“they”和“dress”之间是被动关系，应用被动语态，且根据“rushing”可知，此处应用现在进行时，其结构为“be + 现在分词”，主语是复数，be动词用“are”，故填“are dressed”。", "blanks": 1, "multi": false}, {"q": "No matter what he does, he must control his breathing. Panic will only waste his limited air supply. His survival  _____ (depend) on more than physical fitness.", "section": "2025年高考一模", "source": "2025年宝山区一模", "year": "2025", "order": 50, "answer": "will depend", "explain": "考查动词时态。句意：他的生存将取决于不仅仅是身体健康。此处表示将来的情况，应用一般将来时，其结构为“will + 动词原形”，故填“will depend”。", "blanks": 1, "multi": false}, {"q": "Researchers at Nottingham Trent University made a game for horses where they had to touch a piece of card with their noses to get a treat. The study ________ (involve) 20 horses, who were initially rewarded with a treat for touching a piece of card with their noses.", "section": "2025年高考二模", "source": "徐汇区", "year": "2025", "order": 51, "answer": "involved", "explain": "考查动词时态。句意：这项研究涉及了20匹马，它们最初因用鼻子触碰一张卡片而得到食物奖励。文章整体描述的是过去进行的研究情况，句子主语是“The study”，“involve”是谓语动词，用一般过去时表示过去发生的动作，所以用“involved”。", "blanks": 1, "multi": false}, {"q": "This did not alter the behaviour of the horses, as they_________ (observe) touching the card regardless of the status of the light.", "section": "2025年高考二模", "source": "徐汇区", "year": "2025", "order": 52, "answer": "were observed", "explain": "考查动词时态和语态。句意：这并没有改变马的行为，因为观察到它们不管信号灯的状态如何都会去触碰卡片。“as”引导原因状语从句，从句主语“they”（指代马）和谓语动词“observe”之间是被动关系，且句子描述的是过去的情况，所以用一般过去时的被动语态“were observed”。", "blanks": 1, "multi": false}, {"q": "In another study, researchers analyzed brain scans to see how writing about negative events affected the way such events_________ (process) and handled.", "section": "2025年高考二模", "source": "浦东新区", "year": "2025", "order": 53, "answer": "were processed", "explain": "考查时态和语态。句意：在另一项研究中，研究人员分析了脑部扫描，以了解写下负面事件如何影响此类事件被处理和应对的方式。“such events”是定语从句的主语，与“process”是被动关系，即事件被处理，根据上下文时态为一般过去时，故填were processed。", "blanks": 1, "multi": false}, {"q": "Think of how you felt the last time someone you cared about_________ (take) time to write you a heartfelt message.", "section": "2025年高考二模", "source": "浦东新区", "year": "2025", "order": 54, "answer": "took", "explain": "考查时态。句意：想想上次你在乎的人花时间给你写了一封真心的信时你是什么感受。the last time引导的时间状语从句，描述过去的动作，所以用一般过去时。故填took。", "blanks": 1, "multi": false}, {"q": "Then, at last, they arrived. The vast, icy emptiness _________ (stretch) in every direction.Henson, moving quickly ahead, was the first to mark their achievement.", "section": "2025年高考二模", "source": "嘉定区", "year": "2025", "order": 55, "answer": "stretched", "explain": "考查时态。句意：广阔的冰原向四面八方延伸。文章讲述的是过去的事情，这里描述到达北极时看到的景象，用一般过去时，“stretch”的过去式是“stretched”。", "blanks": 1, "multi": false}, {"q": "When Peary arrived, they planted their flags, securing their place in history. The impossible _________ (conquer).", "section": "2025年高考二模", "source": "嘉定区", "year": "2025", "order": 56, "answer": "had been conquered", "explain": "考查时态和语态。句意：不可能的事情已经被征服了。“The impossible”与“conquer”之间是被动关系，“征服”发生在“抵达”之前，需用过去完成时，且主语the impossible与conquer之间是被动关系。故填had been conquered。", "blanks": 1, "multi": false}, {"q": "Learn from award-winning, working journalists — including two who_________ (share) Pulitzer Prizes for their reporting.", "section": "2025年高考二模", "source": "闵行区", "year": "2025", "order": 57, "answer": "have shared/shared", "explain": "考查时态。句意：向屡获殊荣的在职记者学习——其中包括两位因报道而共享普利策奖的记者。空处为句子的谓语动词。这里可以强调过去的动作对现在的影响，用现在完成时。也可用表示过去发生的动作，用一般过去时。故填have shared/shared。", "blanks": 1, "multi": false}, {"q": "For students drawn to photography, we offer a special photojournalism track for both.Every option _________ (organize) in three sections.", "section": "2025年高考二模", "source": "闵行区", "year": "2025", "order": 58, "answer": "is organized/will be organized", "explain": "考查时态和语态。句意：每个选项都分为三个部分。主语Every option与organize之间是被动关系，且此处描述的是一般情况，用一般现在时的被动语态。也可以表示将要发生的动作，用一般将来时的被动语态。故填is organized/will be organized。", "blanks": 1, "multi": false}, {"q": "Returning from studying abroad was like being hit by a wave of reality. The initial shock wasn’t in the customs or language differences I _________ (expect) abroad—it came when I stepped back into daily life in the U.S.", "section": "2025年高考二模", "source": "虹口区", "year": "2025", "order": 59, "answer": "had expected", "explain": "考查时态。句意：最初的冲击并非来自于我在国外所预期的风俗或语言差异——当我回到美国的日常生活时，它就出现了。空处为定语从句的谓语动词，expect这个动作发生在“was”之前，即过去的过去，所以要用过去完成时。故填had expected。", "blanks": 1, "multi": false}, {"q": "It felt disturbing, especially when I _________ (throw) into chaos after months of peace.", "section": "2025年高考二模", "source": "虹口区", "year": "2025", "order": 60, "answer": "was thrown", "explain": "考查时态和语态。句意：尤其是在经历了几个月的平静之后，我被抛入混乱之中，这让我感到不安。空处为从句的谓语动词，“I”和“throw”之间是被动关系，且这里描述的是过去的事情，所以用一般过去时的被动语态。故填was thrown。", "blanks": 1, "multi": false}, {"q": "And some think it’s just a quick trend and might even be harmful if practiced incorrectly.“Physiologically, humans     _________(build) for biped (双足的) mobility instead of quadruped (四足的) mobility like animals,” fitness coach Kevin Dean said.", "section": "2025年高考二模", "source": "静安区", "year": "2025", "order": 61, "answer": "are built", "explain": "考查时态语态和主谓一致。句意：从生理上讲，人类是为双足移动而进化的，而不是像动物那样的四足移动。build是谓语动词，与主语humans之间是被动关系，描述客观事实，用一般现在时的被动语态，主语是复数名词，谓语动词用复数形式。故填are built。", "blanks": 1, "multi": false}, {"q": "When the project _________ (disclose) last February, OpenAI claimed that “Sora can generate videos up to a minute long while maintaining visual quality and according to the user's hint.”", "section": "2025年高考二模", "source": "宝山区", "year": "2025", "order": 62, "answer": "was disclosed", "explain": "考查时态和语态。句意：当该项目于去年二月公布时，OpenAI声称“Sora能够生成长达一分钟的视频，同时保持视觉质量并根据用户的提示进行创作”。空格处是谓语动词，根据时间状语last February可知，描述过去发生的事，用一般过去时；主语the project与动词disclose之间是被动关系，用被动语态，主语是单数形式，be动词用was。故填was disclosed。", "blanks": 1, "multi": false}, {"q": "The construction of this station entrance, which looks particularly like the wreckage of a trolley car half buried in the ground, _________ (credit) to an architect named Zbigniew Peter Pininski.", "section": "2025年高考二模", "source": "杨浦区", "year": "2025", "order": 63, "answer": "was credited", "explain": "考查短语和时态。句意：这个看起来特别像一辆半埋在地下的电车残骸的车站入口的建造归功于一位名叫Zbigniew Peter Pininski的建筑师。空处为本句谓语动词；be credited to为固定短语，意为“归功于”，句子描述过去的事情，应用一般过去时，主语为The construction，是单数，be动词用was。故填was credited。", "blanks": 1, "multi": false}, {"q": "Many of the local residents were concerned about the impact the construction and development_________ (have) on the community.", "section": "2025年高考二模", "source": "杨浦区", "year": "2025", "order": 64, "answer": "would have", "explain": "考查动词时态。句意：许多当地居民担心建设和开发会给社区带来影响。空处为从句谓语动词；根据主句时态可判断，此处表示从过去的角度看将来会发生的动作，应用过去将来时；主语the construction and development和动词have之间为主动关系。故填would have。", "blanks": 1, "multi": false}, {"q": "Zoo worker Atthapon Nundee _________ (post) sweet moments of the animal's life for the past few months.", "section": "2025年高考二模", "source": "崇明区", "year": "2025", "order": 65, "answer": "has been posting/has posted", "explain": "考查动词时态。句意：过去几个月里，动物园工作人员阿塔蓬·农迪一直在发布这只动物生活中的温馨瞬间。根据时间状语“for the past few months”可知，动作从过去开始持续到现在，且有可能继续下去，所以可以用现在完成进行时，表示一直在做某事；也可以用现在完成时，强调过去的动作对现在造成的影响，即发布了动物生活的甜蜜时刻，使河马受到了广泛关注。主语为Zoo worker Atthapon Nundee，助动词用has。故填has been posting/has posted。", "blanks": 1, "multi": false}, {"q": "The lively 50-second song, called, naturally, Moodeng,_________ (release) by one of Thailand’s biggest recording companies, GMM Music last week.", "section": "2025年高考二模", "source": "崇明区", "year": "2025", "order": 66, "answer": "was released", "explain": "考查动词时态语态。句意：这首活泼的50秒歌曲，自然而然地被命名为《Moodeng》，由泰国最大的唱片公司之一发行。句子主语The lively 50-second song与release之间是被动关系，即这首歌被发布，且根据时间状语“last week”可知，动作发生在过去，所以用一般过去时的被动语态was/were + 过去分词，主语是单数。故填was released。", "blanks": 1, "multi": false}, {"q": "If you find that shifting your focus brings you relief and your concerns don’t resurface down the road, that ________ (count) as working.", "section": "2025年高考二模", "source": "黄浦区", "year": "2025", "order": 67, "answer": "counts/is counted", "explain": "考查时态，被动语态和主谓一致。句意：如果你发现转移注意力能让你放松，而且之后担忧的事情也没有再浮现，那就说明这样做是有效的。由find可知，句子时态用一般现在时，sth. count as/sth. be counted as是固定短语，意为“某物可以算作/某物被认为是”，that作主语谓语动词用单数，因此空格处是counts/is counted。故填counts/is counted。", "blanks": 1, "multi": false}, {"q": "The 38-year-old photographer and travel guide_________ (search) for a spot in Saudi Arabia — a massive cliff overlooking a vast desert — when she unexpectedly found herself under an amazing night sky.", "section": "2025年高考二模", "source": "奉贤区", "year": "2025", "order": 68, "answer": "was searching", "explain": "考查时态。句意：这位38岁的摄影师兼旅游导游正在沙特阿拉伯寻找一个地方——一个俯瞰广阔沙漠的巨大悬崖——这时她意外地发现自己在一个惊人的夜空下。此处为句型sb. be doing sth. when…表示“正在做某事，这时……”，发生在过去的某个时刻用过去进行时，主语为The 38-year-old photographer and travel guide，谓语用单数。故填was searching。", "blanks": 1, "multi": false}, {"q": "In November last year, another nature reserve, near the ancient oasis city of AlUla, _________ (name) the first-ever Dark Sky Park in the Middle East.", "section": "2025年高考二模", "source": "奉贤区", "year": "2025", "order": 69, "answer": "was named", "explain": "考查时态语态。句意：去年11月，另一个自然保护区，靠近古老的绿洲城市AlUla，被命名为中东第一个黑暗天空公园。主语another nature reserve与谓语name构成被动关系，根据上文In November last year可知为一般过去时的被动语态，谓语用单数。故填was named。", "blanks": 1, "multi": false}, {"q": "Breaking up motionless periods with brief walk greatly increases energy consumed daily and ________ (improve) health.", "section": "2025年高考二模", "source": "松江区", "year": "2025", "order": 70, "answer": "improves", "explain": "考查动词。句意：用短暂的散步来打破不动的时期，大大增加了每天消耗的能量，改善了健康。分析句子结构可知，空处在句中作谓语，连词and后improve（提高）与increases（增加）一起作并列谓语，时态语态需保持一致，因此也需使用一般现在时的三单形式。故填improves。", "blanks": 1, "multi": false}, {"q": "When I finally questioned the advice to “just be patient,” I realized it _________ (hold) me back.", "section": "2025年高考二模", "source": "青浦区", "year": "2025", "order": 71, "answer": "was holding/had held", "explain": "考查时态。句意：当我终于质疑“要有耐心”的建议时，我意识到它一直在阻碍我/已经阻碍了我。根据语境可知，空格处是宾语从句的谓语动词，主句的谓语动词是realized，此处可以表示过去某个时间一直在进行的动作，用过去进行时；也可以表示realized之前已经完成的动作，用过去完成时，故填was holding/had held。", "blanks": 1, "multi": false}, {"q": "When the first Chinese stand-up comedy club was set up in Shenzhen in 2009, this form of entertainment was relatively unknown to most Chinese audiences. But the growing popularity of stand-up comedy in China _________ (demonstrate) that humor has no borders.", "section": "2025年高考二模", "source": "金山区", "year": "2025", "order": 72, "answer": "demonstrates", "explain": "考查时态和主谓一致。句意：但脱口秀在中国日益增长的受欢迎程度表明幽默无国界。demonstrate(表明)是谓语动词，句子陈述客观事实，用一般现在时，主语是“the growing popularity”是不可数名词，谓语动词用单数形式。故填demonstrates。", "blanks": 1, "multi": false}, {"q": "Another two stand-up comedy industry leaders in China _________ (establish) in 2014 and 2017 respectively.", "section": "2025年高考二模", "source": "金山区", "year": "2025", "order": 73, "answer": "were established", "explain": "考查时态语态和主谓一致。句意：另外两家中国脱口秀行业的领军机构分别于2014年和2017年成立。establish(建立)是谓语动词，与主语“Another two stand-up comedy industry leaders”之间是被动关系，结合时间状语“in 2014 and 2017 respectively”可知，讲述过去的事情，用一般过去时的被动语态，主语是复数名词，助动词用were。故填were established。", "blanks": 1, "multi": false}, {"q": "What Holes tells is the story of Stanley Yelnats, a boy born into a poor family. Yelnats_________ (accuse) of a crime he didn’t commit.", "section": "2025年高考二模", "source": "长宁区", "year": "2025", "order": 74, "answer": "is accused", "explain": "考查时态和主谓一致。句意：耶尔纳茨被指控犯了一项他没有犯的罪。空处为句子谓语动词；再根据句意及空前的“… Holes tells is the story of Stanley Yelnats”可知，此处描述的是一般事实，应用一般现在时，动词accuse与主语Yelnats之间是被动关系，所以用一般现在时的被动语态，主语为第三人称单数，be动词用is。故填is accused。", "blanks": 1, "multi": false}, {"q": "Sachar’s story of hardship_________ (inspire) book readers and film audiences for years.", "section": "2025年高考二模", "source": "长宁区", "year": "2025", "order": 75, "answer": "has inspired/has been inspiring", "explain": "考查时态和主谓一致。句意：多年来，萨查尔关于苦难的故事一直激励着书籍读者和电影观众。空处为句子谓语动词；根据时间状语“for years”可知，句子应用现在完成时（have/has done）或现在完成进行时（have/has been doing），表示过去发生的动作对现在造成的影响或结果，或表示从过去某一时间开始一直持续到现在并还可能继续持续下去的动作；又因为主语Sachar’s story of hardship为第三人称单数，助动词用“has”。故填has inspired/been inspiring。", "blanks": 1, "multi": false}, {"q": "This genetic influence_________ (observe) in between 34 per cent for frequency of garden visits and 44 per cent for public nature space visits, they said.", "section": "2025年高考二模", "source": "普陀区", "year": "2025", "order": 76, "answer": "was observed/had been observed", "explain": "考查时态语态。句意：他们表示，这种遗传影响体现在34%的花园访问频率差异和44%的公共自然空间访问频率差异中。observe((在科学研究中)观测)是谓语动词，与主语This genetic influence是被动关系，根据语境，动作发生在过去，可用一般过去时的被动语态was observed，也可理解为动作发生在“他们表示”之前，即“过去的过去”，用过去完成时的被动语态had been observed。故填was observed/had been observed。", "blanks": 1, "multi": false}, {"q": "McCartney packed the other members of Wings into a van, and ________ (set) off on a tour of British universities.", "section": "名校名卷汇编", "source": "2026年上海市华东师范大学第二附属中学高三3月英语试题", "year": "", "order": 77, "answer": "set", "explain": "考查时态。句意：McCartney把其他成员装进货车，开启了英国大学巡演。分析句子结构可知，and连接并列谓语，时态与packed一致，用一般过去时。故填set。", "blanks": 1, "multi": false}, {"q": "For 23-year-old Zhao Xiangcai, a college student in Tai’an, Shandong province, climbing Taishan Mountain — a popular scenic spot known for its steep ground with over 7,000 steps — had alwa   if(/[,，.]| noted | become/i.test(src) && !/试题|试卷|中学|大学|学校|区/.test(src)) return false;

}

function compareExtraPanel(){ return quickChoicePanel('cmp','易混时态对比 · 补充练习','把比较规则马上迁移到新句子里，减少“只会看例句，不会做题”的情况。',V51_COMPARE_EXTRA,v51CompareState,'choice'); }

  if(e.target.name && /^cmp-\d+$/.test(e.target.name)){const i=Number(e.target.name.split('-')[1]);v51CompareState[i]={...(v51CompareState[i]||{}),choice:e.target.value};}

    if(type==='voc'){const q=V51_VOICE_EXTRA[i],s=v51VoiceState[i]||{}; if(!s.choice) return; v51VoiceState[i]={...s,submitted:true,ok:s.choice===q.answer}; render();}

let section='all',source='all',term='',idx=0,submission={},draft={},feedback=false,assist={};
function normalized(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!。]+$/,'');}
function variants(ans){return ans.split(/[；;]/).map(v=>v.trim()).flatMap(v=>v.includes('/')?v.split('/').map(x=>x.trim()):[v]);}
function check(q,v){if(q.multi && q.blanks>1){const parts=v.split(/[；;|]/).map(normalized),answers=q.answer.split(/[；;]/).map(normalized);return parts.length===answers.length && parts.every((x,i)=>x===answers[i]);}return variants(q.answer).some(a=>normalized(a)===normalized(v));}
const el=()=>document.querySelector('#leiqu-bank-root');
function filtered(){return data.filter(q=>(section==='all'||q.section===section)&&(source==='all'||q.source===source)&&(!term||[q.q,q.answer,q.explain,q.source,q.section].some(s=>String(s||'').toLowerCase().includes(term.toLowerCase()))));}
function clueMatches(text){
  const patterns=['this time tomorrow','by the following morning','by next friday','by the time','over the past','at the moment','all morning','for years','these days','the next day','the following year','the following morning','tomorrow morning','tomorrow evening','last year','last friday','yesterday','tomorrow','already','recently','since','for ','when ','while ','now','so far'];
  const lower=String(text).toLowerCase(); const found=[];
  for(const p of patterns){let from=0; while(true){const at=lower.indexOf(p,from); if(at<0) break; found.push({text:text.slice(at,at+p.length),start:at,end:at+p.length,kind:'clue'}); from=at+p.length;}}
  return found;
}
function decorateQuestion(text,showClues){
  const ranges=[]; const blankRe=/_{2,}\s*\([^)]+\)/g; let m;
  while((m=blankRe.exec(text))) ranges.push({start:m.index,end:m.index+m[0].length,kind:'blank'});
  if(showClues) ranges.push(...clueMatches(text).filter(r=>!ranges.some(b=>r.start<b.end&&r.end>b.start)));
  ranges.sort((a,b)=>a.start-b.start || (a.end-b.end));
  const merged=[]; for(const r of ranges){if(merged.some(x=>r.start<x.end && r.end>x.start)) continue; merged.push(r);} let out='', last=0;
  for(const r of merged){out += escapeHtml(text.slice(last,r.start)); out += `<span class="bank-${r.kind}">${escapeHtml(text.slice(r.start,r.end))}</span>`; last=r.end;}
  out += escapeHtml(text.slice(last)); return out;
}
function inferVoiceHint(q){ const ans=q.answer.toLowerCase(); if(/\b(is|are|was|were|be|been|being|has been|have been|had been|will be|would be)\b/.test(ans) && /(ed|en)\b/.test(ans)) return '优先检查主语是不是动作承受者，留意被动语态。'; return '优先检查主语是不是动作执行者，再看动作发生的时间。'; }
function reasoningHtml(q){ const clues=clueMatches(q.q).map(x=>x.text.trim()); const unique=[...new Set(clues.filter(Boolean))]; return `<div class="bank-hint-panel"><strong>答题思路引导</strong><ol><li><b>先找时间线索：</b>${unique.length?unique.map(x=>`<span class="bank-clue">${escapeHtml(x)}</span>`).join(' '):'这题没有非常典型的标志词，要结合上下文整体判断。'}</li><li><b>再判断主被动：</b>${inferVoiceHint(q)}</li><li><b>最后定形式：</b>看动作是一般发生、正在进行、已经完成，还是在某个时间点之前已经完成／持续。</li></ol></div>`; }
function renderBank(){
  const root=el(); if(!root) return; const items=filtered(); if(idx>=items.length) idx=Math.max(0,items.length-1); const q=items[idx];
  const sections=[...new Set(data.map(x=>x.section))]; const sources=[...new Set(data.filter(x=>section==='all'||x.section===section).map(x=>x.source))];
  const sub=q?submission[q.order]:null; const a=q?(assist[q.order]||{}):{};
  root.innerHTML=`<div class="bank-head"><div><div class="v27-kicker">AUTHENTIC PRACTICE · 真题专项</div><h2>上海高考时态与语态专项汇编</h2><div class="bank-headline"><p class="muted">学生版原题 · 提交后看解析 · 保留年份及试卷出处</p><span class="badge">已保留可识别出处题目</span></div></div><span class="bank-counter">${data.length} 题目段落 · 含多空题</span></div><div class="bank-ctrl"><select id="bank-section"><option value="all">全部考试批次</option>${sections.map(x=>`<option value="${escapeHtml(x)}" ${x===section?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select><select id="bank-source"><option value="all">全部地区与学校</option>${sources.map(x=>`<option value="${escapeHtml(x)}" ${x===source?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select><input id="bank-search" type="search" placeholder="搜索题目、年份、试卷或考点" value="${escapeHtml(term)}"></div>${q?`<div class="bank-card"><div class="meta">第 ${idx+1} / ${items.length} 题 · 汇编原顺序 ${q.order} · ${escapeHtml(q.section)} · ${escapeHtml(q.source)}</div><div class="bank-question">${decorateQuestion(q.q,!!a.clue)}</div><div class="bank-tools"><button type="button" id="bank-toggle-clue" class="${a.clue?'active':''}">① 标出时态线索</button><button type="button" id="bank-toggle-plan" class="${a.plan?'active':''}">② 显示答题思路</button></div>${a.plan?reasoningHtml(q):''}<div class="bank-response"><input id="bank-answer" class="${sub?(sub.ok?'ok':'bad'):''}" type="text" autocomplete="off" placeholder="${q.blanks>1?'按顺序填写多空，用分号分隔':'输入完整动词形式'}" value="${escapeHtml(draft[q.order]||'')}"><button id="bank-submit">提交答案</button><button class="ghost" id="bank-explain">查看参考解析</button></div>${sub||feedback?`<div class="bank-feedback ${sub?(sub.ok?'ok':'fail'):'ok'}"><strong>${sub?(sub.ok?'✓ 回答正确':'✗ 回答错误'):'参考解析'}</strong><p><b>参考答案：</b>${escapeHtml(q.answer)}</p><p><b>原汇编解析：</b>${escapeHtml(q.explain||'本题暂无可提取解析')}</p>${q.multi?'<p class="bank-warning">本题有多种答案或多个空格，请按原汇编核对；不同答案以原解析为准。</p>':''}</div>`:''}</div><div class="bank-nav"><button id="bank-prev" class="ghost" ${idx===0?'disabled':''}>← 上一题</button><span class="bank-stats">${idx+1} / ${items.length}</span><button id="bank-next" ${idx===items.length-1?'disabled':''}>下一题 →</button></div>`:`<div class="bank-empty">没有符合筛选条件的题目。</div>`}<p class="bank-credit">题目及解析来源：用户提供《2025–2026年上海市高考一二模&名校试卷语法汇编3：时态语态100题》（学生版／解析版）。当前页面已先移除出处识别异常的题目。</p>`;
}
function updateBank(){ if(el()) renderBank(); }
document.addEventListener('change',e=>{ if(e.target.id==='bank-section'){section=e.target.value;source='all';idx=0;feedback=false;renderBank();} if(e.target.id==='bank-source'){source=e.target.value;idx=0;feedback=false;renderBank();} },true);
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b?.dataset?.scene!==undefined) setTimeout(updateBank,0); if(!b || !el()) return; const q=filtered()[idx]; if(!q) return; if(b.id==='bank-toggle-clue'){e.preventDefault(); assist[q.order]={...(assist[q.order]||{}),clue:!(assist[q.order]||{}).clue}; renderBank(); return;} if(b.id==='bank-toggle-plan'){e.preventDefault(); assist[q.order]={...(assist[q.order]||{}),plan:!(assist[q.order]||{}).plan}; renderBank(); return;} if(b.id==='bank-submit'){e.preventDefault(); const val=(el().querySelector('#bank-answer')?.value||'').trim(); if(!val) return; draft[q.order]=val; submission[q.order]={value:val,ok:check(q,val)}; feedback=true; renderBank(); return;} if(b.id==='bank-explain'){e.preventDefault(); feedback=true; renderBank(); return;} if(b.id==='bank-prev' || b.id==='bank-next'){e.preventDefault(); idx=Math.max(0,Math.min(filtered().length-1,idx+(b.id==='bank-next'?1:-1))); feedback=false; renderBank(); return;} },true);
const observer=new MutationObserver(()=>{ const r=el(); if(r && !r.querySelector('.bank-head')) renderBank(); }); observer.observe(document.body,{childList:true,subtree:true}); window.addEventListener('hashchange',()=>setTimeout(updateBank,0)); setTimeout(updateBank,0);
})();

const db={"1": [{"q": "Long ago, Sparta, an ancient city in Greece, became known for its brave and powerful soldiers. Spartan boys, taken away from home ____①____ (train) around the age of 7, were taught discipline, physical fitness, battle skills and to obey orders. The training program, ____②____ (call) “agoge,” lasted until the young men were around 30 and was meant to produce warriors who were unbreakable, both mentally and physically.", "answer": "①to be trained ②called", "explain": "考查非谓语动词。句意：斯巴达男孩大约在7岁时被带离家去接受训练，他们被教导纪律、身体健康、战斗技能和服从命令。“be taken away from home...”的目的是“去接受训练”，所以此处应用不定式作目的状语，且男孩们与 train 之间是被动关系，故用不定式的被动式 to be trained。 考查非谓语动词。句意：这个训练项目被称为“agoge”，一直持续到这些年轻人大约 30 岁，旨在培养出在精神和身体上都坚不可摧的战士。句中已有谓语 lasted，call 在句中应用非谓语动词形式，与逻辑主语 The training program 构成被动关系，故用过去分词作后置定语。故填 called。", "source": "2026年宝山一模", "batch": "2026年高考一模", "id": 1}, {"q": "Many participants consider it highly beneficial to participate in an OCR. After __________(complete) one, many say they leave, in true Spartan fashion, with the ability and determination to face and overcome life’s obstacles.", "answer": "completing", "explain": "考查非谓语动词。句意：在完成一场比赛后，许多人说，他们以真正的斯巴达风格离开，有能力也有决心面对并克服生活中的障碍。After 为介词，其后应接动名词作宾语。故填completing。", "source": "2026年宝山一模", "batch": "2026年高考一模", "id": 2}, {"q": "On 27 September, three protesters from an environmental campaign group called Just Stop Oil threw tomato soup at two paintings by Vincent van Gogh. This attack happened on the same day that two other Just Stop Oil members were sent to prison for a similar harmful act in October 2022, ________ (cause) thousands of pounds’ worth of damage.", "answer": "causing", "explain": "考查非谓语动词。句意：这次袭击发生在同一天，当时另外两名Just Stop Oil成员因2022年10月类似的破坏行为被判入狱，造成了数千英镑的损失。本句谓语为\thappened，空处是非谓语动词，用cause“造成”的现在分词形式，作结果状语，表示自然而然的结果。故填causing。", "source": "2026年长宁一模", "batch": "2026年高考一模", "id": 3}, {"q": "Youth Demand called on the UK Government to stop selling weapons to other countries. Other artworks ________ (attack) include The Hay Wain by John Constable and The Toilet of Venus by Diego Velazquez.", "answer": "attacked", "explain": "考查非谓语动词。句意：其他受到攻击的艺术品包括John Constable的《The Hay Wain》和Diego Velazquez的《The Toilet of Venus》。本句谓语为include，空处是非谓语动词，逻辑主语artworks与attack“攻击”之间是被动关系，故用过去分词形式，作后置定语。故填attacked。", "source": "2026年长宁一模", "batch": "2026年高考一模", "id": 4}, {"q": "Just Stop Oil and Youth Demand have offered to meet up with staff from the National Gallery ________ (discuss) the situation. A statement from Just Stop Oil said, “These actions cause small amounts of damage and disturbance.", "answer": "to discuss", "explain": "考查非谓语动词。句意：Just Stop Oil和Youth Demand已经提出与国家美术馆的工作人员会面，讨论这一情况。本句谓语为have offered，空处是非谓语动词，用discuss“讨论”的不定式形式，作目的状语。故填to discuss。", "source": "2026年长宁一模", "batch": "2026年高考一模", "id": 5}, {"q": "Bruno Bettelhem, a well-known scholar, suggested that fairy tales allow the mind to deal safely with emotions like jealousy, loneliness,and loss. The deep parts of the story, ________ (act) like a mirror, help readers understand the hidden corners of their own hearts.", "answer": "acting", "explain": "考查非谓语动词。句意：故事的深层部分就像一面镜子，帮助读者了解自己内心深处隐藏的角落。本句已有谓语动词help，所以act用非谓语形式，和逻辑主语The deep parts of the story之间是主动关系，用现在分词形式。故填acting。", "source": "2026年虹口一模", "batch": "2026年高考一模", "id": 6}, {"q": "Without fear, their lessons lose depth. ________ (shape) by facing imaginary monsters, readers learn how to face real-life challenges.", "answer": "Shaped", "explain": "考查非谓语动词。句意：在直面想象中的怪兽、历经心灵淬炼后，读者终将学会如何应对现实生活中的种种挑战。本句已有谓语动词learn，所以shape用非谓语形式，根据空后by可知，需用过去分词形式表被动，位于句首，首字母应大写。故填Shaped。", "source": "2026年虹口一模", "batch": "2026年高考一模", "id": 7}, {"q": "They remind us that before reaching “happily ever after,” every hero or heroine still has to walk through the forest of uncertainty—and it is the journey through that darkness that makes the ending worthy ________ (remember).", "answer": "to be remembered", "explain": "考查非谓语动词。句意：它们提醒我们，在到达“从此幸福地生活在一起”之前，每个男女主人公仍然要走过不确定的森林——而正是穿过黑暗的旅程才使结局值得铭记。此处是固定搭配：be worthy to be done意为“值得被做”。故填to be remembered。", "source": "2026年虹口一模", "batch": "2026年高考一模", "id": 8}, {"q": "By the mid-21st century,the term “nose job” had been completely redefined. No longer referring to simple cosmetic surgery, it now described a radical procedure to augment the human sense of smell, ________(grant) individuals olfactory (嗅觉) powers equivalent to a bloodhound’s.", "answer": "granting", "explain": "考查非谓语动词。句意：它不再指简单的美容手术，而是描述了一种增强人类嗅觉的革命性手术，赋予个人相当于寻血猎犬的嗅觉能力。此处在句中作状语，主语为it，与grant之间为主动关系，故应用现在分词作状语。故填granting。", "source": "2026年徐汇一模", "batch": "2026年高考一模", "id": 9}, {"q": "When the nose was reattached, neural stem cells grew, forging (建立) new connections to the brain’s olfactory bulb. ________ (accommodate) this new hardware, most patients accepted a slightly larger, more bulbous nose, while a minority even opted for a “wet” nose modification to enhance scent trapping, much like a dog’s.", "answer": "To accommodate", "explain": "考查不定式。句意：为了容纳这套新“硬件”，大多数患者接受了稍微更大、更圆润的鼻子，少数人甚至选择了类似狗的“湿润”鼻子改造，以增强气味捕捉能力。此处在句中作状语，表示接受更大更圆润的鼻子的目的是为了容纳这套新硬件，故应用不定式作目的状语。首字母大写。故填To accommodate。", "source": "2026年徐汇一模", "batch": "2026年高考一模", "id": 10}, {"q": "The reasons for ________ (undergo) the augmentation were as varied as the scents it revealed. Many sought it for professional advancement.", "answer": "undergoing", "explain": "考查动名词。句意：人们选择接受这种增强手术的原因，就像它能揭示的气味一样多种多样。根据空前的介词for可知，此处应用动名词作宾语，故填undergoing。", "source": "2026年徐汇一模", "batch": "2026年高考一模", "id": 11}, {"q": "Did you know that Lewis Carroll, best known as the writer of Alice’s Adventures in Wonderland, was really named Charles Lutwidge Dodgson? This is just one of the fascinating facts ________ (find) in Pen Names, a new book by Adrian Scott.", "answer": "found", "explain": "考查非谓语动词。句意：这只是阿德里安・斯科特的新书《笔名》中记载的一个有趣事实。句子谓语为is，空处为非谓语动词。动词find与逻辑主语facts之间是被动关系（事实被发现），应用find的过去分词形式found作后置定语。故填found。", "source": "2026年浦东新区一模", "batch": "2026年高考一模", "id": 12}, {"q": "________ (consist) of just under 140 pages, the book is a manageable work and begins with a detailed introduction of the literary pseudonym’s history.", "answer": "Consisting", "explain": "考查非谓语动词。句意：这本书篇幅不到140页，内容通俗易懂，开篇详细介绍了文学笔名的历史。句子谓语为is，空处为非谓语动词。consist of与逻辑主语the book之间是主动关系，应用现在分词作状语，句首单词首字母需大写。故填Consisting。", "source": "2026年浦东新区一模", "batch": "2026年高考一模", "id": 13}, {"q": "Pen names takes us through the reasoning of individual writers as they developed and used a pen name to author their work. Some of these literary figures are surprisingly well-known under their own names but chose ________ (publish) some work under a second name.", "answer": "to publish", "explain": "考查非谓语动词。句意：这些文学人物中，有些人本名已经非常出名，却选择用另一个名字发表部分作品。choose to do sth.为固定短语，意为“选择做某事”。故填to publish。", "source": "2026年浦东新区一模", "batch": "2026年高考一模", "id": 14}, {"q": "According to new research, cutting off rhinos’ horns reduces the poaching (偷猎) of the animals by nearly 80%. Rhinos are hunted for their horns, and scientists think there are now fewer than 28,000 rhinos________ (leave) in the world.", "answer": "left", "explain": "考查非谓语动词。句意：犀牛因犀角被猎杀，科学家认为目前全球仅存不足28000头犀牛。句中已有谓语are，此空应是非谓语。rhinos与leave是动宾关系，应用过去分词left。故填left。", "source": "2026年杨浦区一模", "batch": "2026年高考一模", "id": 15}, {"q": "More than 700 poachers were arrested, but the researchers found that________ (arrest) the illegal hunters didn’t significantly reduce the number of rhinos that were killed.", "answer": "arresting", "explain": "考查非谓语动词。句意：700多名偷猎者被捕，但研究人员发现逮捕非法猎人并未显著减少犀牛被杀的数量。此处作宾语从句的主语，应用动名词arresting。故填arresting。", "source": "2026年杨浦区一模", "batch": "2026年高考一模", "id": 16}, {"q": "________ (call) the method “dehorning”, the researchers are now cutting off the rhinos’ horns in an attempt to protect them.", "answer": "Calling", "explain": "考查非谓语动词。句意：研究人员将这种方法称为“去角”，现在正切断犀角以保护它们。句中已有谓语are cutting off，此空应是非谓语。the researchers与call是主谓关系，应用现在分词Calling。首字母大写。故填Calling。", "source": "2026年杨浦区一模", "batch": "2026年高考一模", "id": 17}, {"q": "The two men were the Kangxi Emperor of China’s Qing Dynasty and King Louis XIV of France. A symbolic image from the period captured the exchange: European ambassadors (使臣), ________ (dress) in the robes of Qing officials, stood beside an armillary sphere in the court of the Kangxi Emperor.", "answer": "dressed", "explain": "考查非谓语动词。句意：这一时期的一幅标志性画作记录了这场交流：身着清朝官员服饰的欧洲使臣，站在康熙皇帝朝堂上的一件浑天仪旁。此处为非谓语动词作定语，European ambassadors与dress为被动关系，用过去分词dressed。故填dressed。", "source": "2026年奉贤区一模", "batch": "2026年高考一模", "id": 18}, {"q": "It is natural for many of us ________ (marvel) at the Chinese emperor’s good knowledge of Western technologies.", "answer": "to marvel", "explain": "考查非谓语动词。句意：我们很多人自然会惊叹于这位中国皇帝对西方技术的渊博学识。此处为固定句型“It is + adj. + for sb. to do sth.”，it作形式主语，真正的主语是后面的不定式，所以此处用to marvel作主语。故填to marvel。", "source": "2026年奉贤区一模", "batch": "2026年高考一模", "id": 19}, {"q": "In court speeches, Kangxi would hold forth on the natural sciences from Europe, ________ (lecture) young princes about astronomy, calendar systems and arithmetic.", "answer": "lecturing", "explain": "考查非谓语动词。句意：在朝堂讲学中，康熙会讲解来自欧洲的自然科学知识，向皇子们讲授天文、历法和算术。此处为非谓语动词作状语，Kangxi与lecture为主动关系，用现在分词lecturing。故填lecturing。", "source": "2026年奉贤区一模", "batch": "2026年高考一模", "id": 20}, {"q": "Banning phones from lessons doesn’t mean ________ (rob) children of experience with modern technology. They get plenty of that outside school; gaps can be filled up.", "answer": "robbing", "explain": "考查非谓语动词。句意：禁止在课堂上使用手机并不意味着剥夺孩子们接触现代科技的机会。短语mean doing sth.表示“意味着做某事”。故填robbing。", "source": "2026年松江区一模", "batch": "2026年高考一模", "id": 21}, {"q": "Tech-enthusiasts like to point to a long history of ________ (misplace) doubt about technology and its impact on education.", "answer": "misplaced", "explain": "考查非谓语动词。句意：技术爱好者们常常会提及这样一个事实：长期以来，人们一直对技术及其对教育的影响存在错误的怀疑态度。修饰名词doubt，表示“不当的”，非谓语动词misplaced做定语，故填misplaced。", "source": "2026年松江区一模", "batch": "2026年高考一模", "id": 22}, {"q": "A recent study, following 17,000 higher-education students in India for three years, concluded that requiring phones ________ (leave) outside classrooms led to a measurable improvement in grades.", "answer": "to be left", "explain": "考查非谓语动词。句意：最近的一项研究对印度的17000名高等教育学生进行了为期三年的跟踪调查，结果表明，要求学生将手机留在教室外这一举措显著提高了他们的学习成绩。固定搭配require sth. to be done表示“要求某物被做”，此处指“要求手机被留在教室外”，故填to be left。", "source": "2026年松江区一模", "batch": "2026年高考一模", "id": 23}, {"q": "If it is packaging itself that has been thrown, it will probably end up as a dirty form of fuel, ________ (power) the production of concrete or even tofu.", "answer": "powering", "explain": "考查非谓语动词。句意：如果被丢弃的本身就是包装，它很可能最终会成为一种肮脏的燃料，为混凝土甚至豆腐的生产提供动力。分析句子结构可知，句中已有谓语动词will end up，此处应用非谓语动词，power与逻辑主语a dirty form of fuel 之间是主动关系，应用现在分词作状语。故填powering。", "source": "2026年青浦区一模", "batch": "2026年高考一模", "id": 24}, {"q": "He follows rubbish, travelling to some of the world’s most unpleasant places to record the effects of consumption: villages in Indonesia ________ (bury) under mountains of Western plastic, a ship-breaking yard in Turkey where men tear apart the harmful shells of American passenger ships, a slum (贫民窟) in Ghana where migrants obtain valuable metals from the rich world’s abandoned computers and mobile phones.", "answer": "buried", "explain": "考查非谓语动词。句意：他追踪垃圾，前往世界上一些最令人不适的地方记录消费的影响：印度尼西亚的村庄被西方塑料山掩埋，土耳其的一个拆船场，那里的人们拆解美国客轮的有害外壳，加纳的一个贫民窟，移民们从富裕世界废弃的电脑和手机中获取有价值的金属。分析句子结构可知，句中已有谓语动词follows，此处应用非谓语动词，villages与bury之间是被动关系，应用过去分词作后置定语。故填buried。", "source": "2026年青浦区一模", "batch": "2026年高考一模", "id": 25}, {"q": "The best of the bunch was a humanoid called Tiangong Ultra, ______ (develop) by the Beijing Humanoid Robot Innovation Center, which won the robot race in 2 hours and 40 minutes.", "answer": "developed", "explain": "考查非谓语动词。句意：其中表现最好的是一款名为“天工Ultra”的人形机器人，由北京人形机器人创新中心开发，以2小时40分钟的成绩赢得了机器人组冠军。空处作非谓语动词，develop和逻辑主语a humanoid called Tiangong Ultra之间是被动关系，应用过去分词作后置定语。故填developed。", "source": "2026年崇明区一模", "batch": "2026年高考一模", "id": 26}, {"q": "Even better, Tiangong Ultra crossed the finish line within the human cut-off time of three hours and 10 minutes. It made it the only robot ______ (qualify) for a human participation award.", "answer": "to be qualified", "explain": "考查非谓语动词。句意：这使它成为唯一有资格获得人类参与奖的机器人。空处为非谓语动词作后置定语，修饰名词robot，当名词有the only修饰，其后用不定式作后置定语，qualify“符合”和robot之间可以是主动关系，强调机器人自身符合获奖条件，可用to qualify；也可用不定式的被动形式to be qualified，强调机器人被官方授予资格。故填to qualify/to be qualified。", "source": "2026年崇明区一模", "batch": "2026年高考一模", "id": 27}, {"q": "It was the tallest robot in the field, too, ______ (tower) over many human adults at nearly six feet (about 1.8 meters). By contrast, the shortest robot participant — which wore a blue and white tracksuit and waved at people every few seconds — was just 2.5 feet (about 0.76 meters) tall.", "answer": "towering", "explain": "考查非谓语动词。句意：它也是赛场上最高的机器人，身高近6英尺（约1.8米），比许多成年人都高。空处作非谓语动词，动词tower“高耸；高出”和逻辑主语It（指代前文的机器人）之间是主动关系，应用现在分词作状语。故填towering。", "source": "2026年崇明区一模", "batch": "2026年高考一模", "id": 28}, {"q": "Despite sleeping less than the ________ (recommend) eight hours, Japanese individuals generally have better health outcomes, living longer with lower rates of cancer and heart disease compared to North Americans.", "answer": "recommended", "explain": "考查非谓语动词。句意：尽管睡眠时间少于推荐的8小时，但日本人的健康状况普遍更好，与北美人相比，他们寿命更长，癌症和心脏病的发病率也更低。此处修饰名词短语eight hours，eight hours与动词recommend之间是逻辑上的被动关系，用过去分词recommended作定语。故填recommended。", "source": "2026年嘉定区一模", "batch": "2026年高考一模", "id": 29}, {"q": "In North American culture, there is a strong, widespread belief that getting 8 hours of sleep is essential for ________ (maintain) good health.", "answer": "maintaining", "explain": "考查非谓语动词。句意：在北美文化中，有一种普遍且根深蒂固的观念，即8小时睡眠对于维持良好健康至关重要。此处为固定搭配“be essential for doing sth.”，意为“对做某事至关重要”，for为介词，后接动名词maintaining作宾语，故填maintaining。", "source": "2026年嘉定区一模", "batch": "2026年高考一模", "id": 30}, {"q": "Participants wore watches ________ (track) their actual sleep and answered questions about sleep beliefs and health. The results were clear: Japanese students averaged about 6 hours of sleep per night, significantly less than 7 hours among Canadian students.", "answer": "to track", "explain": "考查非谓语动词。句意：参与者佩戴手表记录他们的实际睡眠情况，并回答关于睡眠观念和健康的问题。此处应用不定式作目的状语，说明“佩戴手表”的目的是“记录睡眠情况”，故填to track。", "source": "2026年嘉定区一模", "batch": "2026年高考一模", "id": 31}, {"q": "According to iiMedia Research, the pet industry is expected to reach 1.15 trillion yuan by 2028. ________ (support) by rising incomes and changing lifestyles, the industry continues to expand rapidly.", "answer": "Supported", "explain": "考查非谓语动词。句意：在收入增加和生活方式转变的支撑下，这个行业持续快速扩张。此处为非谓语动词作状语，the industry与support为被动关系，用过去分词supported，位于句首，首字母大写。故填Supported。", "source": "2026年金山区一模", "batch": "2026年高考一模", "id": 32}, {"q": "Shanghai leads this trend, ________ (host) over 120,000 pet-related businesses.“In China, over 90% of pet owners see their pets as family.", "answer": "hosting", "explain": "考查非谓语动词。句意：上海引领了这一趋势，拥有超过12万家宠物相关企业。此处为非谓语动词作状语，Shanghai与host为主动关系，用现在分词hosting。故填hosting。", "source": "2026年金山区一模", "batch": "2026年高考一模", "id": 33}, {"q": "Major commercial projects are adapting quickly. Many shopping malls are introducing pet-friendly facilities  ________ (attract) visitors.", "answer": "to attract", "explain": "考查非谓语动词。句意：许多购物中心正在引入宠物友好型设施，以吸引游客。此处为非谓语动词作目的状语，用动词不定式to attract。故填to attract。", "source": "2026年金山区一模", "batch": "2026年高考一模", "id": 34}, {"q": "Kirsten Bethmann started photographing families in 2005. She was living in North Carolina, and found the era’s typical style to be pretty inspired, with families ________ (stand) awkwardly amid low, windswept sand hills.", "answer": "standing", "explain": "考查非谓语动词。句意：她发现当时的典型风格相当富有创意，家庭在被风吹过的低矮沙丘中尴尬地站着。此处是“with+宾语+宾补”结构，families与stand是主谓关系，应用现在分词standing，作宾补。故填standing。", "source": "2026年闵行区一模", "batch": "2026年高考一模", "id": 35}, {"q": "She instructed families to play on the beach for most of their hour-long session, and then spend 10 minutes taking traditional, ______ (pose) photos.", "answer": "posed", "explain": "考查非谓语动词。句意：她指导家庭在海滩上玩耍大部分时长，然后花10分钟拍摄传统摆拍的照片。此处修饰photos，pose与photos是动宾关系，应用过去分词pos
