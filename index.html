ed，作定语，意为“摆拍的”。故填posed。", "source": "2026年闵行区一模", "batch": "2026年高考一模", "id": 36}, {"q": "The deep-seated urge ________ (hold) on to a memory is almost instinctive, as seen in our ancestors’ cave drawings or storytelling around a fire.", "answer": "to hold", "explain": "考查非谓语动词。句意：这种根深蒂固的保留记忆的冲动几乎是一种本能。此处是固定搭配the urge to do sth.，意为“做某事的渴望”，应用动词不定式to hold作后置定语，修饰名词urge。故填to hold。", "source": "2026年闵行区一模", "batch": "2026年高考一模", "id": 37}, {"q": "The plan is ________ (shoot) it with a paintball gun and make loud noises-essentially to recondition it and retrain it, to teach the bear to be more afraid of humans by associating a bad experience with human activity.", "answer": "to shoot", "explain": "考查非谓语动词。句意：计划是用彩弹枪射击它并制造巨大噪音——本质上是对它进行重新适应和训练，通过将糟糕的经历与人类活动联系起来，教这只熊更害怕人类。此处用动词不定式作表语，说明“计划”的具体内容。故填to shoot。", "source": "2026年静安区一模", "batch": "2026年高考一模", "id": 38}, {"q": "“Leaving trash outside and not ________ (lock) up or having any food source around your house is conditioning a bear to be habituated,” Hawley said. Even more reckless (鲁莽的), he said, is intentionally feeding a bear.", "answer": "locking", "explain": "考查非谓语动词。句意：霍利说：“把垃圾留在外面、不锁好（门窗）或者房子周围有任何食物来源，都会让熊形成习惯化。”此处与Leaving并列作主语，用动名词形式，lock的动名词是locking。故填locking。", "source": "2026年静安区一模", "batch": "2026年高考一模", "id": 39}, {"q": "“It is harming that bear,” Hawley said. “When someone feeds a bear, they are changing their behavior to not fear humans, which means that animal ultimately will end up __________ (harm) someone else or have to be put down.”", "answer": "harming", "explain": "考查非谓语动词。句意：“当有人喂食黑熊时，他们正在改变黑熊的行为，使它们不再害怕人类，这意味着这只熊最终要么伤害到别人，要么不得不被安乐死。”end up doing sth.是固定搭配，意为“最终做某事”，harm与animal之间是主动关系，用动名词形式harming。故填harming。", "source": "2026年静安区一模", "batch": "2026年高考一模", "id": 40}, {"q": "Some have even challenged her,insisting she stop ______ (feed) the animals.Ms Malhotra says she usually prefers to stay calm in such situations,but there have been instances when she’s had to be firmer.", "answer": "feeding", "explain": "考查非谓语动词。句意：有些人甚至质疑她，坚持让她停止喂食动物。空处为非谓语动词形式担当动词“stop”的宾语，意为“停止做某事”，用动名词形式。故填feeding。", "source": "2026年黄浦区一模", "batch": "2026年高考一模", "id": 41}, {"q": "However,a rising number of people in Delhi say they fear dog bites and groups of homeless dogs can often be seen chasing children and the elderly.Government data shows that there were 3.7 million ________ (report) cases of dog bites across the country in 2024.", "answer": "reported", "explain": "考查非谓语动词。句意：政府数据显示，2024年全国有370万例狗咬伤报告。修饰名词“cases”用形容词形式，意为“已报告的、经申报的”，符合句意。故填reported。", "source": "2026年黄浦区一模", "batch": "2026年高考一模", "id": 42}, {"q": "Inspired by my daughter’s tales of backpacking adventures and my desire to hang out with my youngest son outside the house, I booked two tickets to Shanghai for the September school holidays, surprising us both. We, ________ (arm) with a budget, some travel insurance, and a rough plan built around some last-minute internet searches, headed to the airport.", "answer": "armed", "explain": "考查非谓语动词。句意：我们带着预算、一些旅行保险，还有一份靠最后时刻上网搜索制定的粗略计划，前往机场。此句中已有谓语动词headed，此处需填非谓语形式，arm与主语We之间是被动关系，应用过去分词形式armed，表示“装备着、带着”。故填armed。", "source": "2026年普陀区一模", "batch": "2026年高考一模", "id": 43}, {"q": "He dragged me shopping for jeans in stores and made me catch buses ________ (take) us in the wrong direction entirely. He was just as likely as I was________ (know) what train to catch, or find the right street to turn down, or stand in awe at the foot of a giant temple, or queue for hours for a steaming bowl of Xiaolongbao.", "answer": "taking；to know", "explain": "【详解1】 考查非谓语动词。句意：他拉着我去商店买牛仔裤，还让我坐上了那些把我们完全带向错误方向的公交车。此句中已有谓语动词dragged，此处需填非谓语形式，设空处作后置定语，take与buses之间是主动关系，应用现在分词形式taking，译为“带领、运送”。故填taking。 【详解2】 考查非谓语动词。句意：他和我一样，可能知道该坐哪趟火车，该拐进哪条正确的街道，会在宏伟的寺庙脚下惊叹，也会排几个小时的队买一碗热气腾腾的小笼包。此处为固定结构“be likely to do sth.”，译为“很可能做某事”，应用动词不定式to know。故填to know。", "source": "2026年普陀区一模", "batch": "2026年高考一模", "id": 44}, {"q": "_________ (break) free from this prejudice, remember why you are on social media.", "answer": "1. coined\t\t2. being called\t\t3. To break", "explain": "", "source": "浦东新区", "batch": "2025年高考一模", "id": 45}, {"q": "________(invest）in their world, I could see myself making a difference to the team's writing ability.", "answer": "1. to help;guiding  2. Invested", "explain": "", "source": "闵行区", "batch": "2025年高考一模", "id": 46}, {"q": "Their research revealed that biocrusts, primarily _____ (compose)of moss or bacteria, covered more than two-thirds of the Wall's surface in the areas they examined.", "answer": "1. to protect/to be protecting\t\t2. ranging\t3. composed", "explain": "", "source": "普陀区", "batch": "2025年高考一模", "id": 47}, {"q": "Today, we use a combination of these methods, from freezing and canning to drying and salting,__________ (ensure) that food lasts longer and remains safe to eat.", "answer": "1. stored\t2. drying\t3. to ensure", "explain": "", "source": "嘉定区", "batch": "2025年高考一模", "id": 48}, {"q": "But we hope that, ________(read) this, you will be aware of the impact your choices may have on the health of our planet.", "answer": "1. to copy\t\t2. used\t\t3. having read/reading", "explain": "", "source": "虹口区", "batch": "2025年高考一模", "id": 49}, {"q": "Once ________(stuff), large containers can get heavy.", "answer": "1. growing\t2. to fill\t3.stuffed", "explain": "", "source": "长宁区", "batch": "2025年高考一模", "id": 50}, {"q": "It can learn— not from instructions, but from ______ (give) examples.", "answer": "1. to manage/to be managed\t2.fed\t3.being given/given", "explain": "", "source": "徐汇区", "batch": "2025年高考一模", "id": 51}, {"q": "Fortunately, his club, though ______ (found) only a year ago, has now over 100 regulars.", "answer": "1. to be reading\t2. recommended\t3. founded", "explain": "", "source": "杨浦区", "batch": "2025年高考一模", "id": 52}, {"q": "Therefore, some oils may be safe for skin, when appropriately ________ (apply).", "answer": "1. to attract\t2. mixing\t\t3. applied", "explain": "", "source": "静安区", "batch": "2025年高考一模", "id": 53}, {"q": "There is no oral tradition ______ (teach) about frybread.", "answer": "1. known\t\t2. aiming\t\t3. to be taught", "explain": "", "source": "金山区", "batch": "2025年高考一模", "id": 54}, {"q": "But if you’re just here for the best tracks ______ (boost) your productivity, we’ve got some recommendations for you.", "answer": "1. conducted\t2. listening\t3. to boost", "explain": "", "source": "奉贤区", "batch": "2025年高考一模", "id": 55}, {"q": "The story is actually an old tale that first originated in the Huainanzi, an ancient Chinese text ______ (date) back to 139 BC.", "answer": "1. to exist\t2. called\t3. dating", "explain": "", "source": "黄浦区", "batch": "2025年高考一模", "id": 56}, {"q": "He sees 2023 as the highlight of his kung fu journey, after ________ (declare) to be one of Kenya’s top competitors in the featherweight category.", "answer": "1. improved\t2. being declared", "explain": "", "source": "松江区", "batch": "2025年高考一模", "id": 57}, {"q": "Before allowing a pesticide ______ (use) on a food product, the Environmental Protection Agency sets limits on how much of the pesticide may be used on food during growing, processing, and storage.", "answer": "1. situated\t2.to be used", "explain": "", "source": "青浦区", "batch": "2025年高考一模", "id": 58}, {"q": "“There is an interest, especially among the countries (8) _____ are producing raw polymer (聚合物), but as I keep telling them, this is not an anti-plastic agreement,” Andersen told the reporters, (9) _____ (note) there would still be a need for plastics in vehicles and medical equipment.", "answer": "1. caused；2. to deal；3. noting", "explain": "", "source": "崇明区", "batch": "2025年高考一模", "id": 59}, {"q": "They practice quickly _____ (assess) the changing conditions of a fire.", "answer": "1.to break；2. assessing", "explain": "", "source": "宝山区", "batch": "2025年高考一模", "id": 60}, {"q": "This showed the animals have the ability to think and plan ahead—something previously__________ (consider) to be beyond their capacity.", "answer": "1.to ensure；2.switching；3.considered", "explain": "", "source": "徐汇区", "batch": "2025年高考二模", "id": 61}, {"q": "Wherever I’d go in the world, you’d find my handwritten notes__________(display) on employees’ bulletin boards(公告栏).", "answer": "1.to clarify；2.healing/to be healed；3.displayed", "explain": "", "source": "浦东新区", "batch": "2025年高考二模", "id": 62}, {"q": "Ice formed on their skin,__________  (bite) deeper with every burst of wind.", "answer": "1.sewn；2.to be forced；3.biting", "explain": "", "source": "嘉定区", "batch": "2025年高考二模", "id": 63}, {"q": "Applications for learn-at-home sessions__________  (start) from June 17, July 1, and July 15 are due: May 10.", "answer": "1．to inspire；2．drawn；3．starting", "explain": "", "source": "闵行区", "batch": "2025年高考二模", "id": 64}, {"q": "I had once been set on a future in cardiothoracic surgery (心胸外科手术),__________  (convince) that medical school was my calling.", "answer": "1.not understanding；2.to share；3.convinced", "explain": "", "source": "虹口区", "batch": "2025年高考二模", "id": 65}, {"q": "“It really works your legs and shoulders at the same time,” he said,__________ (add) that the sport burned more calories as well.", "answer": "1.described；2.adding", "explain": "", "source": "静安区", "batch": "2025年高考二模", "id": 66}, {"q": "This process could be compared to a worker__________ (melt) raw gold multiple times in order to remove all its useless elements.", "answer": "1.based；2.to recognize；3.melting", "explain": "", "source": "宝山区", "batch": "2025年高考二模", "id": 67}, {"q": "At the time, the subway station was simply a proposal __________ (extend) Frankfurt’s subway system.", "answer": "1.Featuring；2.to extend", "explain": "", "source": "杨浦区", "batch": "2025年高考二模", "id": 68}, {"q": "Pygmy hippos are native to West Africa, but experts say there are only 2,000-3,000 of them__________(leave) in the wild.", "answer": "1.to write；2.breeding；3.left", "explain": "", "source": "崇明区", "batch": "2025年高考二模", "id": 69}, {"q": "But when you use it on yourself, it’s a strategy__________ (know) as distanced self-talk, which can be a powerful way to regulate negative emotions.", "answer": "1.coping/to cope；2.to decrease；3.known", "explain": "", "source": "黄浦区", "batch": "2025年高考二模", "id": 70}, {"q": "This guide will enable residents and visitors to see the night sky above AlUla in all its natural beauty for years __________ (come).", "answer": "1.connected；2.topping；3.to come", "explain": "", "source": "奉贤区", "batch": "2025年高考二模", "id": 71}, {"q": "The latest research, which hundreds of participants took part in, involved__________ (measure) the amount of energy people consumed while walking on an exercise machine or climbing stairs.", "answer": "1.published\t2.measuring", "explain": "", "source": "松江区", "batch": "2025年高考二模", "id": 72}, {"q": "When__________ (face) with advice, take a moment to assess it.", "answer": "1.leading\t\t2.faced", "explain": "", "source": "青浦区", "batch": "2025年高考二模", "id": 73}, {"q": "The competition is intense, with new shows constantly appearing and older ones innovating__________ (stay) relevant.", "answer": "1.focusing；2.transformed；3.to stay", "explain": "", "source": "金山区", "batch": "2025年高考二模", "id": 74}, {"q": "Holes is the first of three shows__________ (take) on tour over the next three years.", "answer": "1.produced\t2.digging\t\t3.to be taken", "explain": "", "source": "长宁区", "batch": "2025年高考二模", "id": 75}, {"q": "Our results help to explain why some people have a stronger desire than others __________(be) in nature.", "answer": "1．carried\t2．involving\t 3．to be", "explain": "", "source": "普陀区", "batch": "2025年高考二模", "id": 76}], "2": [{"q": "Racers travel to severe environments in remote locations like Mongolia and Iceland to race 50 kilometers across rough territory. It’s advertised as the most physically and mentally challenging adventure_______will forever change your view of yourself.", "answer": "that", "explain": "考查定语从句。句意：它被宣传为最具身体和精神挑战性的冒险，这将永远改变你对自己的看法。此处为定语从句修饰先行词 adventure，先行词在从句中作主语，指物，且由形容词最高级修饰，只能用关系代词that 引导。故填 that。", "source": "宝山区", "batch": "2026年高考一模", "id": 1}, {"q": "On 9 October, a painting entitled Motherhood, by Pablo Picasso, was targeted by a campaign group called Youth Demand, ________ members messed up the frame, spotted the wall and also poured red paint over the floor.", "answer": "whose", "explain": "考查定语从句。句意：10月9日，Pablo Picasso的一幅名为《Motherhood》的画作遭到一个名为“Youth Demand”的竞选团体的攻击，该团体的成员弄乱了画框，在墙上泼了污点，还在地板上泼了红漆。空处引导非限制性定语从句，先行词是campaign group，关系词代替先行词在从句中作定语，修饰名词members，故用关系代词whose引导。故填whose。", "source": "长宁区", "batch": "2026年高考一模", "id": 2}, {"q": "Folk stories reflected that world. In Hansel and Gretel, two children are abandoned and almost captured by a witch (女巫), ________ reminds us that cleverness and courage are needed for survival.", "answer": "which", "explain": "考查定语从句。句意：在《韩塞尔与格蕾特》中，两个孩子被抛弃，差点被女巫抓走，这提醒我们，生存需要聪明和勇气。空处引导非限制性定语从句，先行词是前面整句话，在从句中作主语，用which引导。故填which。", "source": "虹口区", "batch": "2026年高考一模", "id": 3}, {"q": "Chefs created more exquisite dishes, detectives could assess the precise timeline of a crime scene, and diplomats could detect lies and hidden emotions in negotiations with uncanny accuracy. Ecologists could literally sniff out the health of an ecosystem, sensing soil conditions and plant vitality, ____8____ revolutionized restoration efforts.", "answer": "which", "explain": "考查定语从句。句意：生态学家简直能嗅出生态系统的健康状况，感知土壤条件和植物活力，这彻底改变了生态修复工作。此处引导非限制性定语从句，先行词为“Ecologists could literally sniff out the health of an ecosystem, sensing soil conditions and plant vitality”这件事，故应用which引导，故填which。", "source": "徐汇区", "batch": "2026年高考一模", "id": 4}, {"q": "A particularly remarkable example is Scottish writer William Sharp, ________ came to see his pen name Fiona Macleod as a “demonstration of a different, female side of his nature.”", "answer": "who", "explain": "考查定语从句。句意：一个尤为显著的例子是苏格兰作家威廉・夏普，他将自己的笔名菲奥娜・麦克劳德视为“自己天性中不同的女性一面的展现”。空处引导非限制性定语从句，先行词是William Sharp，指人，关系词在从句中作主语，应用关系代词who来引导。故填who。", "source": "浦东新区", "batch": "2026年高考一模", "id": 5}, {"q": "He asked his third prince, Yinzhi, to establish a museum of mathematics ________ talented scholars would engage in research and observation of mathematical laws and the universe.", "answer": "where", "explain": "考查定语从句。句意：他命三子胤祉建立一座算学馆，让才华出众的学者们可以在馆内研究和观测数学规律与宇宙。此处为关系词引导的定语从句，先行词为a museum of mathematics，表地点，在从句中作地点状语，用关系副词where。故填where。", "source": "奉贤区", "batch": "2026年高考一模", "id": 6}, {"q": "Their favorite example is Plato, who complained that writing, ________ functions cover storing facts and arguments on paper, would weaken pupils’ ability to remember them.", "answer": "whose", "explain": "考查定语从句。句意：他们最喜欢举的例子是柏拉图，他抱怨说，书写这种活动（其功能包括将事实和论点记录在纸上）会削弱学生记忆这些内容的能力。定语从句先行词为writing，从句中functions前缺定语，表 “书写的功能”，故用关系代词whose引导定语从句。故填whose。", "source": "松江区", "batch": "2026年高考一模", "id": 7}, {"q": "Much more likely is that the bin is only the departure point on a long journey to the other side of the world, ________ that bottle will be washed, dried, sorted by material, and turned into packaging material. Consider that a victory.", "answer": "where", "explain": "考查定语从句引导词。句意：更有可能的是，这个垃圾桶只是通往世界另一端漫长旅程的起点，在那里，瓶子将被清洗、干燥、按材料分类，然后变成包装材料。此处引导非限制性定语从句，先行词是the other side of the world，在从句中作地点状语，应用关系副词where引导。故填where。", "source": "青浦区", "batch": "2026年高考一模", "id": 8}, {"q": "Only six of the 21 competing robots, all of ______ had to be bipedal rather than on wheels, successfully completed the course. The best of the bunch was a humanoid called Tiangong Ultra.", "answer": "which", "explain": "考查定语从句。句意：在21个参赛机器人中，只有6个成功完成了比赛，所有这些机器人都必须是两足行走的，而不是轮式的。空处引导非限制性定语从句，修饰先行词six of the 21 competing robots，先行词指物，关系词在从句中作介词of的宾语，应用关系代词which引导从句。故填which。", "source": "崇明区", "batch": "2026年高考一模", "id": 9}, {"q": "A specific study led by Benjamin Cheung investigated these cultural differences, ________ researchers compared 295 university students from Canada and Japan.", "answer": "where", "explain": "考查定语从句。句意：本杰明·张（Benjamin Cheung）领导的一项具体研究调查了这些文化差异，研究人员在该研究中对比了295名来自加拿大和日本的大学生。此处引导非限制性定语从句，先行词为A specific study（一项具体研究），关系词在从句中作地点状语（“在这项研究中”），应用关系副词where。故填where。", "source": "嘉定区", "batch": "2026年高考一模", "id": 10}, {"q": "The Center entered its“pet-friendly 2.0 stage”this year, attracting over 2,600 members ________ made 7,000 pet-related purchases.", "answer": "who/that", "explain": "考查定语从句。句意：该中心今年进入“宠物友好2.0阶段”，吸引了2600多名会员，这些会员完成了7000笔宠物相关消费。此处引导定语从句，先行词为over 2,600 members，指人，在从句中作主语，用关系代词who/that。", "source": "金山区", "batch": "2026年高考一模", "id": 11}, {"q": "Putting so much money toward professional photos might feel like a luxury. But family pictures have long been highly treasured objects, ________ value lies less in their material form than in the memories they preserve.", "answer": "whose", "explain": "考查关系代词。句意：但家庭照片一直是非常珍贵的物品，其价值不在于物质形式，而在于它们保存的记忆。先行词objects和value是所属关系，此处引导非限制性定语从句，在从句中作定语，应用关系代词whose。故填whose。", "source": "闵行区", "batch": "2026年高考一模", "id": 12}, {"q": "He eventually got the bear out through the front door by screaming, ________ eventually left but not before it ate an entire bag of marshmallows (棉花糖).", "answer": "which", "explain": "考查定语从句。句意：他最终通过大喊大叫把熊从前门赶了出去，这只熊最终离开了，但在此之前吃掉了一整袋棉花糖。此处引导非限制性定语从句，先行词是the bear，指物，在从句中作主语，用关系代词which。故填which。", "source": "静安区", "batch": "2026年高考一模", "id": 13}, {"q": "Ms Malhotra says she usually prefers to stay calm in such situations,but there have been instances ________ she’s had to be firmer.", "answer": "when", "explain": "考查定语从句。句意：Malhotra表示，在这种情况下，她通常更愿意保持冷静，但也有过不得不更加坚定的情况。空处为定语从句的关系词；先行词“instances”在定语从句中担当时间状语，用关系副词“when”引导。故填when。", "source": "黄浦区", "batch": "2026年高考一模", "id": 14}, {"q": "We arrived in Shanghai sleepy and excited at 5: 30 a.m. Despite the early start, the air was already hot and soupy, ________ my son used as an excuse to head straight for a convenience store and buy one of the many drinks he’d remembered from all those years before.", "answer": "which", "explain": "考查定语从句。句意：尽管出发得很早，空气已经又热又闷，我儿子以此为借口径直走向一家便利店，买了他多年前记得的众多饮品中的一款。此处引导非限制性定语从句，指代上文“the air was already hot and soupy”，且关系词在从句中作used的宾语，应用关系代词which。故填which。", "source": "普陀区", "batch": "2026年高考一模", "id": 15}, {"q": "And perhaps that’s what’s happening to business people as well. My concern as a marketer is that real business people _________ could gain a lot from social media are avoiding the label “influencer” so much that they are hiding entirely.", "answer": "who/that", "explain": "考查定语从句。句意：作为一名营销人员，我担心的是，那些本可以从社交媒体中获益良多的真正的商务人士，因为太过于回避 “网红” 这个标签，以至于完全隐藏起来了。空处引导定语从句，先行词是 “real business people”，指人，在从句中作主语，所以应用关系代词 who/that 引导。", "source": "浦东新区", "batch": "2025年高考一模", "id": 16}, {"q": "I was growing in this creative environment, inspired by the talented young people________ careers I was helping to further. Now, I realize that there are jobs that will keep you happy, energetic, and inspired.", "answer": "whose", "explain": "考查定语从句。句意：在这个充满创意的环境中，我在成长，受到那些有才华的年轻人的激励，我正在帮助他们进一步发展事业。空处引导定语从句，先行词是 “young people”，在从句中作定语，修饰 “careers”，应用关系代词 whose引导，故填 whose。", "source": "闵行区", "batch": "2025年高考一模", "id": 17}, {"q": "Though the more famous sections of the Great Wall are constructed from stones or bricks, other parts were built using packed soil. Yet, the same packed soils can also host biocrusts,_____ cover about 12%of the Earth's land surface, particularly in dry regions like northern China.", "answer": "which", "explain": "考查定语从句。句意：然而，同样的夯土也可以滋生生物结皮，它们覆盖了地球陆地表面约 12% 的面积，特别是在中国北方等干旱地区。先行词是 “biocrusts”，关系代词 which 引导非限定性定语从句，在从句中作主语，指代先行词，故填 which。", "source": "普陀区", "batch": "2025年高考一模", "id": 18}, {"q": "The lack of knowledge about how to preserve food made it difficult to store enough to eat later. Today, there are many preservation techniques, some of ________ date back thousands of years.", "answer": "which", "explain": "考查定语从句。句意：今天，有许多保存技术，其中一些可以追溯到几千年前。“介词+关系代词”结构的非限制性定语从句，修饰先行词techniques，作介词of的宾语，指物，应用关系代词which。故填which。", "source": "嘉定区", "batch": "2025年高考一模", "id": 19}, {"q": "Despite the huge numbers of people who care about the environment and love clothes, there is a basic conflict about being green and being fashionable. This is because the fashion industry depends on a constant stream of ever-changing trends, ________ means you have to keep consuming.", "answer": "which", "explain": "考查定语从句。句意：这是因为时尚产业依赖于不断变化的潮流，这意味着你必须不断消费。空处引导非限制性定语从句，先行词是前句提到的事，在从句中作主语，用which引导。故填which。", "source": "虹口区", "batch": "2025年高考一模", "id": 20}, {"q": "To begin with, you don’t need much space. A roof or any other outdoor area that receives direct sunlight will work. In fact, a sunny, indoor kitchen windowsill(窗沿) is perfect for a few small plants, ________ gives you easy access to herbs and vegetables as you prepare meals. The key is to choose a spot that receives a good deal of sunlight.", "answer": "which", "explain": "考查定语从句关系词。句意：事实上，一个阳光充足的室内厨房窗台非常适合种植一些小植物，它可以让你在准备食物时轻松获取草药和蔬菜。空格后面的句子“gives you easy access to herbs and vegetables as you prepare meals”是非限制性定语从句，先行词是前文的整个句子，因此使用关系代词which。故填which。", "source": "长宁区", "batch": "2025年高考一模", "id": 21}, {"q": "The 2024 Nobel Prize in physics has been awarded to John Hopfield and Geoffrey Hinton. They are known for their fundamental discoveries in machine learning, ______ paved the way for how artificial intelligence is used today.", "answer": "which", "explain": "考查定语从句。句意：他们因在机器学习领域的根本性发现而闻名，这为今天人工智能的使用奠定了基础。根据空前are和空后paved可知，空处为关系代词，引导非限制性定语从句，先行词为their fundamental discoveries，指物，在从句中作主语，故用关系代词which引导。故填which。", "source": "徐汇区", "batch": "2025年高考一模", "id": 22}, {"q": "Streit had heard a radio story about the founder of the first silent book club, with ______ contact was immediately established. Inspired by the founder’s vision, Streit decided to initiate his own chapter of the club.", "answer": "whom", "explain": "考查定语从句。句意：斯特雷特在广播中听到了第一个默读俱乐部创始人的故事，并立即与他建立了联系。空处是“介词+关系代词”引导的非限制性定语从句，先行词是the founder，在从句中作介词宾语，指人，用宾格whom引导。故填whom。", "source": "杨浦区", "batch": "2025年高考一模", "id": 23}, {"q": "One woman got blisters (泡) on her back after putting a few drops of sweet orange oil in her bath water. Another applied an oil mixture behind the ears, ________ seemed to cause burning.", "answer": "which", "explain": "考查定语从句。句意：另一个人在耳朵后面涂了一种油混合物，这似乎引起了灼伤。空格处引导非限制性定语从句，对先行词an oil mixture进行限定说明，从句中缺少主语，所以应该用关系代词which代替先行词在从句中作主语。故填which。", "source": "静安区", "batch": "2025年高考一模", "id": 24}, {"q": "The basic ingredients are flour, baking powder or soda, and salt, ______ are mixed together into a dough ball using water, milk or buttermilk.", "answer": "which", "explain": "考查定语从句。句意：最基本的配料是面粉、发酵粉或苏打粉和盐，用水、牛奶或酪乳混合成一个面团球。空处引导非限制性定语从句，对前面提到的各种配料作补充说明，先行词指物，在从句中作主语，应用关系代词which作引导词。故填which。", "source": "金山区", "batch": "2025年高考一模", "id": 25}, {"q": "Essentially, if your mood improves, so does your work. To some extent, then, you may be best off playing music ______ makes you happy.", "answer": "that/which", "explain": "考查定语从句。句意：那么在某种程度上，你最好播放能让你快乐的音乐。空处引导定语从句，指代先行词music，指物，且空处在从句中作主语，所以应用that或which引导。故填that/which。", "source": "奉贤区", "batch": "2025年高考一模", "id": 26}, {"q": "Alongside more genuinely laugh-out-loud moments than in most high-time comedies, it contains more serious elements too, such as brief introductions of parenting situations______ will be painfully familiar to any guardians or caregivers, as well as inferences to fateful life events like death and marriage.", "answer": "which或that", "explain": "考查定语从句。句意：与大多数高收视率喜剧相比，这部动画片中真正让人捧腹大笑的时刻更多，同时它也包含了更严肃的元素，如简要介绍对任何监护人或看护者来说都痛苦且熟悉的育儿情境，以及对死亡和婚姻等决定性人生事件的暗示。空处为定语从句的关系词；先行词为“brief introductions of parenting situations”，在定语从句中担当主语，用关系代词which或that引导。", "source": "黄浦区", "batch": "2025年高考一模", "id": 27}, {"q": "Through hard work, he rose to become the club’s chairman and has had the honor of leading his team to wins at several martial arts championships, including the 2022 All-Africa University Games, ________ they emerged as the second-best overall team.", "answer": "where", "explain": "考查定语从句。句意：通过努力，他升任俱乐部主席，并有幸带领他的团队在几次武术锦标赛中获胜，包括2022年全非洲大学生运动会，在那里他们成为第二好的整体团队。空处引导非限制性定语从句，指代先行词the 2022 All-Africa University Games，且在从句中作地点状语，所以用where引导。故填where。", "source": "松江区", "batch": "2025年高考一模", "id": 28}, {"q": "Department of Agriculture, “before allowing a pesticide to be used on a food product, the Environmental Protection Agency sets limits on how much of the pesticide may be used on food during growing, processing, and storage, and how much can remain on the food ______ reaches the consumer.”", "answer": "that/which", "explain": "考查定语从句。句意：在允许一种农药用于食品之前，美国环境保护署会对农药在食品生长、加工和储存过程中的使用量以及到达消费者手中时食品上可以残留的量设定限制。此处引导定语从句，先行词是 “the food”，在从句中作主语，应用关系代词“that/which”引导。", "source": "青浦区", "batch": "2025年高考一模", "id": 29}, {"q": "“There is an interest, especially among the countries _____ are producing raw polymer (聚合物), but as I keep telling them, this is not an anti-plastic agreement,” Andersen told the reporters, noting there would still be a need for plastics in vehicles and medical equipment.", "answer": "that/which", "explain": "考查定语从句。句意：“那些生产原始聚合物的国家对此很感兴趣，但正如我一直告诉他们的那样，这不是一项反塑料协议，” 安徒生告诉记者，同时指出在汽车和医疗设备中仍需要塑料。此处引导定语从句，先行词是 “the countries”，在从句中作主语，应用关系代词“that/which”引导。", "source": "崇明区", "batch": "2025年高考一模", "id": 30}, {"q": "That's quite an understatement to describe a career _____ requires you to keep a cool head while attacking a fire. But Telfer says that flames and nerves can be conquered in the same way: continuous physical and mental training.", "answer": "that", "explain": "考查定语从句。句意：用这句话来描述一份要求你在灭火时保持冷静头脑的职业，实在是轻描淡写了。此处引导定语从句，先行词是 “a career”，在从句中作主语，应用关系代词“that”引导，故填“that”。", "source": "宝山区", "batch": "2025年高考一模", "id": 31}, {"q": "The heaviest burdens of expectation fell on the group’s main song writers, John Lennon and Paul McCartney, both of ________ leaned on their wives. As John and Yoko Ono pursued political campaigns, Paul and Linda McCartney retreated to their ruinous Scottish farm.", "answer": "whom", "explain": "考查定语从句。句意：最沉重的期待压力落在了乐队的主要词曲作者约翰・列侬和保罗・麦卡特尼身上，他们两人都依靠着自己的妻子。这里考查非限制性定语从句，先行词为人，介词后应用关系代词whom引导。故填whom。", "source": "2026年上海市华东师范大学第二附属中学高三3月英语试题", "batch": "名校名卷汇编", "id": 32}, {"q": "Ten of these high-tech devices first appeared for a trial during Spring Festival and quickly became popular among tourists of all age groups,______ went beyond expectations.", "answer": "which", "explain": "考查定语从句。句意：十台这样的高科技设备在春节期间首次试用，迅速受到各年龄段游客的欢迎，这超出了预期。此处为关系词引导的非限制性定语从句，先行词为前面整个句子，指的是事情，关系词在从句中作主语，用关系代词which引导。故填which。", "source": "2026年上海市南洋中学高三下学期3月考英语试题", "batch": "名校名卷汇编", "id": 33}, {"q": "A team of Thai and international divers guided the boys and their coach out through a nearly four-kilometer-long passageway. Two divers helped each one make his way through dark, narrow passages, some of ______ are filled with dirty water.", "answer": "that或which", "explain": "句意：两名潜水员帮助每个人穿过黑暗、狭窄的通道，其中一些通道充满了脏水。定语从句：先行词是 passages（通道），指物，且从句前有逗号，为非限制性定语从句。关系代词：在非限制性定语从句中，指代事物并作介词 of 的宾语时，用 which。结构：some of which 意为“其中一些（通道）”。 Musical theatre has been the mainstay of Broadway since the 19th century, but the business of running grand musicals ______ require huge audiences to pay high ticket prices is quite a gamble. 句意：音乐剧自19世纪以来就是百老汇的支柱，但制作需要大量观众支付高价门票的大型音乐剧，这门生意相当冒险。此处引导定语从句，先行词是grand musicals（大型音乐剧），指物，且从句中缺少主语。", "source": "2026年上海市杨浦区复旦大学附属中学高三下学期开学英语试题", "batch": "名校名卷汇编", "id": 34}, {"q": "To find out whether blood protein levels could be used to predict cognitive decline, the researchers collected data on 39 people with disease-causing variants when they returned to the clinic an average of two years after their last visit, and found that people ________ blood protein levels had previously risen rapidly were most likely to show signs of brain atrophy and diminished cognitive abilities when they revisited the clinic.", "answer": "whose", "explain": "考查定语从句。句意：为了确定血液中的蛋白质水平是否可以用来预测认知能力下降，研究人员收集了39名携带致病基因变异者的数据，这些人在上次访问后，平均两年的时间返回诊所，结果发现，那些先前血液蛋白质水平迅速上升的人在再次就诊时最有可能显示出脑萎缩和认知能力下降的迹象。空处引导定语从句修饰people，且与从句中的blood protein levels构成所属关系，此时应用whose引导定语从句，whose blood protein levels为定语从句中的主语。故填whose。", "source": "上海复旦大学附属中学2026届高三下三月第二次阶段检测", "batch": "名校名卷汇编", "id": 35}, {"q": "By examining air movements, the researchers learned that these insects probably came from the Netherlands, Germany, and Denmark, and that they might have continued their journey to Scotland or Norway. The places ________ they were heading also had the same plant types as the pollen they carried.", "answer": "where", "explain": "考查定语从句。句意：它们要去的地方也有和它们携带的花粉相同的植物类型。空处引导定语从句，先行词是places，关系词代替先行词在从句中作地点状语，用关系副词where，故填where。", "source": "2026学年上海市闵行区七宝中学高三上学期期中英语试卷（解析版）", "batch": "名校名卷汇编", "id": 36}, {"q": "After drawing up 320 different versions for the new spire, they were finally ready to build one. “It will be exactly the same cathedral ________ it was by Viollet-le-Duc,” said Georgelin, the man in charge of the spire project.", "answer": "whose;that", "explain": "考查定语从句。句意：它将与Viollet-le-Duc时期的大教堂一模一样。空格处引导的是限制性定语从句，空前有the same，因此空格处用as/that引导定语从句，构成the same as/that...固定搭配，意为“与……一样”，故填as/that。 The central part of the spire is now complete, and it will be taken to Paris in August to be placed on the roof of the cathedral. Work on the rest of the spire continues and it will follow, piece by piece, until the end of this year, ________ it’s expected to soar once again up into the Paris skyline. 考查定语从句。句意：塔尖的其余部分仍在继续，并将一块一块地跟进，直到今年年底，预计它将再次高耸入巴黎的天际线。空格处引导是非限制性定语从句，从句中不缺主语或宾语，先行词the end of this year是时间，因此用关系副词when引导定语从句，故填when。 2025-2026学年上海市复旦大学附属中学高三上学期9月第二次测试英语试题 Sotheby’s said the painting provides a portal into Montmartre at the end of the 19th century, ________ the obsolete mills became tourist attractions and leisure places where Parisians would meet to drink, dance and relax. 考查定语从句关系副词。句意：苏富比表示，这幅画为人们打开了一扇通往 19 世纪末蒙马特的大门 —— 当时，废弃的风车变成了旅游景点和休闲场所，巴黎人会在这里相聚、饮酒、跳舞和放松。此处为定语从句，先行词是“the end of the 19th century”，表示时间，且从句中缺少时间状语，需用关系副词when引导。 2025-2026学年上海市复旦大学附属中学高三上学期9月月考英语试题 An escape room, on the other hand, is a game ________ several people are locked in a room with a variety of puzzles. They must solve the puzzles together to leave the room before time runs out. In a cooperative game like this, players don’t compete with each other. Instead, players work together to achieve the objective. 考查定语从句。句意：另一方面，密室逃脱是一种将几个人锁在一个房间里、并设置各种谜题供其解开的游戏。此空引导限制性定语从句，先行词是a game，关系词指代先行词在从句中作地点状语，用关系副词where引导该定语从句。故填where。 2025-2026学年上海市复旦大学附属中学高三上学期11月期中英语试题 If using the screen of a smartphone while driving is distracting,and therefore dangerous, then doing likewise with your car’s, ______ use requires similar visual attention, is probably risky too. “If using the screen of a smartphone while driving is distracting, and therefore dangerous, then doing likewise with your car’s, ______ use requires similar visual attention, is probably risky too.”，这里是一个非限制性定语从句，先行词是“car’s (screen)”，关系词在从句中作定语，修饰“use”，表示“汽车屏幕的使用”，所以用whose。句意：如果开车时使用智能手机屏幕会分散注意力，因此很危险，那么使用汽车的屏幕（其使用需要类似的视觉注意力）可能也有风险。 2025-2026学年上海市华东师范大学第二附属中学高三上学期期中考试英语试题（解析版） After a bout of (一阵) consolidation in the past decade the industry is dominated by four firms ________ financial discipline is tight. And the return on capital is similar to ________ seen in Silicon Valley. 【详解1】 考查定语从句。句意：经过过去十年的一轮整合后，该行业由四家财务纪律严格的公司主导。此处引导限定性定语从句，先行词为four firms，关系词在从句中作定语（修饰financial discipline），表示“四家公司的”，应用关系代词whose。故填whose。 【详解2】 考查代词。句意：其资本回报率与硅谷所见的（资本回报率）相当。指代前文出现的不可数名词“return on capital”，为避免重复，应用指示代词that。故填that。", "source": "上海市大同中学2025-2026学年高三上学期10月月考英语试题", "batch": "名校名卷汇编", "id": 37}, {"q": "At the gates of cloud the Hours stood as guardians; within the walls rose the palaces of the gods. And on the topmost peak was the great hall __________ the members of the Olympic Council gathered for deliberation or for feasting.", "answer": "where", "explain": "考查定语从句。句意：在最高峰上有一座大殿，奥林匹斯议会的成员们会在此聚集商议事务或设宴聚餐。分析句子结构可知，空处引导定语从句，先行词是the great hall，表地点，关系词在从句中作地点状语，所以用关系副词where引导。故填where。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期期中英语试题", "batch": "名校名卷汇编", "id": 38}, {"q": "1.The moment ________ he spoke out his own idea has always stuck in my mind. A. when\tB. that\tC. which\tD. what", "answer": "where", "explain": "考查定语从句关系词。句意：他说出自己想法的那一刻，一直萦绕在我的脑海里。分析句子结构可知，“ ________ he spoke out his own idea”为定语从句，先行词是the moment，在定语从句中充当时间状语(即“在那一刻”)， 因此应使用关系副词when来引导。故选A项。 2.Caring for young children is tiring at any age; for older adults, after a full day or more, the next day is often a write-off too, ________ seems to be something almost no policy takes into account. 考查定语从句。句意：照顾年幼的孩子在任何年龄都是很累人的；对于老年人来说，在忙碌了一整天或更长时间后，第二天通常也会被荒废掉，这似乎是几乎没有政策考虑到的。本空引导非限制性定语从句，修饰前面整个句子，关系词在从句中作主语，应用关系代词which引导。故填which。 3.In February, the company had to bring in a $7 million private investment ______ was intended to meet production needs for 2019. “We were not ready for what seems to have been the tipping point (引爆点) being met,” says Jaime Athos, the CEO. “Honestly, we didn’t expect it to happen so fast.” 考查定语从句引导词。句意：今年2月，该公司引入了700万美元的私人投资，这笔投资旨在满足2019年的生产需求。此处引导定语从句，先行词是investment指物，在从句中作主语，应用关系代词that/which。 4.In a flash I knew with absolute certainty that he had the ring; he had been standing at the only spot ________ ________it could have rolled. I reached him as his hand touched the door handle. “Excuse me, please.” I said. 考查定语从句。句意：他刚才站的位置，正是戒指唯一可能滚到的地方。此空考查定语从句，先行词是spot，而定语从句的核心动词是roll，这是一个不及物动词，后接地点时需要搭配介词to，构成roll to + 地点（滚到某地）的结构，先行词指物时关系代词用which，因此此处用to which引导从句。故填to which。 5.I chance upon a work that arrests me, and that is also new to me. I get lost in all the thoughts ______ arise as I spend time with the exhibits. They make me reflect on life. 考查定语从句。句意：我沉浸在欣赏展品时产生的各种思绪中。此处引导定语从句，先行词thoughts在从句中作主语，且先行词前有all修饰，此处应用关系代词that。故填that。 6.Government agencies are rarely known for the quality of their TikTok output. An exception is Amtrak, America’s national railway firm, ________ posts can get hundreds of thousands of views. 考查定语从句。句意：美国国家铁路公司Amtrak就是一个例外，它的帖子能获得数十万的浏览量。空处引导非限制性定语从句，修饰先行词Amtrak，且在从句中作定语，所以空处需用关系代词whose。故填whose。 7.According to them, the fight lasted for days and created a hurricane around Bear Lake. Finally, Bill tossed that monster over his shoulder and it flew so far that it went clear around the world before splashing down in Loch Ness, ________ it’s said to live to this very day. 考查定语从句。句意：最后，Bill将那只怪物一个过肩摔，它飞得如此之远，以至于它绕着地球飞了一圈，然后溅落在尼斯湖，据说它至今还生活在那里。分析句子结构可知，空处需用关系词引导非限制性定语从句，先行词是Loch Ness，指地点，关系词在定语从句中作地点状语，所以空处需用关系副词where引导定语从句。故填where。 更多优质原创资料请关注公众号：微信号：", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习英语试题", "batch": "名校名卷汇编", "id": 39}, {"q": "Musical theatre has been the mainstay of Broadway since the 19th century, but the business of running grand musicals ______ require huge audiences to pay high ticket prices is quite a gamble.", "answer": "that或which", "explain": "句意：音乐剧自19世纪以来就是百老汇的支柱，但制作需要大量观众支付高价门票的大型音乐剧，这门生意相当冒险。此处引导定语从句，先行词是grand musicals（大型音乐剧），指物，且从句中缺少主语。", "source": "2026年上海市杨浦区复旦大学附属中学高三下学期开学英语试题", "batch": "名校名卷汇编", "id": 40}, {"q": "The central part of the spire is now complete, and it will be taken to Paris in August to be placed on the roof of the cathedral. Work on the rest of the spire continues and it will follow, piece by piece, until the end of this year, ________ it’s expected to soar once again up into the Paris skyline.", "answer": "when", "explain": "考查定语从句。句意：塔尖的其余部分仍在继续，并将一块一块地跟进，直到今年年底，预计它将再次高耸入巴黎的天际线。空格处引导是非限制性定语从句，从句中不缺主语或宾语，先行词the end of this year是时间，因此用关系副词when引导定语从句，故填when。", "source": "上海市大同中学2025-2026学年高三上学期10月月考英语试题", "batch": "名校名卷汇编", "id": 41}, {"q": "Sotheby’s said the painting provides a portal into Montmartre at the end of the 19th century, ________ the obsolete mills became tourist attractions and leisure places where Parisians would meet to drink, dance and relax.", "answer": "when", "explain": "考查定语从句关系副词。句意：苏富比表示，这幅画为人们打开了一扇通往 19 世纪末蒙马特的大门 —— 当时，废弃的风车变成了旅游景点和休闲场所，巴黎人会在这里相聚、饮酒、跳舞和放松。此处为定语从句，先行词是“the end of the 19th century”，表示时间，且从句中缺少时间状语，需用关系副词when引导。", "source": "2025-2026学年上海市复旦大学附属中学高三上学期9月第二次测试英语试题", "batch": "名校名卷汇编", "id": 42}, {"q": "An escape room, on the other hand, is a game ________ several people are locked in a room with a variety of puzzles. They must solve the puzzles together to leave the room before time runs out. In a cooperative game like this, players don’t compete with each other. Instead, players work together to achieve the objective.", "answer": "where", "explain": "考查定语从句。句意：另一方面，密室逃脱是一种将几个人锁在一个房间里、并设置各种谜题供其解开的游戏。此空引导限制性定语从句，先行词是a game，关系词指代先行词在从句中作地点状语，用关系副词where引导该定语从句。故填where。", "source": "2025-2026学年上海市复旦大学附属中学高三上学期9月月考英语试题", "batch": "名校名卷汇编", "id": 43}, {"q": "If using the screen of a smartphone while driving is distracting,and therefore dangerous, then doing likewise with your car’s, ______ use requires similar visual attention, is probably risky too.", "answer": "whose", "explain": "“If using the screen of a smartphone while driving is distracting, and therefore dangerous, then doing likewise with your car’s, ______ use requires similar visual attention, is probably risky too.”，这里是一个非限制性定语从句，先行词是“car’s (screen)”，关系词在从句中作定语，修饰“use”，表示“汽车屏幕的使用”，所以用whose。句意：如果开车时使用智能手机屏幕会分散注意力，因此很危险，那么使用汽车的屏幕（其使用需要类似的视觉注意力）可能也有风险。", "source": "2025-2026学年上海市复旦大学附属中学高三上学期11月期中英语试题", "batch": "名校名卷汇编", "id": 44}, {"q": "After a bout of (一阵) consolidation in the past decade the industry is dominated by four firms ________ financial discipline is tight. And the return on capital is similar to ________ seen in Silicon Valley.", "answer": "whose;that", "explain": "", "source": "2025-2026学年上海市复旦大学附属中学高三上学期11月期中英语试题", "batch": "名校名卷汇编", "id": 45}, {"q": "Caring for young children is tiring at any age; for older adults, after a full day or more, the next day is often a write-off too, ________ seems to be something almost no policy takes into account.", "answer": "which", "explain": "考查定语从句。句意：照顾年幼的孩子在任何年龄都是很累人的；对于老年人来说，在忙碌了一整天或更长时间后，第二天通常也会被荒废掉，这似乎是几乎没有政策考虑到的。本空引导非限制性定语从句，修饰前面整个句子，关系词在从句中作主语，应用关系代词which引导。故填which。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习英语试题", "batch": "名校名卷汇编", "id": 46}, {"q": "In February, the company had to bring in a $7 million private investment ______ was intended to meet production needs for 2019. “We were not ready for what seems to have been the tipping point (引爆点) being met,” says Jaime Athos, the CEO. “Honestly, we didn’t expect it to happen so fast.”", "answer": "that/which", "explain": "考查定语从句引导词。句意：今年2月，该公司引入了700万美元的私人投资，这笔投资旨在满足2019年的生产需求。此处引导定语从句，先行词是investment指物，在从句中作主语，应用关系代词that/which。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习英语试题", "batch": "名校名卷汇编", "id": 47}], "4": [{"q": "________ it will introduce next is tightened security in the gallery. On 27 September, three protesters from an environmental campaign group called Just Stop Oil threw tomato soup at two paintings by Vincent van Gogh.", "answer": "What", "explain": "考查名词性从句。句意：它接下来将引入的是加强画廊的安全。空处引导主语从句，从句缺少will introduce的宾语，用连接代词what引导，句首单词，首字母大写。故填What。", "source": "长宁区", "batch": "2026年高考一模", "id": 1}, {"q": "But deep down, the original fear is ________ gave fairy tales their power. Without fear, their lessons lose depth. Shaped by facing imaginary monsters, readers learn how to face real-life challenges.", "answer": "what", "explain": "考查表语从句。句意：但在内心深处，最初的恐惧赋予了童话力量。空处引导表语从句，从句中缺少主语，用what引导。故填what。", "source": "虹口区", "batch": "2026年高考一模", "id": 2}, {"q": "Ultimately, ________ this book questions is whether it’s important to know and understand the identities of authors behind their pen names. According to Scott’s work, although it’s important in some cases, it is a fascinating exercise to uncover the lives and motivations of these authors.", "answer": "what", "explain": "考查主语从句。句意：归根结底，这本书探讨的核心问题是：了解并知晓笔名背后作者的真实身份是否重要。空处引导主语从句，从句中questions缺少宾语，指代“这本书质疑的内容”，应用连接代词what来引导。故填what。", "source": "浦东新区", "batch": "2026年高考一模", "id": 3}, {"q": "A team of researchers studied different rhino protection methods used in Greater Kruger National Park, South Africa, between 2017 and 2023. About 25% of Africa’s rhino population lives in Greater Kruger, and the researchers wanted to find out ________ methods worked well.", "answer": "which", "explain": "考查宾语从句。句意：非洲大约25%的犀牛生活在大克鲁格，研究人员想找出哪些方法效果好。根据本段首句“A team of researchers studied different rhino protection methods”可知，保护犀牛的方法已有范围限定，此空引导宾语从句，在从句中作定语，意为“哪些”，应用which。故填which。", "source": "杨浦区", "batch": "2026年高考一模", "id": 4}, {"q": "On one visit to southern China, he used a spirit level to measure the water, and found a mistake in ________ his ministers were controlling the water in the Hongze lake.", "answer": "how", "explain": "考查宾语从句连接词。句意：在一次南巡时，他用水平仪测量水位，发现大臣们治理洪泽湖的方法存在一处错误。此处引导宾语从句，作介词in的宾语，从句中缺少方式状语，表“如何、怎样”，用连接副词how。故填how。", "source": "奉贤区", "batch": "2026年高考一模", "id": 5}, {"q": "These tech-enthusiasts do not always know ________ is in the best interests of the students. Actually, banning smartphones from classrooms improves their academic performance.", "answer": "what", "explain": "考查宾语从句。句意：这些热衷于科技的人往往并不清楚哪些做法最有利于学生。宾语从句中缺主语，且指代“对学生最有利的事物”，故用what。故填what。", "source": "松江区", "batch": "2026年高考一模", "id": 6}, {"q": "Much more likely is ________ the bin is only the departure point on a long journey to the other side of the world, where that bottle will be washed, dried, sorted by material, and turned into packaging material.", "answer": "that", "explain": "考查表语从句。句意：更有可能的是，这个垃圾桶只是通往世界另一端漫长旅程的起点。此处引导表语从句，从句结构完整、语义明确，应用that引导，that在表语从句中不充当句子成分，只起连接作用。故填that。", "source": "青浦区", "batch": "2026年高考一模", "id": 7}, {"q": "Running is for everyone — and everything, as it now happens.That’s ______ China has just staged a half marathon where humans weren’t the only participants.", "answer": "because", "explain": "考查连词。句意：这是因为中国刚刚举办了一场半程马拉松比赛，人类并不是唯一的参赛者。前文提出观点，后文解释该现象的原因，空处应用连词because引导表语从句，构成固定句型“That’s because...”，意为“这是因为……”。故填because。", "source": "崇明区", "batch": "2026年高考一模", "id": 8}, {"q": "Why do Japanese individuals seem healthier though they sleep less? In Japan, people tend to believe that sleep is a luxury, not a necessity, and ________ sacrificing sleep is vital for success.", "answer": "that", "explain": "考查宾语从句。句意：在日本，人们倾向于认为睡眠是一种奢侈品，而非必需品，并且牺牲睡眠对成功至关重要。此空引导名词性从句，与前文“that sleep is a luxury, not a necessity”并列，作believe的宾语，从句结构完整、语义明确，应用连接词that引导（并列宾语从句中，第二个that不可省略）。故填that。", "source": "嘉定区", "batch": "2026年高考一模", "id": 9}, {"q": "This emotional bond has driven ________ is known as the “pet economy”, leading to new consumption trends and business opportunities across various industries.", "answer": "what", "explain": "考查宾语从句。句意：在中国，越来越多的宠物主人，尤其是90后和00后，如今将宠物视为家庭成员，这种情感纽带推动了所谓的“宠物经济”。此处引导宾语从句，作driven的宾语，从句中缺少主语，指“……的事物”，用连接代词what。故填what。", "source": "金山区", "batch": "2026年高考一模", "id": 10}, {"q": "Putting so much money toward professional photos might feel like a luxury. But family pictures have long been highly treasured objects, whose value lies less in their material form than in the memories they preserve. Today, that age-old instinct of preservation is facing new pressures from social media for people to measure up to ________ they are exposed to online.", "answer": "what", "explain": "考查宾语从句。句意：如今，社交媒体带来的新压力要求人们达到他们在网上看到的标准。此处引导宾语从句，从句中they are exposed to缺少宾语，指物，应用what。故填what。", "source": "闵行区", "batch": "2026年高考一模", "id": 11}, {"q": "________ happened next was even more alarming for Priest. The bear came back the next day and tore a screen trying to get inside.", "answer": "What", "explain": "考查主语从句。句意：接下来发生的事情对普里斯特来说更令人担忧。此处引导主语从句，从句中缺少主语，且指代“发生的事情”，用连接代词what，句首单词首字母大写。故填What。", "source": "静安区", "batch": "2026年高考一模", "id": 12}, {"q": "“But ______ is clear is that feeders aren’t the problem—they’re part of the solution,” says activist Ambika Shukla. ”They are the ones keeping dogs gentle and their presence makes it easier to pick them up and load them into vans.", "answer": "what", "explain": "考查主语从句。句意：“但很明显的是，喂食者不是问题所在，他们是解决方案的一部分”。空处为主语从句的引导词，主语从句中缺少主语，表示物，用what引导。故填what。", "source": "黄浦区", "batch": "2026年高考一模", "id": 13}, {"q": "No longer was I worried about what it meant or ________ others perceived it. I had found my own way to connect with people on a more personal level and make a positive impact.", "answer": "how", "explain": "考查宾语从句。句意：我不再担心它意味着什么或者别人是如何看待它的。空处引导宾语从句，作介词 about 的宾语，且从句中缺少方式状语，意为 “如何”，所以应用 how 引导，故填 how。", "source": "浦东新区", "batch": "2025年高考一模", "id": 14}, {"q": "As our website hits increased and the work shifted to reflect ________ our audiences wanted, I developed a greater understanding of what young people might want to read.", "answer": "what", "explain": "考查宾语从句。句意：随着我们网站的点击量增加，工作也随之转变以反映我们的读者想要的内容，我对年轻人可能想读的东西有了更深入的理解。空处引导宾语从句，作 reflect 的宾语，从句中缺少 wanted 的宾语，指物，应用 what 引导，故填 what。", "source": "闵行区", "batch": "2025年高考一模", "id": 15}, {"q": "Despite its grandeur, ________ remains today is only a part of its former self, due to the wear and damage caused by time and nature.", "answer": "what", "explain": "考查主语从句。句意：尽管长城很雄伟，但由于时间和自然造成的磨损与破坏，如今留存下来的只是它昔日面貌的一部分。“____ remains today” 在句中作主语，是一个主语从句，从句中缺少主语，表示 “…… 的东西”，所以用 what 引导该从句，故填 what。", "source": "普陀区", "batch": "2025年高考一模", "id": 16}, {"q": "The lack of knowledge about ________ to preserve food made it difficult to store enough to eat later. Today, there are many preservation techniques, some of which date back thousands of years.", "answer": "how", "explain": "考查疑问词。句意：由于缺乏保存食物的知识，很难储存足够的食物供以后食用。此处为“疑问词+不定式”结构作宾语，表示“如何”用how。故填how。", "source": "嘉定区", "batch": "2025年高考一模", "id": 17}, {"q": "Firstly, rather than base your choice of clothes on ________ the fashion industry says you should, choose your own look. If you do this, you’ll look a lot more like an individual.", "answer": "whatever/what", "explain": "考查宾语从句。句意：首先，与其根据时尚界的说法选择衣服，不如选择自己的风格。空处引导宾语从句，从句中缺少宾语，可用what引导，也可用whatever（无论什么）引导。故填what或者whatever。", "source": "虹口区", "batch": "2025年高考一模", "id": 18}, {"q": "__________ shows off your green fingers and your creativity is a container garden. It is a great choice for people who love gardening but have no yard space at all.", "answer": "Whatever/What", "explain": "考查主语从句。句意：能展示你的园艺技能和创造力的是一个容器花园。空格处引导主语从句，从句缺少主语，用连接词whatever/what。符合句意。故填Whatever/What。", "source": "长宁区", "batch": "2025年高考一模", "id": 19}, {"q": "He said he left because he wanted to be able to share his concerns about the risks of artificial intelligence without worrying _______it would mean for his employer.", "answer": "what", "explain": "考查宾语从句。句意：他说他离职是因为他想能够分享他对人工智能风险的担忧，而不必担心这会对他的雇主意味着什么。空处引导宾语从句，作worrying的宾语，从句中缺少mean的宾语，指物，需用连接词what。故填what。", "source": "徐汇区", "batch": "2025年高考一模", "id": 20}, {"q": "Across the table from her was Matt Streit, who launched the Minneapolis chapter of ________ has become a global phenomenon.", "answer": "what", "explain": "考查宾语从句。句意：坐在她对面的是马特·斯特雷特，他创立了已经成为全球现象的明尼阿波利斯分会。空处引导宾语从句，从句缺少主语，指事物，用连接代词what引导。故填what。", "source": "杨浦区", "batch": "2025年高考一模", "id": 21}, {"q": "________ the essential oil is so popular on the cosmetics market is not known. Some people credit its appeal to its pleasant smell.", "answer": "Why", "explain": "考查连接副词。句意：为什么这种精油在化妆品市场如此受欢迎还不清楚。空格处引导主语从句，且意义为“为什么”，所以应该用连词副词why引导。故填Why。", "source": "静安区", "batch": "2025年高考一模", "id": 22}, {"q": "________ among the cheap ingredients, was given to them by the U.S. government as daily rations was wheat flour previously unknown to them.", "answer": "What", "explain": "考查主语从句。句意：在美国政府提供给他们的廉价食材中，有一种是他们以前不知道的小麦粉。空处引导名词性从句作主语，主语从句缺少主语，结合“wheat flour”可知，主语指物，应用连接代词what作引导词，句首单词的首字母需大写。故填What。", "source": "金山区", "batch": "2025年高考一模", "id": 23}, {"q": "Various studies have tried to address the question of ______ music in the workplace can be helpful or not. The short answer seems to be yes, but it depends on the job and the music.", "answer": "whether", "explain": "考查宾语从句。句意：各种研究试图解决工作场所的音乐是否有益的问题。空处引导宾语从句，作介词of的宾语。结合从句中的or not可知，这里表示“是否”的含义，应用whether引导，在从句中不充当成分，只起连接作用。故填whether。", "source": "奉贤区", "batch": "2025年高考一模", "id": 24}, {"q": "______ viewers won’t have predicted will be how much this episode draws from Taoist philosophy. It is an ancient Chinese belief system based on trying to exist in harmony with the universe.", "answer": "What", "explain": "考查主语从句。句意：观众无法预料的是，这一集会如此深刻地借鉴道家哲学。空处为主语从句的引导词；主语从句中缺少宾语，用what引导；出现在句首，首字母大写。故填What。", "source": "黄浦区", "batch": "2025年高考一模", "id": 25}, {"q": "But ________ began as an after-school activity has become a lifestyle for the student, who is now the chairman of the university’s Titan Martial Arts club.", "answer": "what", "explain": "考查主语从句。句意：但这项始于课后的活动已经成为了这位学生的一种生活方式，他现在是该大学泰坦武术俱乐部的主席。____began as an after-school activity在句中作主语，且这里指的是功夫，所以应用what引导主语从句，意为“什么，……的事物”。故填what。", "source": "松江区", "batch": "2025年高考一模", "id": 26}, {"q": "Using specific imaging technology to see ______ pesticides affected apples, scientists found distribution of pesticides in the apple skin and flesh layers, confirming that the pesticides pass through the skin layer into the flesh layer.", "answer": "how", "explain": "考查宾语从句。句意：科学家们利用特定的成像技术观察杀虫剂是如何影响苹果的，发现了杀虫剂在苹果皮和果肉层中的分布情况，证实了杀虫剂穿过皮层进入果肉层。此处引导宾语从句，作 “see” 的宾语，且在从句中作方式状语，表示 “如何”，应用 “how” 引导，故填 “how”。", "source": "青浦区", "batch": "2025年高考一模", "id": 27}, {"q": "They especially dispute _____ the deal should center on reducing plastics production or increasing recycling and reuse. Environmentalists and producers hold different opinions on this key point.", "answer": "what", "explain": "考查宾语从句。句意：他们尤其争论该协议的重点应该是减少塑料生产还是增加回收和再利用。此处引导宾语从句，从句中不缺少成分，但表示 “是否” 的含义，应用 “whether” 引导，故填 “whether”。 Andersen said _____ she hopes is that no groups would work to block progress on the agreement, but instead find a way forward that actually takes into account the fact. 考查主语从句。句意：安徒生说，她希望的是，没有任何团体阻碍该协议的进展。此处引导主语从句，从句中缺少宾语，指事物，应用 “what” 引导，故填 “what”。", "source": "崇明区", "batch": "2025年高考一模", "id": 28}, {"q": "\"It is_____ we love the job,\" Telfer says. \"We are constantly learning. We love facing challenges and helping people in need every day.\"", "answer": "why", "explain": "考查表语从句。句意：“这就是我们热爱这份工作的原因，” 特尔弗说，“我们在不断学习。” 此处引导表语从句，在从句中作原因状语，表示 “…… 的原因”，应用 “why” 引导，故填 “why”。", "source": "宝山区", "batch": "2025年高考一模", "id": 29}, {"q": "It’s fascinating because they have a very underdeveloped pre-frontal cortex (前额叶皮质), which is________    we typically credit with producing that type of thinking in humans.", "answer": "what", "explain": "考查表语从句。句意：诺丁汉特伦特大学的资深研究员凯莉・伊吉奇博士说：“这很有趣，因为它们的前额叶皮质非常不发达，而我们通常认为产生人类那种思维方式的正是前额叶皮质。”“is” 后面是表语从句，从句中 “credit...with...” 缺少宾语，“what” 在表语从句中充当宾语，指代 “产生人类那种思维方式的东西”，所以用 “what” 引导表语从句。故填 what。", "source": "徐汇区", "batch": "2025年高考二模", "id": 30}, {"q": "They concluded that expressive writing might be an effective tool to address negative emotions and________ writing about a past failure could improve learning.", "answer": "that", "explain": "考查宾语从句。句意：他们得出结论，表达性写作可能是处理负面情绪的有效工具，并且写下过去的失败可以促进学习。前文“that”引导的第一个宾语从句是“expressive writing might be an effective tool to address negative emotions”，第二个宾语从句，从句结构和句意完整，连接词为that。故填 that。", "source": "浦东新区", "batch": "2025年高考二模", "id": 31}, {"q": "题目：Despite________they endured, they kept pushing forward. Their food was simple but packed with energy: pemmican, a dense mixture of dried meat, animal fat, and berries.", "answer": "what", "explain": "考查连接词。句意：尽管他们忍受了很多，但他们还是继续前进。“Despite 7 they endured” 中，“ 7 they endured” 是一个宾语从句，作 “Despite” 的宾语，从句中缺少宾语，用 “what” 引导，表示 “所…… 的事物”。故填 what。", "source": "嘉定区", "batch": "2025年高考二模", "id": 32}, {"q": "题目：Newsroom provides time for students to apply________they learn in the classroom to hands-on journalism assignments. Over the rest of their day, students conduct interviews and gather information.", "answer": "what", "explain": "考查宾语从句。句意：新闻编辑室为学生提供了将课堂上学到的知识应用到实际新闻工作中的时间。此处是宾语从句，引导词在从句中作learn的宾语，表示“……的东西”，用what引导该从句。故填what。", "source": "闵行区", "batch": "2025年高考二模", "id": 33}, {"q": "What struck me deeply was________English surrounded me once more, a persistent reflection of the familiarity I didn’t realize I’d grown tired of.", "answer": "that", "explain": "考查表语从句。句意：让我深感震惊的是，当英语再次围绕着我时，那种熟悉感是一种持续的反映，而我却没有意识到自己已经对这种熟悉感到厌倦了。空处引导表语从句，从句中不缺少成分且意义完整，所以用 that 引导。故填that。", "source": "虹口区", "batch": "2025年高考二模", "id": 34}, {"q": "People wonder________crunning is as beneficial a fitness activity as jogging or running.", "answer": "whether", "explain": "考查宾语从句。句意：人们想知道爬跑是否和慢跑或跑步一样是有益的健身活动。“crunning is as beneficial a fitness activity as jogging or running”是宾语从句，结合语境，表示“是否”，应用连词whether引导宾语从句。故填whether。", "source": "静安区", "batch": "2025年高考二模", "id": 35}, {"q": "But if the technology can appear suddenly from the strange spaghetti video to________it is now in a year, these limitations probably won't last long.", "answer": "where", "explain": "考查宾语从句。句意：但如果这项技术能在短短一年内从奇特的意大利面视频发展到如今的水平，那么这些限制可能不会持续太久。根据句意和空格前的介词to可知，空格后的部分是名宾语从句，空格处应该填入一个连接词引导从句，且意义为“(在)……的地方；(在)……情况下”，所以，应该用连接副词where。故填where。", "source": "宝山区", "batch": "2025年高考二模", "id": 36}, {"q": "________has a vivid imagination might be convinced of the existence of powerful supervillains (超级反派).", "answer": "Whoever", "explain": "考查主语从句。句意：任何一个想象力丰富的人可能都会相信强大超级反派的存在。空处为主语从句的引导词；主语从句中缺少主语，意为“任何一个……的人”，用whoever引导；出现在句首，首字母大写。故填Whoever。", "source": "杨浦区", "batch": "2025年高考二模", "id": 37}, {"q": "Fans of the animal have expressed________they enjoy watching the pink-cheeked baby actively interact with her mother and other zoo workers.", "answer": "how/that", "explain": "考查宾语从句。句意：这只动物的粉丝们表示，他们非常喜欢看这只脸颊粉嫩的宝宝与她的妈妈和其他动物园工作人员积极互动。空处引导宾语从句，结构完整，意思也完整，所以可以用连接词that引导；也可以用how，表示“他们是多么喜欢看……”，强调喜欢的程度，故填how/that。", "source": "崇明区", "batch": "2025年高考二模", "id": 38}, {"q": "Dr. Kross suggested asking yourself, “Is________I’m doing making me feel better about the problem in front of me?", "answer": "what", "explain": "考查主语从句。句意：情绪研究者克罗斯博士建议问自己：“我正在做的事情是否让我对眼前的问题感觉更好？”“I’m doing”是主语从句，从句中缺少宾语，句子表示“我正在做的事情”，因此用关系代词what引导主语从句，故填what。", "source": "黄浦区", "batch": "2025年高考二模", "id": 39}, {"q": "Part of the 2,334 square kilometer reserve’s commitment to the preservation of the night sky involves careful lighting design, such as ensuring________,if possible, lights are equipped with shades to minimize light pollution.", "answer": "that", "explain": "考查宾语从句。句意：2334平方公里的自然保护区致力于保护夜空，其中包括精心的照明设计，如尽可能确保灯光配备遮光罩，以尽量减少光污染。引导宾语从句，从句不缺少成分或句意，故用that。故填that。", "source": "奉贤区", "batch": "2025年高考二模", "id": 40}, {"q": "According to the professor of the University of Milan, Dr Francesco Luciano,who led the study, the main message should be that brief moments of physical activity can make a surprisingly large difference to________ ________ calories you burn.", "answer": "how many", "explain": "考查固定短语。句意：这项研究的负责人、米兰大学教授弗朗西斯科·卢西亚诺博士表示，主要的信息应该是，短暂的体育活动，比如站起来泡杯茶，会对你燃烧的卡路里产生惊人的巨大影响。分析句子结构可知，该句为宾语从句，作介词“to”的宾语，“how many”表示“多少”，用于修饰可数名词复数“calories”，它引导的宾语从句“how many calories you burn”表示“你燃烧的卡路里数量”，整个从句作介词“to”的宾语。故填how many。", "source": "松江区", "batch": "2025年高考二模", "id": 41}, {"q": "Understanding________we fall for bad advice is the first step in resisting it.", "answer": "why/how", "explain": "考查宾语从句。句意：理解我们为什么会/如何接受不良建议是抵制它的第一步。空处引导宾语从句，从句缺少原因状语或方式状语，表示“为什么”或“如何”，故填why/how。", "source": "青浦区", "batch": "2025年高考二模", "id": 42}, {"q": "Wang Xuebin, a professor at the Party School of the CPC, explains________stand-up comedy is so popular in China.", "answer": "why", "explain": "考查宾语从句。句意：中共党校教授王学斌解释了脱口秀为什么在中国如此受欢迎。“____ stand up comedy is so popular in China”是宾语从句，根据语境，这里要表达解释的内容是“为什么”脱口秀受欢迎，用连接副词why引导该从句并在从句中作原因状语。故填why。", "source": "金山区", "batch": "2025年高考二模", "id": 43}, {"q": "________Holes tells is the story of Stanley Yelnats, a boy born into a poor family.", "answer": "What", "explain": "考查宾语从句。句意：《洞》讲述的是斯坦利·耶尔纳茨的故事，他是一个出生在贫困家庭的孩子。分析句子结构可知，此处引导主语从句，所以空处应填连接词，从句中tells后缺少宾语，指物，表示“……的事情”，所以用连接代词“what”引导，句子开头字母大写。故填What。", "source": "长宁区", "batch": "2025年高考二模", "id": 44}, {"q": "“We were truly surprised by________we uncovered,” said study co-author Prof Richard Fuller of the University of Queensland.", "answer": "what", "explain": "考查宾语从句。句意：“我们对所发现的感到非常惊讶，”昆士兰大学的研究合著者理查德·富勒教授说。“_____ we uncovered”是宾语从句，从句中谓语动词uncovered缺少宾语，表示“我们所发现的事情”，用连接代词what引导从句。故填what。", "source": "普陀区", "batch": "2025年高考二模", "id": 45}, {"q": "The new group played a set of rock’n’roll covers, new Wings songs and no Beatles tunes. He wanted Wings to make its mistakes away from the hostile gaze of critics, conscious, in particular, ____8____ they would give his wife no quarter.", "answer": "that", "explain": "考查宾语从句。句意：他希望Wings在远离评论家们充满敌意的关注下试错，他尤其清楚，这些评论家绝不会对他的妻子手下留情。这里考查宾语从句，从句句意完整且不缺成分，应用that引导。故填that。", "source": "2026年上海市华东师范大学第二附属中学高三3月英语试题", "batch": "名校名卷汇编", "id": 46}, {"q": "Thai and foreign divers safely led the other eight youngsters out of the cave earlier in the week. \"We are not sure ______ this is a miracle, a science, or what. All 13 Wild Boars are now out of the cave. Everyone is safe,\" the SEALS wrote on Facebook.", "answer": "that", "explain": "句意：我们不确定这是奇迹、科学，还是别的什么。句子结构：We are not sure 后接宾语从句，从句中包含 whether...or... 结构，表示“是……还是……”。固定搭配：whether...or... 用于在两者或多者之间进行选择，符合“不确定是奇迹还是科学”的语境。注意：此处不能用 if，因为 if 引导宾语从句时不能与 or 直接连用。 This is reinforced by the fact, as is often the case in London and New York, ______ long-running musicals tend to become increasingly dependent on tourists, with locals attracted to limited runs of new shows and revivals. 句意：这一点得到了一个事实的印证——在伦敦和纽约，情况往往如此：长期上演的音乐剧往往越来越依赖游客，而当地人则被新剧和复排剧的短期演出所吸引。此处引导同位语从句，解释说明the fact的具体内容，从句不缺成分，故用that引导（that在同位语从句中无实际意义，只起连接作用）。", "source": "2026年上海市杨浦区复旦大学附属中学高三下学期开学英语试题", "batch": "名校名卷汇编", "id": 47}, {"q": "“It is important ________ we confirm our findings in late-onset Alzheimer’s disease and define the time period over which neurofilament changes have to be assessed for optimal clinical predictability,” said senior author Mathias Jucker, who leads the DIAN study in Germany.", "answer": "that", "explain": "考查主语从句。句意：该研究的资深作者、德国DIAN研究负责人Mathias Jucker表示：“我们必须在迟发性阿尔茨海默病中证实我们的发现，并确定评估神经丝变化以获得最佳临床可预测性的时间段，这一点很重要。”此处为固定句型It is important that...，意为“重要的是……”，it为形式主语，that引导的主语从句为真正的主语。故填that。", "source": "上海复旦大学附属中学2026届高三下三月第二次阶段检测", "batch": "名校名卷汇编", "id": 48}, {"q": "Ye Kunkun spent 398 yuan on a special iced Americano at a rural café in southeastern China. That’s no ordinary price. But this is no ordinary coffee shop. ________ distinguishes it is a wooden bench settled an astonishing 70 meters above the sea with breathtaking coastal views.", "answer": "What", "explain": "考查主语从句。句意：它的与众不同之处在于一个木凳，它坐落在海拔70米的地方，可以看到令人惊叹的海岸景色。设空处引导主语从句，从句中缺少主语，表示“使它与众不同的（东西）”，所以用what引导，句首单词首字母大写。故填What。", "source": "2025届上海市杨浦区复旦大学附属中学高三毕业考英语试题", "batch": "名校名卷汇编", "id": 49}, {"q": "Each time a driver intervenes (干预), Tesla registers the correction in its software, which is shared with all the other cars. The idea is ________ over time, the cars will get better at driving.", "answer": "that", "explain": "考查表语从句。句意：这个想法是，随着时间的推移，汽车会越来越擅长驾驶。此处引导表语从句，从句成分和意义都完整，所以用连接词that引导。故填that。", "source": "上海宜川中学2025-2026学年第二学期4月阶段练高三英语试题", "batch": "名校名卷汇编", "id": 50}, {"q": "The teams working on the reconstruction of the spire used the original 19th century plans by architect Eugene Viollet-le-Duc. But they relied on modern computers to run 1,600 hours of calculations to figure out just ________ it was built, and the potential effects of weather and time on the new structure.", "answer": "whoever", "explain": "考查宾语从句。句意：但他们依靠现代计算机进行了1600小时的计算，以弄清楚它是如何建造的，以及天气和时间对新结构的潜在影响。空格处引导的是宾语从句，从句中不缺主语或宾语，句子表示“以弄清楚它是如何建造的”，因此空格处表示“如何”，是how，故填how。 Despite the hardship it has faced, Notre-Dame continues to symbolize the spirit of Paris. The cathedral’s magnificence and enduring presence inspire awe in ________ visits it. 考查宾语从句。句意：大教堂的宏伟和持久的存在使参观它的人感到敬畏。空格处引导的是宾语从句，从句中缺少主语，句子表示“大教堂的宏伟和持久的存在使参观它的人感到敬畏”，空格处意为“任何人”，用whoever，故填whoever。", "source": "上海市大同中学2026年高三上学期10月月考英语试题", "batch": "名校名卷汇编", "id": 51}, {"q": "To find out ________ far their influence could reach, researchers decided to collect hoverflies from a place without any plants nearby — an oil platform in the North Sea, between Scotland and Norway.", "answer": "how", "explain": "考查宾语从句。句意：为了弄清楚它们的影响能有多远，研究人员决定从附近没有任何植物的地方——苏格兰和挪威之间的北海的一个石油平台上收集食蚜蝇。本空引导宾语从句，表示“多么”，用how引导。故填how。", "source": "2026学年上海市闵行区七宝中学高三上学期期中英语试卷", "batch": "名校名卷汇编", "id": 52}, {"q": "I knew ________ it felt like to look for work and find none, and could imagine the bitterness of a man seeing others still able to buy luxuries while he and his family went short of necessities.", "answer": "how", "explain": "考查宾语从句。句意：我清楚求职无门的滋味，也能想象到一个男人看着别人还能买奢侈品，而自己和家人却连必需品都短缺时的酸楚。know后接宾语从句，从句中 felt like后缺宾语，应用连接代词what。故填what。 As evidence grows __  ___ eating less meat can help curb the effects of climate change, more and more Americans are preparing meat-free holiday meals for the first time. 考查同位语从句。句意：随着少吃肉有助于缓解气候变化影响的证据越来越多，越来越多美国人首次准备无肉节日餐食。此处引导同位语从句，解释说明evidence的具体内容，从句成分完整且语义明确，应用that。故填that。 I think this remains an invaluable question for all of us. Our shared humanity includes a collective shared history that can help inform ________ we create our future. 考查宾语从句。句意：我们共同的人性包含着集体共享的历史，这有助于指导我们如何创造未来。此处引导宾语从句，作inform的宾语，根据“a collective shared history”及“we create our future”可知，此处应用how，表示“如何”。故填how。 Yet there are limits too. In theory the new Acela train can run at 160 mph, using tilting (倾斜) technology to go round curves without slowing, but for now, the trains neither tilt nor go any faster. ________ is needed is a track overhaul (彻底翻修) . 考查主语从句。句意：需要的是轨道彻底翻修。空处需用连接词引导主语从句，从句缺少主语，表示所需的事物，所以空处需用连接代词what引导主语从句，句首单词首字母需大写。故填What。 I look after my grandchildren — at least a few hours for one day a week, often more. I love them deeply, and want to offer them ________ steadiness I can, while I can. But love alone isn’t what holds this together. 考查宾语从句。句意：我深爱着他们，想尽我所能，在我还能照顾他们的时候，给予他们一切安稳的陪伴。本空引导宾语从句，作offer的宾语，完整的从句结构是：____ steadiness I can (offer)，本空意为“无论什么样的”，用whatever，作定语，修饰steadiness。故填 whatever。 Sometimes, when the monster has been quiet for a while, people start saying it is gone for good. Some people even drag out that old tale about ________ Pecos Bill (a legendary cowboy hero) heard about the Bear Lake monster and bet some cowboys that he could wrestle that monster until it said uncle. 考查宾语从句。句意：有些人甚至翻出那个老故事，说Pecos Bill（一个传奇牛仔英雄）如何听说了熊湖怪物，并和一些牛仔打赌，说他可以和那个怪物搏斗，直到它认输。空处引导介词about的宾语从句，且表示“如何、怎样”，所以用how引导该从句。故填how。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习试题", "batch": "名校名卷汇编", "id": 53}, {"q": "In the place of honour sat Zeus on his golden throne, and Hera, his sister and wife, sat beside him, while about them assembled the other ten Olympians, whose very presence made it clear __________ they were all brothers, sisters, sons, or daughters of the “father of gods and king of men.” For after his victory over the Titans, Zeus ruled supreme over heaven and earth.", "answer": "that", "explain": "考查宾语从句。句意：宙斯端坐于尊贵的金宝座之上，他的姐妹兼妻子赫拉陪坐一旁，周围簇拥着其他十位奥林匹斯主神，他们的存在足以表明，他们皆是这位“众神之父、万民之王”的兄弟姐妹或子女。分析句子结构可知，空处引导宾语从句，作形容词clear的宾语，从句结构完整、句意明确，所以用连接词that引导，只起连接作用。故填that。", "source": "2026学年上海市徐汇区上海中学高三上学期期中英语试题", "batch": "名校名卷汇编", "id": 54}, {"q": "“This type of sedimentary geology can tell us ____________ the landscape looked like, how it evolved and, importantly, help us identify where we would want to look for past life.”", "answer": "what", "explain": "考查宾语从句。句意：这种沉积地质学可以告诉我们地貌曾经的样子、它是如何演化的，更重要的是，帮助我们确定应该去哪里寻找过去的生命痕迹。此处引导宾语从句，从句中缺少宾语，且表示“……的样子”，用连接代词what。故填what。", "source": "2025-2026学年上海市华二高三上学期第二次周测英语试题", "batch": "名校名卷汇编", "id": 55}, {"q": "Research backs that up. In 2022 Vi Bilagare, a Swedish motoring magazine, measured ________ ________it took drivers to do things like switching to a new radio station or changing the temperature, while driving at 110 kilometres per hour.", "answer": "what", "explain": "考查宾语从句。句意：2022年，瑞典汽车杂志《Vi Bilagare》测量了司机在时速110公里行驶时，切换到新电台或调节温度等操作所需的时间。此处为连接词引导的宾语从句，从句中不缺主语和宾语，但句意不完整，结合句意，此处表示“多长时间”，用连接词how long。故填how long。 上海市杨浦区复旦大学附属中学2025-2026学年高三上学期9月开学英语试题 However, as we’re still not sure how exactly Parkinson’s gets started in the brain, it’s difficult to be sure. The important work of figuring out what triggers Parkinson’s, what might affect our risk of getting the disease, and ________ the approach is, goes on. 考查连接代词。句意：弄清楚是什么引发了帕金森病、什么可能影响我们患这种疾病的风险以及方法是什么等重要工作仍在继续。此处是多个宾语从句并列，作figuring out的宾语，此空是表语，意为 “什么”，应用连接代词what。故填what。", "source": "2026年上海市复旦大学附属中学高三上学期期中英语试题", "batch": "名校名卷汇编", "id": 56}, {"q": "We met at a bar next to the university, and when the accident happened I couldn’t even remember her name. Tell me, ________ could there possibly have been between us to lead your thoughts in that direction?”", "answer": "what", "explain": "考查特殊疑问词。句意：告诉我，我们之间到底有什么能让你的想法往那个方向走？根据句意，表示“到底有什么”应用特殊疑问词what，引导特殊疑问句，作主语。故填what。", "source": "2026学年上海市延安中学高三上学期9月英语试题", "batch": "名校名卷汇编", "id": 57}, {"q": "It's Saturday morning at Sydney's Manly beach and nearly 100 people are bending over piles of litter, sorting them into coloured bags. A judge blows his whistle and calls: “Two minutes!” as a team debates ________ a discarded tennis racket (网球拍) is “heavy waste” — risking a 100-point penalty if they guess wrong.", "answer": "what", "explain": "考查宾语从句。句意：当一名裁判吹响哨子并喊道：“两分钟！”时，一支队伍正在争论一个被丢弃的网球拍是否属于“重垃圾”——如果他们猜错了，就会面临100分的处罚。debate后接宾语从句，根据“risking a 100-point penalty if they guess wrong”可知，此处是在争论是否属于，应用if或whether引导。故填if或whether。 “It was crazy,” he says of the 2023 event. “It was like being in the Olympics . . . it was incredible.”To Partington, _______ is dressed up as a fun event is about raising environmental awareness. 考查主语从句。句意：对Partington来说，这场被包装成有趣活动的赛事是为了提高环保意识。此处引导主语从句，从句缺主语，指物，应用连接代词what引导。故填what。", "source": "2026学年上海市实验学校高三上学期10月考月考英语试卷", "batch": "名校名卷汇编", "id": 58}, {"q": "Having created the impression among some Chinese consumers ________ it is German, Adolph, a Chinese shampoo-maker, now faces the possibility that this very strategy could backfire in the German market. So the takeaway is quite clear: the true art of branding lies in finding a name that travels well.", "answer": "that", "explain": "考查同位语从句。句意：洗发水品牌“Adolph”曾给中国消费者留下“德国货”的印象，如今却在德国市场面临形象反噬。impression后接同位语从句，从句成分完整，且句意完整，所以用t连接词that引导。故填that。", "source": "2026年上海市上进才中学高三上学期期中考试英语试题", "batch": "名校名卷汇编", "id": 59}, {"q": "These years, Chinese words have become more common in the English language. One recent study explored ________ well people in English-speaking countries recognize Chinese expressions.", "answer": "how", "explain": "考查宾语从句。句意：最近的一项研究探究了说英语国家的人对中国表达方式的识别程度如何。本空引导宾语从句，根据well可知，应用副词how，表示“如何”。故填how。 更多优质原创资料请关注公众号：微信号：", "source": "2025-2026学年上海市格致中学高三上学期期中英语试卷", "batch": "名校名卷汇编", "id": 60}, {"q": "Andersen said _____ she hopes is that no groups would work to block progress on the agreement, but instead find a way forward that actually takes into account the fact.", "answer": "what", "explain": "考查主语从句。句意：安徒生说，她希望的是，没有任何团体阻碍该协议的进展。此处引导主语从句，从句中缺少宾语，指事物，应用 “what” 引导，故填 “what”。", "source": "崇明区", "batch": "2025年高考一模", "id": 61}, {"q": "This is reinforced by the fact, as is often the case in London and New York, ______ long-running musicals tend to become increasingly dependent on tourists, with locals attracted to limited runs of new shows and revivals.", "answer": "that", "explain": "句意：这一点得到了一个事实的印证——在伦敦和纽约，情况往往如此：长期上演的音乐剧往往越来越依赖游客，而当地人则被新剧和复排剧的短期演出所吸引。此处引导同位语从句，解释说明the fact的具体内容，从句不缺成分，故用that引导（that在同位语从句中无实际意义，只起连接作用）。", "source": "2026年上海市杨浦区复旦大学附属中学高三下学期开学英语试题", "batch": "名校名卷汇编", "id": 62}, {"q": "Despite the hardship it has faced, Notre-Dame continues to symbolize the spirit of Paris. The cathedral’s magnificence and enduring presence inspire awe in ________ visits it.", "answer": "whoever", "explain": "考查宾语从句。句意：大教堂的宏伟和持久的存在使参观它的人感到敬畏。空格处引导的是宾语从句，从句中缺少主语，句子表示“大教堂的宏伟和持久的存在使参观它的人感到敬畏”，空格处意为“任何人”，用whoever，故填whoever。", "source": "上海市大同中学2026年高三上学期10月月考英语试题", "batch": "名校名卷汇编", "id": 63}, {"q": "As evidence grows __  ___ eating less meat can help curb the effects of climate change, more and more Americans are preparing meat-free holiday meals for the first time.", "answer": "that", "explain": "考查同位语从句。句意：随着少吃肉有助于缓解气候变化影响的证据越来越多，越来越多美国人首次准备无肉节日餐食。此处引导同位语从句，解释说明evidence的具体内容，从句成分完整且语义明确，应用that。故填that。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习试题", "batch": "名校名卷汇编", "id": 64}, {"q": "I think this remains an invaluable question for all of us. Our shared humanity includes a collective shared history that can help inform ________ we create our future.", "answer": "how", "explain": "考查宾语从句。句意：我们共同的人性包含着集体共享的历史，这有助于指导我们如何创造未来。此处引导宾语从句，作inform的宾语，根据“a collective shared history”及“we create our future”可知，此处应用how，表示“如何”。故填how。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习试题", "batch": "名校名卷汇编", "id": 65}, {"q": "Yet there are limits too. In theory the new Acela train can run at 160 mph, using tilting (倾斜) technology to go round curves without slowing, but for now, the trains neither tilt nor go any faster. ________ is needed is a track overhaul (彻底翻修) .", "answer": "What", "explain": "考查主语从句。句意：需要的是轨道彻底翻修。空处需用连接词引导主语从句，从句缺少主语，表示所需的事物，所以空处需用连接代词what引导主语从句，句首单词首字母需大写。故填What。", "source": "2025-2026学年上海市徐汇区上海中学高三上学期练习试题", "batch": "名校名卷汇编", "id": 66}, {"q": "However, as we’re still not sure how exactly Parkinson’s gets started in the brain, it’s difficult to be sure. The important work of figuring out what triggers Parkinson’s, what might affect our risk of getting the disease, and ________ the approach is, goes on.", "answer": "what", "explain": "考查连接代词。句意：弄清楚是什么引发了帕金森病、什么可能影响我们患这种疾病的风险以及方法是什么等重要工作仍在继续。此处是多个宾语从句并列，作figuring out的宾语，此空是表语，意为 “什么”，应用连接代词what。故填what。", "source": "上海市杨浦区复旦大学附属中学2025-2026学年高三上学期9月开学英语试题", "batch": "名校名卷汇编", "id": 67}, {"q": "“It was crazy,” he says of the 2023 event. “It was like being in the Olympics . . . it was incredible.”To Partington, _______ is dressed up as a fun event is about raising environmental awareness.", "answer": "what", "explain": "考查主语从句。句意：对Partington来说，这场被包装成有趣活动的赛事是为了提高环保意识。此处引导主语从句，从句缺主语，指物，应用连接代词what引导。故填what。", "source": "2026学年上海市实验学校高三上学期10月考月考英语试卷", "batch": "名校名卷汇编", "id": 68}], "5": [{"q": "Regardless of which race you choose,______you cross the finish line, you’re officially a Spartan, joining the ranks of nearly 10 million other people.", "answer": "once", "explain": "考查连词。句意：无论你选择哪场比赛，一旦你冲过终点线，你就正式成为一名斯巴达人，加入近1000万人的行列。根据语境可知，此处表示“一旦”，应用连词 once 引导条件状语从句。故填 once。", "source": "宝山区", "batch": "2026年高考一模", "id": 1}, {"q": "Some of these attacks damaged the artworks or display cases ______ ______the National Gallery has now been forced to take protective action.", "answer": "so that", "explain": "考查结果状语从句。句意：其中一些袭击损坏了艺术品或展示柜，因此国家美术馆现在被迫采取保护措施。前后句之间为因果关系，前因后果，用连词 so that“因此，所以”引导结果状语从句。故填 so that。", "source": "长宁区", "batch": "2026年高考一模", "id": 2}, {"q": "In the end, ______ they reflect the truth of human experience, fairy tales are really powerful tales.", "answer": "because", "explain": "考查连词。句意：最后，因为它们反映了人类经验的真相，童话是真正有力量的故事。空处引导状语从句，根据句意可知，两句间是因果关系，所以用 because 引导原因状语从句。故填 because。", "source": "虹口区", "batch": "2026年高考一模", "id": 3}, {"q": "Most patients accepted a slightly larger, more bulbous nose,______a minority even opted for a “wet” nose modification to enhance scent trapping, much like a dog’s.", "answer": "while", "explain": "考查连词。句意：大多数患者接受了稍微更大、更圆润的鼻子，而少数人甚至选择了类似狗的“湿润”鼻子改造，以增强气味捕捉能力。此处表示对比，应用 while 表示前后对比。故填 while。", "source": "徐汇区", "batch": "2026年高考一模", "id": 4}, {"q": "Scientists think that ______ rhinos use their horns in battles to protect their territory, without a horn they may become more careful and avoid conflicts.", "answer": "since/because/as", "explain": "考查连词。句意：科学家认为，因为犀牛用犀角在争斗中保护领地，没有犀角它们会更谨慎，避免冲突。根据前后句的逻辑关系可知，此处引导原因状语从句，意为“因为”，用 because/since/as。故填 because/since/as。", "source": "杨浦区", "batch": "2026年高考一模", "id": 5}, {"q": "______ the visitors from the West came to the East mainly to spread their culture, upon arriving in that ancient kingdom, they discovered its people already possessed their own well-established understanding of the world.", "answer": "Although/Though/While", "explain": "考查连词。句意：尽管西方来客远赴东方主要是为了传播自身文化，但当他们抵达这个古老王国后，却发现这里的人们早已拥有自成体系的世界观。此处引导让步状语从句，表“尽管、虽然”，用连词 Although/Though/While。故填 Although/Though/While。", "source": "奉贤区", "batch": "2026年高考一模", "id": 6}, {"q": "Nowadays many teenagers bring smartphones to classrooms, partly ______ the apps on phones are appealing.", "answer": "because", "explain": "考查状语从句。句意：如今，许多青少年会将智能手机带进教室，部分原因是手机上的应用程序颇具吸引力。引导原因状语从句，表示“因为”用 because。故填 because。", "source": "松江区", "batch": "2026年高考一模", "id": 7}, {"q": "______ the humans and robots ran along separate tracks, likely for safety reasons which you’ll appreciate better in a moment, it was the first time that these two types of participants had taken part in the same race.", "answer": "Although/Though/While", "explain": "考查连词。句意：尽管出于安全原因，人类和机器人分别在不同的赛道上奔跑（这一点你很快就会更清楚），但这是这两类参赛者首次参加同一场比赛。前半句“人类和机器人分道跑”与后半句“首次同场竞技”是让步转折关系，空处应用连词 although/though/while 引导让步状语从句，意为“尽管”。故填 Although/Though/While。", "source": "崇明区", "batch": "2026年高考一模", "id": 8}, {"q": "______ a bear no longer fears humans, it is considered “habituated”, which makes that animal more dangerous.", "answer": "Once/When/If", "explain": "考查连词。句意：当（如果，一旦）一只熊不再害怕人类时，它就被认为是“习惯化的”，这会使它变得更危险。根据句意可知，此处引导时间或条件状语从句，表示“当……时”或表示“一旦”或表示“如果”，用连词 when 或 once 或 if。故填 Once/When/If。", "source": "静安区", "batch": "2026年高考一模", "id": 9}, {"q": "These dogs are seen so strongly as part of the community ______ they share daily life with people and depend on them for food.", "answer": "that", "explain": "考查结果状语从句。句意：这些狗被视为社区中密不可分的一部分，它们与人们共同生活，依靠人类获取食物。空处为结果状语从句的引导词，构成 so…that…，意为“如此……以至于……”。故填 that。", "source": "黄浦区", "batch": "2026年高考一模", "id": 10}, {"q": "Why do Japanese individuals seem healthier ______ they sleep less?", "answer": "though/although/while", "explain": "考查连词。句意：为什么日本人睡眠时间更少，却似乎更健康？此处前后句为转折关系，意为“尽管睡眠时间少，但健康状况好”，应用连词 though/although/while“尽管，虽然”引导让步状语从句。故填 though/although/while。", "source": "嘉定区", "batch": "2026年高考一模", "id": 11}, {"q": "Similarly, the Bund Finance Center has seen growing sales in pet services ______ it upgraded its offerings.", "answer": "since", "explain": "考查连词。句意：同样，外滩金融中心自升级服务以来，宠物服务类销售额持续增长。此处引导时间状语从句，结合主句的谓语动词为现在完成时 has seen 和从句中的谓语动词 upgraded 为一般过去时可知，用连词 since，表“自从……以来”。故填 since。", "source": "金山区", "batch": "2026年高考一模", "id": 12}, {"q": "______ we are living in an age when almost anyone can produce high-quality images with merely a smartphone, people like Bethmann find it easier than ever to secure work.", "answer": "Though/Although/While", "explain": "考查连词。句意：尽管我们生活在一个几乎任何人都能用智能手机拍出高质量照片的时代，但像 Bethmann 这样的人发现找工作比以往更容易。前后句是让步关系，应用连词 Although/Though/While，表示“虽然，尽管”。故填 Though/Although/While。", "source": "闵行区", "batch": "2026年高考一模", "id": 13}, {"q": "He was the one who showed me how to speed up and led me through the streets downtown, laughing ______ I screamed in delight.", "answer": "as/when", "explain": "考查连词。句意：是他教我如何加速，领着我穿过市中心的街道，我开心地尖叫时，他在一旁大笑。空处引导时间状语从句，强调两个动作同时发生，应用连词 as 或 when，译为“当……时”。故填 as/when。", "source": "普陀区", "batch": "2026年高考一模", "id": 14}, {"q": "He was the one who said we should hire bikes. He was the one who showed me how to speed up and led me through the streets downtown, laughing ________ I screamed in delight.", "answer": "as/when", "explain": "考查连词。句意：是他教我如何加速，领着我穿过市中心的街道，我开心地尖叫时，他在一旁大笑。空处引导时间状语从句，强调两个动作同时发生，应用连词as或when，译为“当……时”。故填as/when。", "source": "浦东新区", "batch": "2026年高考一模", "id": 15}, {"q": "McCartney longed to play before audiences again, which he hadn’t ________ the Beatles stopped touring in 1966. But he couldn’t face doing it solo. So he asked Linda to help him put together a new group.", "answer": "since", "explain": "考查连词。句意：麦卡特尼渴望再次在观众面前演出，自从披头士乐队1966年停止巡演以来，他就一直没有这样做过。分析句子结构可知，前面为过去完成时，应用since引导时间状语从句，表“自从”，符合语境。故填since。", "source": "2026年上海市华东师范大学第二附属中学高三3月英语试题", "batch": "名校名卷汇编", "id": 16}, {"q": "“It felt like the robot was doing most of the work for me, and climbing was so much easier,” Zhao recalled. ______ I simply pressed a few buttons under the guidance of the staff, the device automatically adjusted to my walking pace. It was so easy and cool.”", "answer": "After", "explain": "考查连词。句意：“在工作人员的指导下，我只是按了几个按钮，设备就自动调整到我的步行节奏。非常轻松和酷。”根据句意，“按下按钮”发生在“设备调整节奏”之前，用连词after引导时间状语从句，句首单词首字母大写。故填After。", "source": "2026年上海市南洋中学高三下学期3月考英语试题", "batch": "名校名卷汇编", "id": 17}, {"q": "Many people first discovered the band through hit songs such as Radioactive and Demons. Radioactive features strong beats and dramatic energy, ________ Demons expresses the emotional side of human nature.", "answer": "while", "explain": "考查连词。句意：《放射性》具有强烈的节奏感和震撼的活力，而《恶魔》则展现了人性中情感的一面。前后两句对比两首歌曲风格，while表“然而、对比。", "source": "2026年上海市七宝中学高三下学期期中测试英语试卷", "batch": "名校名卷汇编", "id": 18}, {"q": "Giant screens display vivid visuals that match the mood of each song, creating a powerful connection between sound and imagery. ________ the music builds, the entire arena often turns into a sea of lights and voices, making the audience feel like an essential part of the performance.", "answer": "as", "explain": "考查状语从句。句意：随着音乐的渐强，整个场馆常常会变成一片光与声的海洋，让观众感觉自己是这场表演不可或缺的一部分。引导时间状语从句，表示“随着”用as，首字母大写。", "source": "2026年上海市七宝中学高三下学期期中测试英语试卷", "batch": "名校名卷汇编", "id": 19}, {"q": "The boys are expected to leave Chiang Rai Prachanukroh Hospital on Thursday,______ many are still on antibiotics (抗生素). They will be watched for signs of psychological distress, which may only become evident in the months to come.", "answer": "although/though", "explain": "句意：男孩们预计周四离开清莱府普拉查努克罗医院，尽管许多人仍在服用抗生素。逻辑关系：主句“预计出院”与从句“仍在服用抗生素”构成让步关系。连词：although/thoug引导让步状语从句，意为“尽管/虽然”。", "source": "2026年上海市杨浦区复旦大学附属中学高三下学期开学英语试题", "batch": "名校名卷汇编", "id": 20}, {"q": "However, the machine can suddenly break down, as Phantom has found on Broadway______ it returned post-pandemic last year.The biggest difficulty is not the initial investment in a new production, enormous ______ this can be; it is that musicals are very costly to keep going.", "answer": "since；as/though", "explain": "", "source": "2026年上海市杨浦区复旦大学附属中学高三下学期开学英语试题", "batch": "名校名卷汇编", "id": 21}, {"q": "In contrast, protein levels were low and largely steady in people with the healthy form of the gene, and this difference was detectable 16 years ________ cognitive symptoms were expected to arise.", "answer": "before", "explain": "考查连词。句意：相比之下，携带健康基因形式的人的蛋白质水平较低且基本稳定，而这种差异在认知症状预期出现之前的16年就可以检测到。分析句子结构可知，全句为and连接的并列句，and后到句末为第二并列分句。该分句中空格前后都是完整句子，表明空处需填入连词，用before引导时间状语从句，表示“在……之前”。故填before。", "source": "上海复旦大学附属中学2026届高三下三月第二次阶段检测", "batch": "名校名卷汇编", "id": 22}, {"q": "“I was scared at first when I saw the cliff right ahead of me,” Ye recalled days later. “But my fear faded away  ________ ________ ________the coach went first and led me.”", "answer": "as soon as", "explain": "考查连词。句意：但教练一走在前面带领我时，我的恐惧就消失了。设空处引导时间状语从句，表示“一……就……”，故填as soon as。", "source": "2025届上海市杨浦区复旦大学附属中学高三毕业考英语试题", "batch": "名校名卷汇编", "id": 23}, {"q": "However, Tesla’s tech-forward customers seem willing to take the risk, ________ those of us who have to share the road with them would rather they didn’t.", "answer": "while", "explain": "考查连词。句意：然而，特斯拉的技术导向型客户似乎愿意承担这种风险，而我们这些不得不与他们共享道路的人则希望他们不要这样做。根据上文“Tesla’s tech-forward customers seem willing to take the risk(特斯拉的技术导向型客户似乎愿意承担这种风险)”以及下文“those of us who have to share the road with them would rather they didn’t(我们这些不得不与他们共享道路的人则希望他们不要这样做)”可知，前后两句是对比关系，所以用连词while表示“然而”。故填while。", "source": "2026年上海宜川中学高三下学期4月阶段练英语试题", "batch": "名校名卷汇编", "id": 24}, {"q": "This parade is not merely a display of military strength ________ a solemn commitment to upholding peace and learning from history.", "answer": "but", "explain": "考查固定句型。句意：此次阅兵不仅是军事力量的展示，也是维护和平、以史为鉴的庄严承诺。not merely...but...为固定句型，意为“不仅…… 而且……”，故填but。", "source": "2026届上海市杨浦区复旦大学附属中学高三上学期英语模拟预测试题", "batch": "名校名卷汇编", "id": 25}, {"q": "It highlighted that the male-female performance gap in ultra-endurance competitions (events typically more than six hours) is as low as 4 percent, (22) ______ it’s around 10 percent in traditional endurance sport.", "answer": "while", "explain": "考点：并列连词（表对比）。语法规则：空格前后是两个完整的句子，分别介绍“超耐力比赛中男女表现差距低至4%”和“传统耐力运动中差距约为10%”，二者存在对比关系，“while”作连词时可表示“然而”，用于连接对比的内容。句意：它强调，在超耐力比赛（通常超过6小时的项目）中，男女表现差距低至4%，而在传统耐力运动中，这一差距约为10%。", "source": "上海市七宝中学2025-2026学年高三上学期期末考试英语试卷", "batch": "名校名卷汇编", "id": 26}, {"q": "________ is the association still persisted when factors such as smoking and drinking were accounted for, it’s still not enough to prove di
