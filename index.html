 return title('主动与被动语态实验室','Voice Lab','先判断动作关系，再叠加时间关系')+`<section class="panel lab-panel"><div class="lab-select"><label>选择动作场景<select id="voiceScene">${VOICE_SCENES.map((x,i)=>`<option value="${i}" ${voiceCase===i?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>选择时间视角<select id="voiceTense">${Object.keys(item.forms).map(k=>`<option value="${k}" ${voiceTense===k?'selected':''}>${labels[k]}</option>`).join('')}</select></label></div><div class="voice-roles"><div><small>动作执行者 · Agent</small><strong>${esc(item.agent)}</strong></div><span class="voice-arrow">→ ${esc(item.verb)} →</span><div><small>动作承受者 · Patient</small><strong>${esc(item.patient)}</strong></div></div><div class="voice-buttons"><button data-action="setActive" class="${voiceMode==='active'?'selected':''}">主动 Active</button><button data-action="setPassive" class="${voiceMode==='passive'?'selected':''}">被动 Passive</button></div><div class="english voice-sentence">${esc(sample)}</div><div class="notice good">${voiceMode==='active'?'主语执行动作':'主语承受动作'}。时间视角：${labels[voiceTense]}。</div><div class="details"><div class="detail"><small>主语（句子的出发点）</small>${esc(finite)}</div><div class="detail"><small>结构判断</small>${voiceMode==='passive'?esc(item.passiveRules[voiceTense]):esc(item.activeRules[voiceTense])}</div></div><fieldset><legend>即时检查：此句谓语是主动还是被动？</legend><label class="option"><input type="radio" name="vanswer" value="active">主动</label><label class="option"><input type="radio" name="vanswer" value="passive">被动</label></fieldset><button class="primary" data-action="voiceCheck">验证理解</button>${voiceCheck!==null?`<div class="feedback ${voiceCheck?'good':''}" role="status">${voiceCheck?'判断正确！':'请观察：句子主语究竟执行还是承受动作？'} 注意：被动语态是 be + 过去分词，完成时的被动为 have/has been + 过去分词。</div>`:''}<p class="muted">提示：不是所有动词都能转换为被动；此页只使用可转换且语义自然的及物动词。不同语态通过改变句子的叙述重点体现，而非单纯机械换词。</p></section>`;

function gaokaoLab(){

function studentGuide(){return title('学生使用指南','Student Guide','先看懂怎么用，再选择自己的学习路线')+`<section class="guide-intro"><span class="guide-eyebrow">WELCOME TO LEIQIU LAB</span><h2>看一看 · 想一想 · 试一试</h2><p>这是一个可以自己操作的英语语法实验室。遇到看不懂的句子，可以先查看结构，不需要先答对题目。</p><div class="guide-actions"><a href="#explorer">从时态探索开始 →</a><a href="#home">回主页选实验室</a></div></section><div class="section-label"><h2>第一步 · 选择适合自己的实验室</h2></div><section class="guide-modules">${modules.map((m,i)=>`<a href="#${m[0]}" class="guide-module"><span>0${i+1}</span><strong>${m[1]}</strong><small>${['看黑色小人和场景图，理解八种时态的时间关系。','看看“谁做动作、谁承受动作”，掌握主动与被动。','先找分句谓语，再判断 doing、done、to do。','先看概念提示，再辨认定语从句、名词性从句、状语从句。','从一整句话里找到主干、修饰部分与逻辑。','结合上下文完成高考风格语法填空。'][i]}</small><em>进入 →</em></a>`).join('')}</section><section class="guide-section"><h2>第二步 · 看不懂句子，先用结构分析板</h2><p>每个实验室都可以使用结构提示。颜色帮助你观察，不是直接替你完成整道题。</p><div class="guide-legend"><span class="g-main">粉色 · 主句主干</span><span class="g-clause">浅橙 · 从句</span><span class="g-nonfinite">深橙 · 非谓语</span><span class="g-logic">紫色 · 逻辑连接</span></div><div class="guide-steps"><div><b>① 原句</b><p>先尝试自己读一遍。</p></div><div><b>② 结构提示</b><p>看主干或分句边界，找到理解入口。</p></div><div><b>③ 完整高亮</b><p>观察主句、从句与非谓语各在哪里。</p></div><div><b>④ 主干 / 语法与逻辑 / 中文辅助</b><p>点开解释，核对自己的理解。无需先提交答案。</p></div></div><p class="guide-tip">小提示：看高亮时先问自己“主句的谓语是什么”，再看其它部分在修饰谁。</p></section><section class="guide-section"><h2>第三步 · 联系考试，自己尝试作答</h2><div class="guide-steps"><div><b>找依据</b><p>找时间参照点、逻辑主语、连接词和上下文提示。</p></div><div><b>先判断</b><p>考虑时态、语态，以及空格是否需要谓语。</p></div><div><b>再提交</b><p>在题目下方选择或填写答案，点击对应的提交、检查或验证按钮。</p></div><div><b>看解析</b><p>不仅看正确答案，还要说清楚为什么选它。</p></div></div><p class="guide-tip">注意：“yesterday”“since”“when”等是线索，不是看见一个词就能机械选时态。</p></section><section class="guide-section"><h2>你可以这样安排一次自学</h2><div class="guide-route"><span>5 分钟 · 看场景与知识卡</span><span>5 分钟 · 分析句子结构</span><span>5 分钟 · 做题并核对依据</span></div><p>基础薄弱：先从「时态探索」或「主被动实验室」开始。基础较好：可以进入「谓语 / 非谓语」「从句结构」「长难句解剖」，最后挑战「语法综合」。</p></section><section class="guide-section"><h2>关于学习记录</h2><p>网页不需要登录。练习记录在浏览器允许的情况下保存在当前设备上；换设备、清除浏览器数据或使用无痕窗口可能导致记录消失。正式成绩以各练习页实际提交情况为准。</p><div class="guide-actions"><a href="#home">⌂ 回到主页</a><a href="#gaokao">试试语法综合 →</a></div></section>`}

 const body=kind==='sit'?`<path d="M${x} ${y+12} v22 h24 v18 M${x} ${y+34} l-16 18 M${x} ${y+20} l17 9"/>`:kind==='knock'?`<path d="M${x} ${y+12} v35 l-14 22 M${x} ${y+47} l15 22 M${x} ${y+21} l18 -10 M${x} ${y+21} l-13 12"/>`:kind==='present'?`<path d="M${x} ${y+12} v34 l-15 24 M${x} ${y+46} l16 24 M${x} ${y+22} l21 10 M${x} ${y+22} l-16 10"/>`:kind==='walk'?`<path d="M${x} ${y+12} v34 l-16 23 M${x} ${y+46} l14 24 M${x} ${y+22} l16 10 M${x} ${y+22} l-13 12"/>`:`<path d="M${x} ${y+12} v34 l-16 24 M${x} ${y+46} l14 24 M${x} ${y+22} l16 10 M${x} ${y+22} l-13 12"/>`;
 return `<g stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">${body}</g>${head}`;
}
function posterBoard(x,y,w=68,h=88){return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#fff" stroke="#444" stroke-width="3"/><line x1="${x+w/2}" y1="${y+h}" x2="${x+w/2-10}" y2="${y+h+20}" stroke="#444" stroke-width="4"/><line x1="${x+w/2}" y1="${y+h}" x2="${x+w/2+10}" y2="${y+h+20}" stroke="#444" stroke-width="4"/></g>`}
function deskLine(x,y){return `<g stroke="#444" stroke-width="4" fill="none"><line x1="${x}" y1="${y}" x2="${x+50}" y2="${y}"/><line x1="${x+6}" y1="${y}" x2="${x+6}" y2="${y+18}"/><line x1="${x+44}" y1="${y}" x2="${x+44}" y2="${y+18}"/></g>`}
function sceneFigure(kind,x){
  if(kind==='prepare') return `<g>${posterBoard(x+30,52,58,78)}${picturePerson(x,72,'present')}<line x1="${x+18}" y1="${x?96:96}" x2="${x+45}" y2="92" stroke="#444" stroke-width="4"/></g>`;
  if(kind==='teacher') return `<g>${posterBoard(x+38,52,58,78)}${picturePerson(x+10,74,'knock')}<text x="${x+72}" y="42" font-size="12" text-anchor="middle" fill="#555">老师走进来</text></g>`;
  if(kind==='ready') return `<g>${posterBoard(x+22,48,72,82)}<path d="M${x+39} 86 l10 10 20 -24" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${picturePerson(x,76,'stand')}</g>`;
  if(kind==='work') return `<g>${posterBoard(x+30,52,58,78)}${picturePerson(x,72,'present')}</g>`;
  if(kind==='judges') return `<g>${posterBoard(x+18,52,58,78)}${picturePerson(x-8,78,'stand')}${picturePerson(x+88,78,'stand')}<text x="${x+49}" y="42" font-size="12" text-anchor="middle" fill="#555">评委到达</text></g>`;

  return `<g>${picturePerson(x+35,76,'stand')}</g>`;
}

/div>`).join('')}</div><p class="muted">对比：${s.compare}</p>`:''}<fieldset><legend>即时检查 · ${s.check}</legend>${s.options.map((o,i)=>`<label class="option"><input type="radio" name="check" value="${i}">${o}</label>`).join('')}</fieldset><button class="primary" data-action="check">验证理解</button>${sceneResult!==null||teacher&&reveal?`<div class="feedback ${sceneResult===s.answer?'good':''}" role="status">${sceneResult!==null?(sceneResult===s.answer?'判断正确。':'再看参照点与动作状态。'):''}答案：${esc(s.options[s.answer])}。${s.focus}</div>`:''}</section></div>`}
function optionList(q,name,chosen){return q.options.map((o,i)=>`<label class="option ${chosen===i?'selected':''}"><input type="radio" name="${name}" value="${i}" ${chosen===i?'checked':''}><span class="letter">${'ABCD'[i]}</span>${esc(o)}</label>`).join('')}

function repair(){const done=Object.keys(LabStore.data.first).length,wrong=wrongs(),correct=done-wrong.length,counts={};wrong.forEach(q=>counts[q.tense]=(counts[q.tense]||0)+1);const tags=Object.fromEntries(ERROR_TAGS.map(t=>[t,0]));wrong.forEach(q=>{tags[q.errorTag]++;const c=LabStore.data.first[q.id].choice;if(q.options[c].split(' ').length!==q.options[q.correctIndex].split(' ').length)tags['动词形式结构掌握不足']++;});const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return title('错题修复','Error Repair','真实记录，针对性复习')+`<section class="diagnostic panel" id="diagnosticCard"><div class="section-label"><h2>我的时态学习诊断</h2><span class="muted">LEIQIU LAB</span></div><p class="muted">本轮开始：${esc(new Date(LabStore.data.startedAt).toLocaleString('zh-CN'))}</p><div class="stats"><div class="stat"><strong>${done}<span style="font-size:17px"> /12</span></strong><small>首次已完成</small></div><div class="stat"><strong>${done?Math.round(correct/done*100)+'%':'—'}</strong><small>首次作答正确率</small></div><div class="stat"><strong>${wrong.length}</strong><small>本轮首答错题</small></div></div>${!done?'<div class="empty">还没有练习记录。完成第一题后，这里会生成你的学习诊断。</div>':!wrong.length?'<div class="notice good">目前已提交的题目全部正确，没有首答错题。'+(done<12?'继续完成剩余题目后再查看完整结果。':'已完成全部 12 题。')+'</div>':`<h3>各知识点错误题数</h3>${sorted.map(([k,n])=>`<div class="bar-row"><span>${k}</span><span class="bar"><span style="width:${n/wrong.length*100}%"></span></span><b>${n}</b></div>`).join('')}<h3 style="margin-top:25px">可能的错误原因</h3><p class="muted">依据错题标签与选项结构映射，供复习参考；不代表已识别真实心理原因。各分类可能重叠。</p>${Object.entries(tags).map(([k,n])=>`<div class="bar-row"><span>${k}</span><span class="bar"><span style="width:${n/wrong.length*100}%"></span></span><b>${n}</b></div>`).join('')}<div class="notice">建议优先复习：${sorted.slice(0,2).map(x=>x[0]).join('、')}。先找参照点，再核对动作状态和表达重点。</div>`}<h3 style="margin-top:24px">错题复测记录</h3><p class="muted">${LabStore.data.reviews.length?LabStore.data.reviews.slice(-5).map(r=>`${esc(new Date(r.at).toLocaleString('zh-CN'))} · ${r.correct function saveDetectDraft(){const f=$('#detectForm');if(!f)return;const fd=new FormData(f);LabStore.data.detective[di]={values:Object.fromEntries(['ref','relation','state','form'].map(k=>[k,fd.get(k)])),reason:fd.get('reason')};save()}

function groupLevelControl(current,group){return `<div class="actions level-bar">${[1,2,3].map(l=>`<button data-lab-level="${group}:${l}" class="${current===l?'primary':''}">L${l} ${['','基础','进阶','挑战'][l]}</button>`).join('')}</div>`}
function clauseConceptGuide(){return `<aside class="clause-guide" aria-label="从句概念速查"><h3>从句是什么？先看这张概念卡</h3><div class="clause-guide-grid"><div class="clause-guide-card"><strong>定语从句</strong><span>像形容词一样修饰名词或代词，回答“哪一个？什么样的？”</span><em>The boy who won the race...</em></div><div class="clause-guide-card"><strong>名词性从句</strong><span>整个从句相当于名词，可作主语、宾语、表语或同位语。</span><em>What she said surprised me.</em></div><div class="clause-guide-card"><strong>状语从句</strong><span>说明时间、原因、条件、让步等，回答“何时？为什么？在什么条件下？”</span><em>Although it rained, we went out.</em></div></div><p class="clause-guide-note">名词性从句细分：主语从句（作主语）· 宾语从句（作宾语）· 表语从句（作表语）· 同位语从句（解释名词内容）。概念提示不会直接标出本题答案。</p></aside>`}
function clauseLab(){const q=GRAMMAR_STRUCTURES[clauseI],unlocked=!!clauseSubmitted[clauseI]||teacher&&reveal;return title('从句结构实验室','Clause Lab','先找分句边界，再辨认从句功能')+`<section class="panel lab-practice">${groupLevelControl(q.lv,'clause')}${clauseConceptGuide()}<div class="quiz-top"><b>句子 ${clauseI+1} / ${GRAMMAR_STRUCTURES.length}</b><span>目标：${q.topic}</span></div><div class="english">${esc(q.sentence)}</div><p class="muted">请判断重点片段（以题目所指从句为准）：</p><blockquote class="focus-phrase">${esc(q.target)}</blockquote><fieldset><legend>它属于哪种从句？</legend>${[['relative','定语从句'],['noun','名词性从句'],['adverbial','状语从句']].map(([v,n])=>`<label class="option"><input type="radio" name="clauseKind" value="${v}" ${clausePick===v?'checked':''}>${n}</label>`).join('')}</fieldset><div class="actions"><button class="primary" data-lab-action="clauseSubmit" ${unlocked&&!teacher?'disabled':''}>提交判断</button><button data-lab-action="clausePrev" ${clauseI===0?'disabled':''}>上一句</button><button data-lab-action="clauseNext" ${clauseI===GRAMMAR_STRUCTURES.length-1?'disabled':''}>下一句</button></div>${unlocked?`<div class="feedback ${clauseSubmitted[clauseI]===q.kind?'good':''}"><b>${clauseSubmitted[clauseI]===q.kind?'判断正确':teacher&&!clauseSubmitted[clauseI]?'教师参考答案':'建议再次分析'}</b><p>主干：${esc(q.main)}</p><p>${esc(q.explain)}</p><p>${esc(q.zh)}</p></div>`:''}</section>`}
function sentenceLab(){const q=COMPLEX_SENTENCES[sentenceI],unlocked=!!sentenceSubmitted[sentenceI]||teacher&&reveal;const chosen=sentenceSelected[sentenceI]||[];return title('长难句解剖室','Sentence Lab','点击句子片段找到主句主干；点击分析板可先观察结构，提交后还可核对选择')+`<section class="panel lab-practice">${groupLevelControl(q.lv,'sentence')}<div class="quiz-top"><b>句子 ${sentenceI+1} / ${COMPLEX_SENTENCES.length}</b><span>L${q.lv} · ${q.chunks.map(x=>x[0]).join('').trim().split(/\\s+/).length}词左右</span></div><div class="english segmented-sentence">${q.chunks.map(([t,type],i)=>`<button class="sentence-chunk ${chosen.includes(i)?'chosen':''}" data-lab-chunk="${i}" aria-pressed="${chosen.includes(i)}">${esc(t)}</button>`).join('')}</div><p class="muted">点击组成主句主干的片段（不要把从句、后置定语、状语都选进去）。</p><div class="actions"><button class="primary" data-lab-action="sentenceSubmit" ${unlocked&&!teacher?'disabled':''}>提交结构选择</button><button data-lab-action="sentenceClear">清除选择</button><button data-lab-action="sentencePrev" ${sentenceI===0?'disabled':''}>上一句</button><button data-lab-action="sentenceNext" ${sentenceI===COMPLEX_SENTENCES.length-1?'disabled':''}>下一句</button></div>${unlocked?`<div class="feedback ${sentenceSubmitted[sentenceI]?.correct?'good':''}"><b>${sentenceSubmitted[sentenceI]?.correct?'主干判断正确':'查看主干并比较修饰结构'}</b><p>主干：${esc(q.main)}</p><p>${esc(q.grammar)}</p><p>${esc(q.zh)}</p></div>`:''}</section>`}
function chooseLevel(group,l){const ar=group==='clause'?GRAMMAR_STRUCTURES:COMPLEX_SENTENCES;const ix=ar.findIndex(q=>q.lv===l);if(ix<0)return;if(group==='clause'){clauseI=ix;clausePick=''}else sentenceI=ix;render()}

document.addEventListener('click',e=>{const lev=e.target.closest('[data-lab-level]');if(lev){const [g,l]=lev.dataset.labLevel.split(':');chooseLevel(g,Number(l));return}const seg=e.target.closest('[data-lab-chunk]');if(seg){if(sentenceSubmitted[sentenceI]&&!teacher)return;const k=Number(seg.dataset.labChunk);const v=sentenceSelected[sentenceI]||[];sentenceSelected[sentenceI]=v.includes(k)?v.filter(i=>i!==k):[...v,k];render();return}const btn=e.target.closest('[data-lab-action]');if(!btn)return;const v=btn.dataset.labAction;if(v==='clauseSubmit'){if(!clausePick){alert('请先选择从句类型');return}if(!clauseSubmitted[clauseI]){clauseSubmitted[clauseI]=clausePick;try{localStorage.setItem('lq15-clause',JSON.stringify(clauseSubmitted))}catch(e){}}render()}if(v==='clausePrev'||v==='clauseNext'){clauseI+=v==='clausePrev'?-1:1;clausePick='';render()}if(v==='sentenceClear'){sentenceSelected[sentenceI]=[];render()}if(v==='sentencePrev'||v==='sentenceNext'){sentenceI+=v==='sentencePrev'?-1:1;render()}if(v==='sentenceSubmit'){const chosen=sentenceSelected[sentenceI]||[];if(!chosen.length){alert('请先点击句子主干片段');return}const good=COMPLEX_SENTENCES[sentenceI].chunks.flatMap((c,i)=>c[1]==='main'?[i]:[]);const correct=chosen.length===good.length&&good.every(x=>chosen.includes(x));if(!sentenceSubmitted[sentenceI]){sentenceSubmitted[sentenceI]={correct,chosen};try{localStorage.setItem('lq15-sentence',JSON.stringify(sentenceSubmitted))}catch(e){}}render()}});

function noteAnalysisHint(id,mode) {
 if(!['frame','full'].includes(mode)) return;
 const old=analysisHints[id] || {frame:false,full:false};
 old[mode]=true;analysisHints[id]=old;
 try { localStorage.setItem(ANALYSIS_HINT_KEY,JSON.stringify(analysisHints)); } catch(e) {}
}


// V2.0: explicit annotation for each gaokao question, no guessed sentence-wide colouring.
const GAOKAO_SEGMENTS={
 GK01:[['By the time the guests arrived,','clause'],[' the tables ______ (set).','main']],
 GK02:[['In recent years, ',''],['several new libraries ______ (build) in the district.','main']],
 GK03:[['The scientist explained ','main'],['that the device ______ (test) the following week','clause'],['.','']],
 GK04:[['The museum ______ (attract) more than a million visitors so far this year.','main']],
 GK05:[['When the teacher entered,','clause'],[' the students ______ (discuss) the problem heatedly.','main']],

 GK07:[['The documents ______ (translate) into English at the moment,','main'],[' so ','logic'],['they are not ready yet.','main']],
 GK08:[['Hardly ______ we ______ (begin) the ceremony ','main'],['when the lights went out','clause'],['.','']],
 GK09:[['By this time next month, ',''],['the team ______ (complete) the experiment.','main']],

 GK12:[['The new policy ______ (take) effect on January 1 last year.','main']],
};
function exactSegment(sentence,parts){return parts.map(p=>p[0]).join('')===sentence?parts:[[sentence,'']];}
function voiceSegments(sentence,agent,patient){
 const subject=sentence.startsWith(agent)?agent:sentence.startsWith(patient)?patient:null;
 if(!subject)return [[sentence,'']];
 return exactSegment(sentence,[[subject,'main'],[sentence.slice(subject.length),'main']]);
}

function currentLabAnalysis(){
 const pg=page();
 if(pg==='explorer')return {...LAB_ANALYSIS_EXAMPLES[scene],key:'explorer-'+scene,unlocked:true};
 if(pg==='voice'){
  const s=VOICE_SCENES[voiceCase],sentence=s.forms[voiceTense][voiceMode],rule=(voiceMode==='active'?s.activeRules:s.passiveRules)[voiceTense];
  return {key:`voice-${voiceCase}-${voiceTense}-${voiceMode}`,parts:voiceSegments(sentence,s.agent,s.patient),main:sentence,grammar:`${voiceMode==='active'?'主语执行动作。':'主语承受动作。'} ${rule}；完整谓语的时态和语态需要一起判断。`,zh:`${s.name}：${voiceMode==='active'?'主动表达':'被动表达'}。`,unlocked:true};
 }
 if(pg==='predicate'){
  const q=PREDICATE_CASES[predicateIdx],item=PREDICATE_STRUCTURE[predicateIdx];
  return {...item,key:'predicate-'+predicateIdx,grammar:q.clause+' '+q.logic,unlocked:!!predicateSubmitted[predicateIdx]||(teacher&&predicateTeacherReveal)};
 }
 if(pg==='gaokao'){
  const q=GAOKAO_CLOZE[gq],saved=gStore()[q.id];
  return {key:'gaokao-'+gq,parts:GAOKAO_SEGMENTS[q.id]?exactSegment(q.sentence,GAOKAO_SEGMENTS[q.id]):[[q.sentence,'']],main:q.sentence.replace(/_{3,}/g,'[动词空格]'),grammar:q.reason,zh:'本题重点：'+q.tags.join('、')+'。结合语境判断动词形式。',unlocked:!!saved?.submitted||(teacher&&reveal)};
 }
 if(pg==='detective'){
  const d=DETECTIVES[di],q=QUESTIONS[d.q];
  return {key:'detective-'+di,parts:[[q.sentence,'']],main:q.sentence.replace(/_{3,}/g,'[动词空格]'),grammar:q.explanation,zh:'先定位时间参照点，再结合动作状态判断谓语形式。',unlocked:!!detectResult||(teacher&&reveal)};
 }
 if(pg==='challenge'){
  const q=QUESTIONS[qi]||QUESTIONS[0],submitted=!!LabStore.data.first[q.id]||(teacher&&reveal);
  return {key:'challenge-'+qi,parts:[[q.sentence,'']],main:q.sentence.replace(/_{3,}/g,'[动词空格]'),grammar:q.explanation,zh:'结合时间线索与语境选择最合理的时态形式。',unlocked:submitted};
 }
 if(pg==='clause'){const q=GRAMMAR_STRUCTURES[clauseI];return {key:'clause-'+clauseI,parts:q.chunks,main:q.main,grammar:q.explain,zh:q.zh,unlocked:!!clauseSubmitted[clauseI]||(teacher&&reveal)};}
 if(pg==='sentence'){const q=COMPLEX_SENTENCES[sentenceI];return {key:'sentence-'+sentenceI,parts:q.chunks.map(c=>[c[0],c[1]==='detail'?'':c[1]]),main:q.main,grammar:q.grammar,zh:q.zh,unlocked:!!sentenceSubmitted[sentenceI]||(teacher&&reveal)};}
 if(pg==='repair')return {...LAB_ANALYSIS_EXAMPLES[5],key:'repair-example',unlocked:true};
 return null;
}
function sharedAnalysisMarkup(item){
 const state=labAnalysisState[item.key]||{};
 const unlocked=item.unlocked;
 const mode=state.mode||'none';
 // When the answer is not submitted, show only structurally safe hints.
 // Never substitute the blank with the correct verb form.
 const original=item.parts.map(([v,type])=>`<span class="syntax-part ${type?'syntax-'+type:''}">${esc(v)}</span>`).join('');
 const buttons=[['main','① 主干'],['grammar','② 语法与逻辑'],['zh','③ 中文辅助']];
 const used=analysisHints[item.key]||{};
 const annotated=item.parts.some(p=>p[1]);
 return `<section class="unified-analysis syntax-board v16-board" id="labAnalysis" aria-label="句子结构分析板">
 <div class="analysis-top"><div><strong>句子结构分析板</strong><small>SENTENCE ANALYSIS · 点击即可观察结构与讲解，不需要先答题</small></div><span class="analysis-chip">随时查看 · 自主学习</span></div>
 <div class="syntax-legend"><span class="syntax-main">主句主干</span><span class="syntax-clause">从句</span><span class="syntax-nonfinite">非谓语</span><span class="syntax-logic">逻辑连接</span></div>
 <div aria-live="polite" class="syntax-original ${mode==='frame'?'syntax-frame':mode==='full'?'syntax-show':''}">${original}</div>
 <p class="analysis-guidance">${mode==='none'?'先看原句；需要帮助可以随时打开结构提示。':mode==='frame'?'先观察粉色主句框架，再尝试寻找谓语和空格位置。':annotated?'已显示经核对的结构分色，可点击下方进一步解释。':'本句尚未完成逐段结构标注，暂不使用推测性高亮；可点击主干与语法逻辑查看说明。'}</p>
 <div class="syntax-actions analysis-modes" role="group" aria-label="结构提示程度">
 <button type="button" data-analysis="mode-none" aria-pressed="${mode==='none'}">原句</button>
 <button type="button" data-analysis="mode-frame" aria-pressed="${mode==='frame'}">① 结构提示</button>
 <button type="button" data-analysis="mode-full" aria-pressed="${mode==='full'}">② 完整高亮</button>
 ${buttons.map(([key,label])=>`<button type="button" data-analysis="${key}" aria-expanded="${!!state[key]}">${label}</button>`).join('')}
 </div>
 ${state.main?`<div class="syntax-reveal"><b>MAIN STRUCTURE / 主干</b><p>${esc(item.main)}</p></div>`:''}
 ${state.grammar?`<div class="syntax-reveal"><b>KEY GRAMMAR / 语法与逻辑</b><p>${esc(item.grammar)}</p></div>`:''}
 ${state.zh?`<div class="syntax-reveal"><b>CHINESE NOTES / 中文辅助</b><p>${esc(item.zh)}</p></div>`:''}
 <p class="hint-record">${used.full?'本题已使用：完整高亮':used.frame?'本题已使用：结构提示':'本题尚未使用结构提示'} · 仅记录辅助情况，不影响正确率</p>
 </section>`;
}
function placeSharedAnalysis(){
 const item=currentLabAnalysis();if(!item)return;
 const pageTitle=document.querySelector('#app > .page-title');
 if(pageTitle)pageTitle.insertAdjacentHTML('afterend',sharedAnalysisMarkup(item));
}
document.addEventListener('click',event=>{
 const btn=event.target.closest('[data-analysis]');if(!btn)return;
 const item=currentLabAnalysis();if(!item)return;
 const key=btn.dataset.analysis;
 if(key==='jump-answer'){
   const target=document.querySelector('#app .lab-practice, #app .predicate-lab, #app .lab-panel, #app .quiz, #app .panel');
   if(target){target.scrollIntoView({behavior:'smooth',block:'start'});const submit=target.querySelector('[data-lab-action$="Submit"], [data-action$="Submit"], .primary');if(submit){submit.setAttribute('data-answer-target','true')}}
   return;
 }
 labAnalysisState[item.key]||={};
 if(key.startsWith('mode-')){
  const mode=key.slice(5);

  labAnalysisState[item.key].mode=mode;
  noteAnalysisHint(item.key,mode);
 }else{
  if(!['main','grammar','zh'].includes(key))return;
  labAnalysisState[item.key][key]=!labAnalysisState[item.key][key];
 }
 const previous=document.getElementById('labAnalysis');if(previous)previous.outerHTML=sharedAnalysisMarkup(item);
});

(function(){
 const pairs={
 past:{left:['一般过去时','I <strong>finished</strong> my science fair poster yesterday.','昨天完成了海报，陈述过去发生的事实。'],right:['现在完成时','I <strong>have finished</strong> my science fair poster, so it is ready now.','过去做完海报，强调现在已经准备好了。'],point:'同一“完成海报”事件，yesterday 指向明确的过去；have finished 关注与现在的联系。'},

 };
 function show(type){const wrap=document.getElementById('v27-compare-body');if(!wrap)return;const d=pairs[type]||pairs.past;wrap.innerHTML='<div class="v27-pair"><article><h3>'+d.left[0]+'</h3><div class="sentence">'+d.left[1]+'</div><p>'+d.left[2]+'</p></article><article><h3>'+d.right[0]+'</h3><div class="sentence">'+d.right[1]+'</div><p>'+d.right[2]+'</p></article></div><div class="v27-explain"><strong>判断依据：</strong>'+d.point+'</div>';document.querySelectorAll('[data-v27-compare]').forEach(b=>{const on=b.dataset.v27Compare===type;b.classList.toggle('is-active',on);b.setAttribute('aria-pressed',String(on));});}
